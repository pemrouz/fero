<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fero — debug · capture explorer</title>
<!-- ─────────────────────────────────────────────────────────────────────────
     IDIOM: outline + inspector (the v2 tree.html mockup, adopted verbatim) on
     the pure-black monochrome + gold-accent design system. ONE page, ONE data
     model — the capture — and everything on screen is a FOLD of it via
     ./model.mjs (the same bytes Node's tests replay), so viewer and kernel
     structurally cannot drift.
       LEFT  = a filterable TREE: Nodes (→ links, streams), Writes (the
               (origin,seq) route join), Cells (the LWW elections), Violations.
       TOP   = ONE omni filter that PRUNES the whole hierarchy at once
               (is:crit collapses the tree to just the bad branches).
       RIGHT = the INSPECTOR — the selected row's rich leaf view (the node's
               journal mini-log, the write's route timeline, the cell's
               election) in a pane that collapses when nothing is selected.
       BOTTOM= breadcrumb (location) + level-scoped rollup + the time-travel
               scrubber (beyond v2, kept visually quiet): replay every node's
               journal to an event index through the same stateAt() fold the
               replay oracle uses — and its links/streams through topologyAt(),
               only where verifyTopology() proved that replay reproduces the
               captured end tables (elsewhere the end shows, labelled '@ end').
     HONESTY RULES (v2's hard-won debug ethics): folds derive, never
     synthesize; absent data renders as absent ('—', 'record not captured');
     truncation disables time-travel loudly instead of reconstructing fiction.
     Colour stays FUNCTIONAL (severity only); gold is chrome, never a status.
     ───────────────────────────────────────────────────────────────────── -->
<!-- sharp technical type: Inter (UI) + JetBrains Mono (data/labels) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    /* pure-black high-contrast monochrome: #000 ground, near-pure-white ink, crisp
       hairlines lifted enough to read on true black — maximum black/white range */
    --bg:#000000; --rail:#0a0a0c; --pane:#0c0c0e; --line:#2a2a30; --line-2:#3b3b43;
    --ink:#fbfcfe; --dim:#a2a2ac; --soft:#70707a; --faint:#48484f;
    --gold:#ecc36a; --gold-2:#caa24a;                                /* brand/chrome accent — selection bar, focus ring, omni glow (NOT a status colour) */
    --sel:#221b0a; --sel-line:var(--gold); --hover:#141417;
    --crit:#f0655d; --crit-bg:#2a1614; --warn:#e0a93f; --warn-bg:#261f10;
    --ok:#5fc78f; --ok-bg:#13241b; --info:#62a6ec; --info-bg:#11212f;
    --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
    --ui:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.5 var(--ui);
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow:hidden;display:flex;flex-direction:column}
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
  a{color:var(--info);text-decoration:none} a:hover{text-decoration:underline}
  /* a navigable reference token (a node uuid / origin#seq / cell that IS a tree row) — click jumps the tree there. Discoverable via a faint dotted underline; lights up gold on hover. */
  .ref{cursor:pointer;border-bottom:1px dotted var(--faint);transition:color .1s,border-color .1s}
  .ref:hover{color:var(--gold);border-bottom-color:var(--gold-2)}
  /* ELI5 tooltips: ./eli5.mjs injects the card and [data-tip]{cursor:help}; clickable chrome that also explains itself keeps its pointer */
  .oitem[data-tip],.cseg[data-tip],.iclose[data-tip],.oclear[data-tip],.treset[data-tip],.ox[data-tip],.ochip[data-tip]{cursor:pointer}
  ::selection{background:var(--sel)}

  /* ── top command bar: just the ONE omni filter box, edge to edge — pure black ── */
  .bar{display:flex;align-items:center;justify-content:center;gap:0;height:60px;background:#000;position:relative;
    border-bottom:1px solid var(--line);padding:0 26px;flex:0 0 auto;font-size:12.5px}

  /* the omni box — a single control: search icon + active chips + free-text input
     + an in-box match count and a reset ✕, with a suggestions dropdown on focus. */
  .omni{position:relative;display:flex;align-items:center;gap:8px;flex:0 1 auto;height:38px;
    min-width:470px;max-width:760px;
    background:#17171d;border:1px solid #44444e;border-radius:0;padding:0 12px 0 14px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.06), 0 4px 14px rgba(0,0,0,.6), 0 0 20px rgba(225,190,110,.12)}
  .omni:hover{border-color:#4d4d57}
  .omni.focus{border-color:var(--sel-line);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.06), 0 0 0 3px rgba(236,195,106,.18), 0 4px 14px rgba(0,0,0,.6)}
  .omni .oicon{color:var(--gold-2);font-size:13px;flex:0 0 auto}
  .omni .ochips{display:flex;align-items:center;gap:6px;flex:0 0 auto}
  .omni input{background:none;border:0;outline:0;color:var(--ink);font:inherit;font-family:var(--mono);
    font-size:12px;flex:1 1 300px;min-width:70px;height:100%}
  .omni input::placeholder{color:var(--soft);font-family:var(--ui)}
  .omni .ocount{flex:0 0 auto;color:var(--soft);font-family:var(--mono);font-size:11px;white-space:nowrap;font-variant-numeric:tabular-nums}
  .omni .ocount .fl{color:var(--warn);font-weight:600}
  .omni .oclear{flex:0 0 auto;cursor:pointer;color:var(--soft);font-size:12px;line-height:1;padding:2px 4px;border-radius:5px}
  .omni .oclear:hover{color:var(--ink);background:rgba(255,255,255,.07)}
  /* chips: only the gold time-travel chip lives here (the filter is the query string itself) */
  .ochip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 5px 0 10px;border-radius:6px;
    font-family:var(--mono);font-size:11px;white-space:nowrap;flex:0 0 auto;
    background:#121317;border:1px solid var(--line-2);color:var(--ink)}
  .ochip .pd{width:5px;height:5px;border-radius:50%;flex:0 0 auto;background:var(--soft)}
  .ochip.tt .pd{background:var(--gold)}
  .ochip.tt{border-color:var(--gold-2);color:var(--gold)}
  .ochip .ox{cursor:pointer;color:var(--soft);font-size:13px;line-height:1;padding:0 3px;border-radius:4px;margin-left:2px}
  .ochip .ox:hover{color:var(--ink);background:rgba(255,255,255,.10)}
  /* suggestions dropdown (focus-only) */
  .omenu{display:none;position:absolute;top:calc(100% + 7px);left:0;width:420px;background:var(--pane);
    border:1px solid var(--line-2);border-radius:10px;box-shadow:0 14px 44px #000d;z-index:40;padding:6px;max-height:60vh;overflow:auto}
  .omni.focus .omenu{display:block}
  .omenu .oh{font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);padding:7px 9px 5px;font-family:var(--ui)}
  .omenu .oitem{display:flex;align-items:center;gap:8px;padding:5px 9px;border-radius:6px;cursor:pointer;color:var(--ink)}
  .omenu .oitem:hover{background:var(--hover)}
  .omenu .oitem .od{width:7px;height:7px;border-radius:2px;transform:rotate(45deg);flex:0 0 auto}
  .omenu .oitem .ot{font-family:var(--mono);font-size:12px;flex:0 0 auto}
  .omenu .oitem .onote{font-size:10.5px;color:var(--soft);font-family:var(--ui);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1 1 auto;min-width:0}
  .omenu .oitem .oc{flex:0 0 auto;color:var(--soft);font-family:var(--mono);font-size:11px;font-variant-numeric:tabular-nums}
  .omenu .osep{height:1px;background:var(--line);margin:5px 6px}

  /* live-feed / scenario indicator (plain file mode shows nothing); sits at the bar's right */
  .srcname{position:absolute;right:26px;top:0;height:100%;display:flex;align-items:center;color:var(--soft);font-family:var(--mono);font-size:11px;white-space:nowrap}
  .srcname .liveDot{color:var(--ok);animation:livePulse 1.6s ease-in-out infinite}
  @keyframes livePulse{0%,100%{opacity:1}50%{opacity:.35}}
  .srcname b{color:var(--dim);font-weight:600}
  .srcname .paused{color:var(--warn);font-weight:600}

  /* ── 2-pane body: tree | inspector ─────────────────────────────────── */
  .body{display:grid;grid-template-columns:minmax(0,1fr) 396px;flex:1 1 auto;min-height:0}
  .body.noinsp{grid-template-columns:minmax(0,1fr)}   /* nothing selected / closed → the tree reclaims the inspector's column */
  .body.noinsp .insp{display:none}

  /* ── TREE ──────────────────────────────────────────────────────────── */
  .tree{overflow:auto;background:var(--bg);min-width:0;padding:10px 0}
  /* full-bleed rows: background, hover, selected accent and the section hairline
     all span edge-to-edge; stats right-align within a roomy gutter */
  .trow{display:flex;align-items:center;gap:7px;height:32px;padding-right:28px;cursor:pointer;white-space:nowrap;position:relative}
  .trow:hover{background:var(--hover)}
  .trow[aria-selected=true]{background:var(--sel);box-shadow:inset 2px 0 0 var(--sel-line)}   /* crisp left accent on the selected row */
  .trow.dim{opacity:.42}
  .trow .tw{width:15px;text-align:center;color:var(--soft);flex:0 0 auto;font-size:9px}
  .trow .tw.leaf{visibility:hidden}
  .trow .sd{width:7px;height:7px;border-radius:2px;transform:rotate(45deg);flex:0 0 auto;background:transparent}
  .trow[data-sev=crit] .sd{background:var(--crit)} .trow[data-sev=warn] .sd{background:var(--warn)} .trow[data-sev=info] .sd{background:var(--info)}
  .trow .ic{width:14px;text-align:center;color:var(--soft);flex:0 0 auto;font-family:var(--mono);font-size:11px}
  .trow .lab{font-family:var(--mono);font-size:12.5px;color:var(--ink);flex:0 0 auto}
  .trow[aria-selected=true] .lab{color:#fff}
  .trow[data-sev=crit] .lab{color:#f0a39c} .trow[aria-selected=true][data-sev=crit] .lab{color:#fff}
  .trow[data-type=group] .lab{font-family:var(--ui);font-weight:700;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--soft)}
  .trow[data-type=group] .gc{color:var(--faint);font-size:11px;margin-left:5px;font-family:var(--mono)}
  /* top-level groups (Nodes / Writes / Cells / Violations) get resource-row presence: taller + hairline + gold mark */
  .trow[data-type=group][data-depth="0"]{height:38px}
  .trow[data-type=group][data-depth="0"]:not(:first-child){border-top:1px solid var(--line)}
  .trow[data-type=group][data-depth="0"] .ic{color:var(--gold-2)}
  .trow[data-type=group][data-depth="0"] .lab{font-size:11px;color:var(--dim)}
  .trow[data-type=more] .lab{color:var(--soft);font-family:var(--ui);font-size:11.5px;font-style:italic}
  .trow .grow{flex:1 1 auto;min-width:10px}
  .trow .meta{display:inline-flex;align-items:center;font-family:var(--mono);font-size:11px;color:#93939c;font-variant-numeric:tabular-nums;min-width:0;overflow:hidden}
  /* each stat is a fixed-width, right-aligned cell → the same column lines up across sibling rows */
  .trow .meta .stat{flex:0 0 auto;display:inline-block;text-align:right;padding-left:15px;white-space:nowrap}
  .trow .meta .stat .su{color:var(--soft)}
  .trow .meta .stat.bad{color:var(--crit)} .trow .meta .stat.bad .su{color:var(--crit)}
  .trow .meta .stat.warn{color:var(--warn)} .trow .meta .stat.warn .su{color:var(--warn)}
  .trow .meta .bad{color:var(--crit);font-weight:600} .trow .meta .warnt{color:var(--warn);font-weight:600} .trow .meta .x{color:var(--faint)} .trow .meta .info{color:var(--info);font-weight:600}
  .trow .meta .kk{color:var(--dim)}
  /* pill is the FIRST column of the right cluster → stats stay anchored to the row's right edge whether or not a row has a badge */
  .trow .pillwrap{flex:0 0 auto;width:120px;display:flex;justify-content:flex-end;align-items:center}
  .pill{display:inline-flex;align-items:center;gap:5px;font-size:9.5px;font-weight:700;letter-spacing:.03em;
    text-transform:uppercase;padding:1px 7px;border-radius:3px;white-space:nowrap;flex:0 0 auto}
  .pill .pd{width:5px;height:5px;border-radius:50%;flex:0 0 auto}
  .pill.ok{color:var(--ok);background:var(--ok-bg);border:1px solid #1f3a2c} .pill.ok .pd{background:var(--ok)}
  .pill.crit{color:var(--crit);background:var(--crit-bg);border:1px solid #4a2622} .pill.crit .pd{background:var(--crit)}
  .pill.warn{color:var(--warn);background:var(--warn-bg);border:1px solid #443613} .pill.warn .pd{background:var(--warn)}
  .pill.info{color:var(--info);background:var(--info-bg);border:1px solid #234055} .pill.info .pd{background:var(--info)}

  /* ── INSPECTOR (right) ─────────────────────────────────────────────── */
  .insp{background:var(--pane);border-left:1px solid var(--line);overflow-y:auto;display:flex;flex-direction:column}
  .insp .ih{padding:15px 16px 13px;border-bottom:1px solid var(--line)}
  .insp .ih .ik{font-family:var(--mono);font-size:15px;font-weight:600;color:#fff;display:flex;align-items:center;gap:8px;min-width:0}
  .insp .ih .ik .tt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
  .insp .ih .ik .sd{width:9px;height:9px;border-radius:2px;transform:rotate(45deg);flex:0 0 auto}
  .insp .ih.ok .ik .sd{background:var(--ok)} .insp .ih.crit .ik .sd{background:var(--crit)} .insp .ih.warn .ik .sd{background:var(--warn)} .insp .ih.info .ik .sd{background:var(--info)}
  .insp .ih .kind{font-family:var(--ui);font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--soft);margin-left:auto;flex:0 0 auto}
  .insp .ih .iclose{margin-left:4px;cursor:pointer;color:var(--soft);font-size:13px;line-height:1;padding:0 2px;flex:0 0 auto}
  .insp .ih .iclose:hover{color:var(--ink)}
  .insp .ih .isub{margin-top:5px;color:var(--dim);font-size:11.5px;line-height:1.45;word-break:break-word}
  .insp .ih .isub .mono{color:var(--ink)} .insp .ih .isub .bad{color:var(--crit)} .insp .ih .isub .warnt{color:var(--warn)}
  .insp .seg{padding:14px 16px;border-bottom:1px solid var(--line)}
  /* the time-travel banner — gold like the tread: one glance says "this pane is a replay" */
  .tban{padding:7px 16px;border-bottom:1px solid var(--line);font:600 10.5px var(--mono);color:var(--gold);background:color-mix(in srgb, var(--gold) 7%, transparent)}
  .insp .seg .st{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);margin-bottom:9px;display:flex;gap:7px;align-items:center}
  .insp .seg .st .stn{margin-left:auto;color:var(--faint);font-weight:600;letter-spacing:0;font-family:var(--mono)}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:12px}
  .kv dt{color:var(--soft)} .kv dd{margin:0;color:var(--ink);font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;overflow:hidden;text-overflow:ellipsis}
  .kv dd.bad{color:var(--crit)} .kv dd.warn{color:var(--warn)} .kv dd.ok{color:var(--ok)}
  /* mini log (the node's journal · the cell's election) */
  .mlog{display:flex;flex-direction:column;font-family:var(--mono);font-size:11.5px}
  .mlog .mr{display:grid;grid-template-columns:56px 1fr auto;gap:9px;align-items:center;padding:4px 0;border-bottom:1px solid var(--line)}
  .mlog .mr:last-child{border-bottom:0}
  .mlog .mr .stp{color:var(--soft)} .mlog .mr .stp .e{color:var(--faint)}
  .mlog .mr .kvv{color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mlog .mr .kvv .kk{color:var(--dim)}
  .mlog .mr .oc{font-size:10px;font-weight:700;text-transform:uppercase}
  .mlog .mr .oc.applied,.mlog .mr .oc.local{color:var(--ok)} .mlog .mr .oc.fwd{color:var(--dim)} .mlog .mr .oc.fence{color:var(--warn)} .mlog .mr .oc.conflict{color:var(--crit)}
  .mlog .mr[data-nav]{cursor:pointer;margin:0 -6px;padding-left:6px;padding-right:6px;border-radius:4px}
  .mlog .mr[data-nav]:hover{background:var(--hover)}
  /* route timeline */
  .tl{list-style:none;margin:0;padding:0 0 0 2px}
  .tl li{position:relative;padding:0 0 11px 18px;font-size:11.5px;line-height:1.5;color:var(--dim)}
  .tl li:last-child{padding-bottom:0}
  .tl li::before{content:'';position:absolute;left:3px;top:4px;width:7px;height:7px;border-radius:50%;background:var(--faint);border:2px solid var(--pane);z-index:1}
  .tl li::after{content:'';position:absolute;left:6px;top:11px;bottom:-1px;width:1px;background:var(--line-2)} .tl li:last-child::after{display:none}
  .tl li.done::before{background:var(--ok)} .tl li.move::before{background:var(--warn)} .tl li.now::before{background:var(--info)} .tl li.bad::before{background:var(--crit)}
  .tl li .ep{font-family:var(--mono);color:var(--ink);font-weight:600;margin-right:6px} .tl li .mono{color:var(--ink)} .tl li b{color:var(--ink)} .tl li .bad{color:var(--crit)} .tl li .x{color:var(--faint)}
  .reason{font-size:12px;line-height:1.55;color:var(--dim)} .reason b{color:var(--ink);font-weight:600}
  /* per-node value / links / streams tables */
  .vt{font-family:var(--mono);font-size:11.5px;width:100%;border-collapse:collapse}
  .vt th{text-align:left;color:var(--soft);font-weight:600;font-size:10px;text-transform:uppercase;letter-spacing:.04em;padding:0 0 5px;border-bottom:1px solid var(--line)}
  .vt td{padding:5px 8px 5px 0;border-bottom:1px solid var(--line);color:var(--ink)} .vt tr:last-child td{border-bottom:0}
  .vt td.node{color:var(--dim)} .vt .min{color:var(--crit)} .vt .maj{color:var(--ok)}
  .empty2{padding:30px 16px;color:var(--soft);font-size:12px;line-height:1.6;text-align:center}
  .recd{font-family:var(--mono);font-size:11.5px;color:var(--dim);line-height:1.6;white-space:pre-wrap;word-break:break-word;background:#0c0e12;border:1px solid var(--line);border-radius:5px;padding:9px 11px}
  .recd .kk{color:var(--info)} .recd .vv{color:var(--ink)} .recd .bad{color:var(--crit)}

  /* ── bottom status bar: time-travel scrubber (left, quiet) · selection breadcrumb (center) · level-scoped rollup (right) ── */
  .keys{display:flex;align-items:center;justify-content:center;position:relative;height:30px;background:var(--rail);
    border-top:1px solid var(--line);padding:0 20px;flex:0 0 auto;font-size:11px;color:var(--soft)}
  .crumb{display:flex;align-items:center;min-width:0;overflow:hidden;font-family:var(--mono);font-size:11.5px}
  .crumb .cseg{color:var(--dim);cursor:pointer;white-space:nowrap}
  .crumb .cseg:hover{color:var(--ink)} .crumb .cseg.cur{color:var(--gold);font-weight:600}
  .crumb .csep{color:var(--faint);padding:0 8px;flex:0 0 auto}
  .kright{position:absolute;right:20px;top:0;height:100%;display:flex;align-items:center;flex:0 0 auto;max-width:44%;overflow:hidden}
  .kright .right{font-family:var(--mono);color:var(--soft);white-space:nowrap}
  .keys .sst{font-weight:600} .keys .sst.crit{color:var(--crit)} .keys .sst.warn{color:var(--warn)}
  .keys .sst.ok{color:var(--ok)} .keys .sst.info{color:var(--info)}
  /* the scrubber: visually quiet — a thin range + a mono readout + a reset ✕ */
  .scrub{position:absolute;left:20px;top:0;height:100%;display:flex;align-items:center;gap:8px}
  .scrub input[type=range]{width:150px;height:3px;accent-color:var(--gold-2);cursor:pointer;margin:0}
  .scrub input[type=range]:disabled{opacity:.35;cursor:not-allowed}
  .scrub .tread{font-family:var(--mono);font-size:10.5px;color:var(--soft);font-variant-numeric:tabular-nums;white-space:nowrap}
  .scrub .tread.on{color:var(--gold)}
  .scrub .treset{cursor:pointer;color:var(--soft);font-size:12px;line-height:1;padding:0 3px}
  .scrub .treset:hover{color:var(--ink)}
</style>
</head>
<body>

<!-- ── command bar: the ONE omni filter box — chips + input + match count + reset ✕ + suggestions ── -->
<div class="bar">
  <div class="omni" id="omni">
    <span class="oicon" data-tip="filter">⌕</span>
    <div class="ochips" id="ochips"></div>
    <input id="q" spellcheck="false" placeholder="filter the whole tree — a name, a facet (write:lww-lost), or is:crit" autocomplete="off" data-tip="filter">
    <span class="ocount" id="ocount" data-tip="matches"></span>
    <span class="oclear" id="oclear" data-tip="filter-clear">✕</span>
    <div class="omenu" id="omenu"></div>
  </div>
  <span class="srcname" id="srcName"></span>
  <input type="file" id="file" accept=".json,application/json" hidden>
</div>

<div class="body noinsp">
  <!-- ── LEFT: the tree ── -->
  <div class="tree" id="tree"></div>
  <!-- ── RIGHT: the inspector ── -->
  <aside class="insp" id="insp"></aside>
</div>

<!-- ── bottom status bar: scrubber + selection breadcrumb + level-scoped rollup ── -->
<div class="keys">
  <span class="scrub" id="scrub">
    <input type="range" id="trange" min="0" max="0" step="1" value="0" data-tip="time-travel">
    <span class="tread" id="tread" data-tip="tread"></span>
    <span class="treset" id="treset" data-tip="time-travel-reset" style="display:none">✕</span>
  </span>
  <div class="crumb" id="crumb"></div>
  <div class="kright"><span class="right" id="statusRight"></span></div>
</div>

<script type="module">
// the ONE model seam: every derivation on this page comes from model.mjs — the
// same bytes Node's capture tests replay, so the folds structurally cannot drift.
// The viewer NEVER reimplements LWW: stateAt/routes/contested/verifyReplay do
// all conflict reasoning; this file is projection + interaction only.
import { decodeVal, kindNames, cellKey, stateAt, verifyReplay, routes, contested, summarize, topologyAt, verifyTopology } from './model.mjs';
// the ELI5 layer: every data-tip="<key>" on this page resolves in ./eli5.mjs (the shared glossary + hover card)
import { mountTips } from './eli5.mjs';

// ═══ DATA LAYER : BEGIN ══════════════════════════════════════════════════
// Pure functions only — no DOM between the markers. The validation harness
// (scratchpad/viewer-check.mjs) extracts this slice verbatim and runs it under
// Node against a real capture, so keep every function here document-free.

// esc() — EVERY user-derived string (keys, values, uuids, wire reasons) passes
// through here before touching innerHTML; capture content is arbitrary user data.
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const klog = n => n>=1000 ? (n/1000).toFixed(n>=10000?0:1)+'k' : ''+n;
// watermark normalizer: M4a captures carry the ladder {a: applied, s: shippable, d: durable};
// pre-M4a captures carried a bare number (the applied watermark) — both stay renderable.
const wm = v => typeof v === 'number' ? { a: v, s: v, d: 0 } : (v || { a: 0, s: 0, d: 0 });

// ── value rendering: decodeVal() then a bounded one-line preview ──
// strings '…' ~32 · numbers literal (NaN/-0/±Infinity survive the codec)
// · Uint8Array 0x-hex (8 bytes) · objects/arrays one-line JSON-ish ~40 with …
const jline = (v) => {
  if (v === undefined) return 'undefined';
  if (v === null) return 'null';
  if (typeof v === 'string') return "'" + (v.length > 32 ? v.slice(0, 32) + '…' : v) + "'";
  if (typeof v === 'number') return Object.is(v, -0) ? '-0' : String(v);   // String() keeps NaN / Infinity / -Infinity literal
  if (v instanceof Uint8Array) {
    let h = ''; for (let i = 0; i < Math.min(8, v.length); i++) h += v[i].toString(16).padStart(2, '0');
    return '0x' + h + (v.length > 8 ? '…' : '');
  }
  if (Array.isArray(v)) return '[' + v.map(jline).join(',') + ']';
  if (typeof v === 'object') return '{' + Object.entries(v).map(([k, x]) => k + ':' + jline(x)).join(',') + '}';
  return String(v);
};
const fmtVal = (enc, max = 40) => { const s = jline(decodeVal(enc)); return s.length > max ? s.slice(0, max) + '…' : s; };

// pretty cell key: the capture's cellKey is JSON — parse and join the path with ·
const prettyCell = (ck) => {
  try { const p = JSON.parse(ck); return (Array.isArray(p) ? p : [p]).map(String).join('·'); }
  catch { return String(ck); }
};
const TY = ['update', 'insert', 'remove'];               // change-record type codes (log entry .ty)
const tyName = t => TY[t] ?? ('type ' + t);

// ── recordOf: join a (origin,seq) route to its captured log entry ──
// prefer the origin node's OWN log; fall back to any node holding it; absent →
// null and the caller renders 'record not captured' (never invents a payload).
const recordOf = (capture, origin, seq) => {
  const hit = (n) => n && n.logs && n.logs[origin] ? n.logs[origin].find(e => e.seq === seq) : null;
  const own = hit(capture.nodes.find(n => n.uuid === origin));
  if (own) return own;
  for (const n of capture.nodes) { const e = hit(n); if (e) return e; }
  return null;
};

// ── journal rendering: kind → human line, driven by the capture's OWN vocab ──
// a/b/c semantics mirror kernel/journal.ts's JK comments; unknown kinds (from a
// newer kernel — the vocabulary is append-only) fall through to a generic line.
// R(text, refKey) is the ref hook — the DOM layer passes a real jump-link maker.
const journalLine = (name, e, R = (t) => esc(String(t))) => {
  const w = (o, s) => R(o + '#' + s, 'g/writes/' + o + '#' + s);   // an origin#seq token IS a Writes row
  const nd = (u) => R(u, 'g/nodes/' + u);                          // a uuid token IS a Nodes row
  switch (name) {
    case 'start':        return 'node started';
    case 'dial':         return 'dial → ' + esc(String(e.a));
    case 'linkUp':       return `link #${esc(String(e.a))} up · ${e.b ? 'dialed' : 'accepted'}`;
    case 'identified':   return `link #${esc(String(e.a))} = ${nd(e.b)} · inc ${esc(String(e.c))}`;
    case 'dupLink':      return `dup link — closed #${esc(String(e.a))}, kept #${esc(String(e.b))}`;
    case 'selfReject':   return `link #${esc(String(e.a))} rejected — presented our own uuid`;
    case 'linkDown':     return `link #${esc(String(e.a))} down · ${esc(String(e.b))}`;
    case 'frameDrop':    return `link #${esc(String(e.a))} dropped a frame · ${esc(String(e.b))}`;   // broken bytes / before-hello also drop the LINK; an unknown verb keeps it — the ELI5 says which
    case 'writeLocal':   return `write seq ${esc(String(e.a))} → part ${esc(String(e.b))}`;
    case 'applyInbound': return `apply ${w(e.a, e.b)}`;
    case 'dropOldest':   return `outbox overflow on link #${esc(String(e.a))} — dropped ${esc(String(e.b))}`;
    case 'pause':        return `link #${esc(String(e.a))} paused — backpressure`;
    case 'drain':        return `link #${esc(String(e.a))} drained — resumed`;
    case 'ping':         return `ping link #${esc(String(e.a))}`;
    case 'redial':       return `redial → ${esc(String(e.b))} in ${esc(String(e.a))}ms`;
    case 'dupDrop':      return `dup ${w(e.a, e.b)} discarded`;
    case 'giveUp':       return `gave up dialing ${esc(String(e.a))}`;
    case 'lwwSkip':      return `${w(e.a, e.b)} lost its LWW election`;
    case 'digestOut':    return `digest → link #${esc(String(e.a))}${e.b ? ' · reply requested' : ''}`;
    case 'digestIn':     return `digest ← link #${esc(String(e.a))}`;
    case 'aeShip':       return `AE → ${nd(e.a)} · ${esc(String(e.b))} rec${e.b === 1 ? '' : 's'}`;
    default:             return esc(name) + ' ' + [e.a, e.b, e.c].filter(x => x !== undefined).map(x => esc(String(x))).join(' · ');
  }
};
// journal kind → the mini-log's outcome-colour class (functional colour only)
const JCLS = { writeLocal:'local', applyInbound:'applied', lwwSkip:'conflict', frameDrop:'conflict', dropOldest:'conflict',
               dupDrop:'fwd', digestOut:'fwd', digestIn:'fwd', ping:'fwd',
               linkDown:'fence', giveUp:'fence', pause:'fence', selfReject:'fence' };

// ── derive(): the per-capture fold cache — routes/contested are O(journal), so
// compute once per capture object (WeakMap keyed on the capture itself; a live
// poll delivers a fresh object each tick and re-derives, which is the point).
const DER = new WeakMap();
const derive = (capture) => {
  if (DER.has(capture)) return DER.get(capture);
  const names = kindNames(capture);
  const routeMap = routes(capture);
  const cmap = new Map(contested(capture).map(c => [c.cell, c]));
  // the cluster's MODAL stateHash — a node off it has diverged (crit). Only a STRICT majority is a modal side:
  // in an even split (1 vs 1, 2 vs 2) no fingerprint is "the common one", so every side is off (ISSUES I-7:
  // the first node's hash used to win the tie, pilling only the other side of a symmetric disagreement)
  const tally = new Map();
  for (const n of capture.nodes) tally.set(n.stateHash, (tally.get(n.stateHash) || 0) + 1);
  let modal = capture.nodes.length ? capture.nodes[0].stateHash : 0, best = -1;
  for (const [h, c] of tally) if (c > best) { best = c; modal = h; }
  const sides = [...tally.values()].sort((a, b) => b - a);          // side sizes, largest first — the header's "1 vs 1"
  const split = capture.nodes.length > 1 && best * 2 <= capture.nodes.length;
  const maxT = Math.max(0, ...capture.nodes.map(n => n.journal.length ? n.journal[n.journal.length - 1].t : 0));
  const origins = [...new Set(capture.nodes.flatMap(n => Object.keys(n.logs)))].sort();
  const kindFreq = new Map();
  for (const n of capture.nodes) for (const e of n.journal) {
    const nm = names[e.kind] || ('kind' + e.kind);
    kindFreq.set(nm, (kindFreq.get(nm) || 0) + 1);
  }
  const d = { names, routes: routeMap, contested: cmap, modal, split, sides, maxT, origins, kindFreq,
              quiesced: !!capture.quiesced, live: capture.kind === 'live',
              // settled: nothing else is coming — only a QUIESCED SIM can prove a write lost or a disagreement final;
              // a live view or a run stopped at a horizon paints the same facts as warn (in flight), never crit
              settled: !!capture.quiesced && capture.kind !== 'live',
              truncated: capture.nodes.some(n => n.dropped > 0),
              // per node: may its links/streams be REPLAYED under scrub? verifyTopology's verdict (the drift
              // guard: the fold at t=∞ reproduced the captured end tables) — a page never assumes a fold is faithful
              topo: new Map(verifyTopology(capture).map(r => [r.uuid, r])) };
  DER.set(capture, d);
  return d;
};

// ── outcomeOf: fold a route row into flags / summary / severity / pill ──
// never-arrived is CRIT on a quiesced sim (nothing else is coming) but WARN on
// a live capture (in-flight is normal); lww-lost is always warn; fully-applied is quiet.
// not-a-holder (scoped replication, ISSUES I-3) is QUIET: those nodes were never meant to get the write,
// so they leave the denominator — "applied 2/2 holders" — and raise no flag, pill or severity.
const outcomeOf = (capture, r, d) => {
  const st = (u) => r.nodes[u] ? r.nodes[u].status : 'never-arrived';
  const all   = capture.nodes.map(n => n.uuid);
  const quiet = all.filter(u => st(u) === 'not-a-holder');
  const uuids = quiet.length ? all.filter(u => st(u) !== 'not-a-holder') : all;   // the nodes meant to get it
  const ok    = uuids.filter(u => st(u) === 'origin' || st(u) === 'applied' || st(u) === 'acquired');   // acquired: came in a hand-off
  const lost  = uuids.filter(u => st(u) === 'lww-lost');
  const never = uuids.filter(u => st(u) === 'never-arrived');
  const dup   = uuids.filter(u => st(u) === 'duplicate');
  const flags = new Set();                                  // the write: filter vocabulary
  if (ok.length === uuids.length) flags.add('applied');     // write:applied ⇒ FULLY applied everywhere it was meant to go
  if (lost.length)  flags.add('lww-lost');
  if (never.length) flags.add('never-arrived');
  if (dup.length)   flags.add('duplicate');
  const settled = d.settled;                                // only a quiesced sim can PROVE a write is lost
  const sev = never.length ? (settled ? 'crit' : 'warn') : lost.length ? 'warn' : '';
  // a pill names its ELI5 KEY (./eli5.mjs): the write:/cell:/link: filter vocabulary IS the pill vocabulary, one explanation each
  const pill = never.length ? (settled ? { cls:'crit', lab:'never-arrived', key:'write:never-arrived' }
                                       : { cls:'warn', lab:'in-flight', key:'write:in-flight' })
    : lost.length ? { cls:'warn', lab:'lww-lost', key:'write:lww-lost' } : null;
  const of = quiet.length ? `${uuids.length} holders` : `${uuids.length}`;
  const parts = [`<span class="${ok.length === uuids.length ? 'x' : ''}" data-tip="${quiet.length ? 'route:holders' : 'route:applied'}">applied ${ok.length}/${of}</span>`];
  if (lost.length)  parts.push(`<span class="warnt" data-tip="route:lost">lost@${esc(lost.join(','))}</span>`);
  if (never.length) parts.push(`<span class="${settled ? 'bad' : 'warnt'}" data-tip="${settled ? 'route:never' : 'route:inflight'}">⊘ ${esc(never.join(','))}</span>`);
  if (dup.length)   parts.push(`<span class="x" data-tip="route:dup">dup@${esc(dup.join(','))}</span>`);
  const summaryText = [`applied ${ok.length}/${of}`,
    ...(lost.length ? ['lost@' + lost.join(',')] : []),
    ...(never.length ? ['⊘ ' + never.join(',')] : [])].join(' · ');
  return { flags, sev, pill, ok, lost, never, dup, quiet, summaryHtml: parts.join(' <span class="x">·</span> '), summaryText };
};

// ── cellRows: the Cells union — end state from the CAPTURED per-node states
// (the ground truth), provenance from replaying ONE converged untruncated node
// through stateAt (verifyReplay proves that replay equals its captured state).
// With T set (time travel), everything comes from stateAt(·,·,T) instead —
// values, winner AND divergence are the replayed picture at that instant.
const cellRows = (capture, d, T) => {
  const scrub = T != null;
  const per = scrub ? capture.nodes.map(n => stateAt(capture, n.uuid, T))       // Map ck → {v, origin, seq, epoch}
                    : capture.nodes.map(n => new Map(n.state));                 // Map ck → encoded v
  const keys = new Set();
  for (const m of per) for (const k of m.keys()) keys.add(k);
  const provNode = capture.nodes.find(n => n.dropped === 0 && n.stateHash === d.modal)
                || capture.nodes.find(n => n.dropped === 0) || null;
  const prov = provNode ? (scrub ? per[capture.nodes.indexOf(provNode)] : stateAt(capture, provNode.uuid, Infinity)) : null;
  const out = [];
  for (const ck of keys) {
    const vs = capture.nodes.map((n, i) => {
      if (!per[i].has(ck)) return undefined;
      const cell = per[i].get(ck);
      return scrub ? cell.v : cell;                          // scrub entries wrap the encoded value
    });
    const present = vs.filter(v => v !== undefined).map(v => JSON.stringify(v));
    // divergence: values disagree; a MISSING cell counts as disagreement only on a
    // quiesced end state (mid-replay absence is just propagation, not a fault)
    const diverged = capture.nodes.length > 1 &&
      (new Set(present).size > 1 || (!scrub && d.quiesced && present.length < capture.nodes.length));
    const p = prov ? prov.get(ck) : null;                    // {v, origin, seq, epoch} or undefined
    const iFirst = vs.findIndex(v => v !== undefined);
    const value = p ? p.v : vs[iFirst];
    const cont = scrub ? null : (d.contested.get(ck) || null); // election data is end-of-run; suppressed while scrubbing
    out.push({ ck, value,
      winner: p ? { origin: p.origin, seq: p.seq, epoch: p.epoch } : null,   // no replayable node → provenance '—', never guessed
      diverged, contested: !!cont, cand: cont ? cont.candidates.length : 1,
      perNode: capture.nodes.map((n, i) => ({ uuid: n.uuid, has: vs[i] !== undefined, v: vs[i] })) });
  }
  return out.sort((a, b) => prettyCell(a.ck) < prettyCell(b.ck) ? -1 : 1);
};

// a fixed-width, right-aligned stat cell (value + dim unit) → columns line up across sibling rows;
// `key` names its ELI5 entry, `fact` an optional capture fact the card repeats under the explanation
const stat = (v, u, key, w, cls, fact) =>
  `<span class="stat${cls ? ' ' + cls : ''}" style="width:${w}px" data-tip="${esc(key)}"${fact ? ` data-tip-fact="${esc(fact)}"` : ''}>${esc(String(v))}${u ? `<span class="su"> ${esc(u)}</span>` : ''}</span>`;
const group = (key, label, icon, kids, cap, pill = null, sev = '') =>
  ({ key, type: 'group', label, icon, sev, pill, metaRaw: '', gcount: kids.length, entity: null, f: {}, kids, cap });

/* ── TREE BUILD — the capture folded into nested tree nodes. Every row carries
   `f` (its filterable facets) + `sev` + an optional pill; healthy rows are
   QUIET (v2's rule: pills flag problems, converged rows carry no badge). ── */
const buildForest = (capture, T) => {
  const d = derive(capture);
  const scrub = T != null && !d.truncated && T < d.maxT;    // truncated journals can't replay — scrubbing is off
  const nodes = [...capture.nodes].sort((a, b) => a.uuid < b.uuid ? -1 : 1);

  //! Nodes — one row per node; Links + Streams nest under it. The node's
  //  JOURNAL is deliberately NOT tree rows — it renders in the inspector.
  const nodeRows = nodes.map(n => {
    const nk = 'g/nodes/' + n.uuid;
    const keysN = scrub ? stateAt(capture, n.uuid, T).size : n.state.length;
    //! TOPOLOGY REPLAY (the "nothing pops into existence while scrubbing" report): under scrub, links and
    // streams come from topologyAt — but only for a node whose replay verifyTopology PROVED reproduces its
    // captured end tables; any other node keeps its end snapshot, labelled '@ end' with the verdict's
    // reason. The page never assumes a fold is faithful — the fold layer proves it, per capture, per node.
    const tv = scrub ? d.topo.get(n.uuid) : null;
    const tp = tv && tv.ok ? topologyAt(capture, n.uuid, T) : null;
    const atEnd = scrub && !tp ? { cls:'info', lab:'@ end', key:'at-end', fact: tv ? tv.reason : '' } : null;
    // a field the capture could not vouch for (absent from its end table — an older capture) renders as
    // unknown under replay, exactly as it does at present: the verdict's `unverified` list says which
    const unvSynced = !!(tp && tv.unverified && tv.unverified.includes('synced'));
    const lks = tp ? [...tp.links.values()].map(l => unvSynced ? { ...l, synced: null } : l) : n.links;
    //! the admitted/total stat counts PEERS: the debugger's own DIAG session (diag: true, kernel/diag.ts) is a
    // read-only observer that is never admitted — counting it read as a stuck 2/3 on a healthy pair (ISSUES I-6)
    const peers = lks.filter(l => !l.diag);
    const adm = peers.filter(l => l.admitted).length;
    // off the modal fingerprint: DIVERGED (crit) only on a settled capture — elsewhere a change may still be on its
    // way, so the same fact is warn 'differs' (ISSUES I-4: a live view mid-propagation painted the red of a real fault)
    const off = capture.nodes.length > 1 && (d.split || n.stateHash !== d.modal);
    const diverged = off && d.settled;
    const sev = diverged ? 'crit' : off || n.dropped > 0 ? 'warn' : '';
    const pill = diverged ? { cls:'crit', lab:'diverged', key:'node:diverged' }
      : off ? { cls:'warn', lab:'differs', key:'node:differs' }
      : n.dropped > 0 ? { cls:'warn', lab:'truncated +' + klog(n.dropped), key:'node:truncated', fact: `${n.dropped} oldest events dropped` } : null;
    const kinds = new Set();
    for (const e of n.journal) kinds.add((d.names[e.kind] || ('kind' + e.kind)).toLowerCase());
    const links = lks.map(l => {
      const flags = new Set();
      if (l.closing) flags.add('closing');                              // a dup-race loser awaiting its close echo (replay only)
      else if (l.diag) flags.add('observer');                           // the debugger's own read-only session — never a peer, not a transition
      else if (!l.admitted) flags.add('pre-admit');
      if (l.paused) flags.add('paused');
      if (l.admitted && l.synced === false && !l.closing) flags.add('syncing');   // synced ABSENT (old capture) → unknown, no claim
      const lp = flags.has('closing') ? { cls:'info', lab:'closing', key:'link:closing' }
        : flags.has('observer') ? { cls:'info', lab:'observer', key:'link:observer' }
        : flags.has('paused') ? { cls:'warn', lab:'paused', key:'link:paused' }
        : flags.has('syncing') ? { cls:'warn', lab:'syncing', key:'link:syncing' }
        : flags.has('pre-admit') ? { cls:'info', lab:'pre-admit', key:'link:pre-admit' } : null;
      return { key: nk + '/g/links/' + l.id, type: 'link', label: l.uuid ? '→' + l.uuid : 'link#' + l.id, icon: '⇄',
        sev: !lp || flags.has('observer') ? '' : lp.cls === 'info' ? 'info' : 'warn', pill: lp,   // an observer is quiet: a pill, no severity
        metaRaw: stat('#' + l.id, '', 'link-id', 44)
               + stat(l.dialed ? 'dialed' : 'accepted', '', l.dialed ? 'side:dialed' : 'side:accepted', 82)
               + (l.queued == null ? stat('—', 'queued', 'unknown@t', 84)                // parked-while-paused depth is not a diary fact
                                   : stat(l.queued, 'queued', 'queued', 84, l.queued ? 'warn' : '')),
        entity: { kind: 'link', link: l, node: n }, f: { node: n.uuid, link: flags }, kids: [] };
    });
    const sts = tp ? [...tp.streams] : Object.entries(n.streams || {});   // [origin, ladder] either way
    const streams = sts.map(([origin, w]) => ({
      key: nk + '/g/streams/' + origin, type: 'stream', label: origin, icon: '∿', sev: '', pill: null,
      metaRaw: stat('applied ' + wm(w).a, '', 'wm:applied', 110),
      entity: { kind: 'stream', origin, w: wm(w), node: n }, f: { node: n.uuid }, kids: [] }));
    // under scrub the jrnl stat becomes a PROGRESS readout (rows ≤ T / retained) — on a
    // write-free capture (mesh formation) this is the row that shows time actually moving
    const jstat = (scrub ? klog(jAt(n.journal, T)) + '/' : '') + klog(n.journal.length) + (n.dropped > 0 ? ' +' + klog(n.dropped) : '');
    return { key: nk, type: 'node', label: n.uuid, icon: '▢', sev, pill,
      metaRaw: stat(n.seq ?? '—', 'seq', 'seq', 66)
             + stat(n.epoch ?? '—', 'ep', 'epoch', 58)
             + stat(keysN, 'keys', scrub ? 'keys@t' : 'keys', 74)
             + stat(jstat, 'jrnl', scrub ? 'jrnl@t' : 'jrnl', 96, n.dropped > 0 ? 'warn' : '', n.dropped > 0 ? `+${n.dropped} dropped to ring overflow` : '')
             + (atEnd ? stat(adm + '/' + peers.length, 'links', 'at-end', 100, '', atEnd.fact)   // 100px: mid-formation OPEN counts run to 3 digits (dup-race losers linger until their echo)
                      : stat(adm + '/' + peers.length, 'links', tp ? 'links@t' : 'links-stat', 100)),
      //! tp/tv/lks/sts ride the entity so the inspector and status bar read the SAME replayed tables (one fold per node per drag)
      entity: { kind: 'node', node: n, tp, tv, lks, sts }, f: { node: n.uuid, kinds },
      kids: [group(nk + '/g/links', 'Links', '⇄', links, undefined, atEnd, atEnd ? 'info' : ''), group(nk + '/g/streams', 'Streams', '∿', streams, undefined, atEnd, atEnd ? 'info' : '')] };
  });

  //! Writes — one row per (origin,seq) from routes(), newest first (max t desc).
  //  The tree renders the newest 500; the FILTER always searches all of them.
  const writeRows = [...d.routes.values()].map(r => {
    const rec = recordOf(capture, r.origin, r.seq);
    const o = outcomeOf(capture, r, d);
    const ts = Object.values(r.nodes).map(x => x.t).filter(t => t != null);
    const tmax = ts.length ? Math.max(...ts) : -1;
    const tmin = ts.length ? Math.min(...ts) : Infinity;
    const kvv = rec
      ? `<span class="kk" data-tip="${rec.ty === 2 ? 'rec:remove' : 'rec-key'}">${rec.ty === 2 ? 'remove ' : ''}${esc(prettyCell(cellKey(rec.k, rec.at)))}</span>${rec.ty === 2 ? '' : ' = <span data-tip="rec-value">' + esc(fmtVal(rec.v)) + '</span>'}`
      : `<span class="x" data-tip="not-captured">record not captured</span>`;   // honest: the payload is absent from this capture
    return { key: 'g/writes/' + r.origin + '#' + r.seq, type: 'write', label: r.origin + '#' + r.seq, icon: '·',
      sev: o.sev, pill: o.pill, tdim: scrub && tmin > T, tmax,            // tdim: nothing about this write happened yet at the scrub point
      metaRaw: `${kvv} <span class="x">·</span> ${o.summaryHtml}`,
      entity: { kind: 'write', r, rec, o },
      f: { origin: r.origin, key: rec ? prettyCell(cellKey(rec.k, rec.at)) : '', write: o.flags }, kids: [] };
  }).sort((a, b) => b.tmax - a.tmax);

  //! Cells — the union of every node's state (or the replayed state @ scrub point)
  //! a disagreement is DIVERGED (crit) only at the settled end of a quiesced sim; under scrub it is 'differs@t',
  //  on a live or mid-flight capture 'differs' — the same fact, warn, because a change may still be travelling
  const cellNodes = cellRows(capture, d, scrub ? T : null).map(c => {
    const proven = c.diverged && !scrub && d.settled;
    const sev = c.diverged ? (proven ? 'crit' : 'warn') : c.contested ? 'warn' : '';
    const pill = c.diverged ? (scrub ? { cls:'warn', lab:'differs@t', key:'cell:differs@t' }
                               : proven ? { cls:'crit', lab:'diverged', key:'cell:diverged' }
                                        : { cls:'warn', lab:'differs', key:'cell:differs' })
      : c.contested ? { cls:'warn', lab:'contested', key:'cell:contested', fact: `${c.cand} candidates` } : null;
    const flags = new Set();
    if (c.diverged) flags.add(proven ? 'diverged' : 'differs');
    if (c.contested) flags.add('contested');
    return { key: 'g/cells/' + encodeURIComponent(c.ck), type: 'cell', label: prettyCell(c.ck), icon: '▪', sev, pill,
      metaRaw: `<span data-tip="cell-value">= ${esc(fmtVal(c.value))}</span> <span class="x">·</span> <span data-tip="cell-winner">by ${c.winner ? esc(c.winner.origin + '#' + c.winner.seq) : '—'}</span>`
             + (c.cand > 1 ? ` <span class="x">·</span> <span data-tip="candidates">${c.cand} candidates</span>` : ''),
      entity: { kind: 'cell', cell: c },
      f: { origin: c.winner ? c.winner.origin : '', key: prettyCell(c.ck), cell: flags }, kids: [] };
  });

  //! Violations — only when the capture recorded any; always crit, shown verbatim in the inspector.
  const viols = (capture.violations || []).map((v, i) => ({
    key: 'g/violations/' + i, type: 'violation', label: 'violation #' + i, icon: '✕', sev: 'crit',
    pill: { cls: 'crit', lab: 'violation', key: 'violation' },
    metaRaw: `<span class="bad">${esc(String(typeof v === 'string' ? v : JSON.stringify(v)).slice(0, 90))}</span>`,
    entity: { kind: 'violation', v }, f: {}, kids: [] }));

  const forest = [
    group('g/nodes', 'Nodes', '▢', nodeRows),
    group('g/writes', 'Writes', '↳', writeRows, 500),      // cap RENDERED rows at 500 — filtering still searches all
    group('g/cells', 'Cells', '◧', cellNodes),
  ];
  if (viols.length) forest.push(group('g/violations', 'Violations', '⚠', viols));
  return forest;
};

/* ── FILTER — a self-contained grammar: whitespace-ANDed clauses, comma-OR
   within a clause. bare text → label substring; is:crit|warn|info severity
   rollups; node:/origin:/key: substrings on the row's facets; write:/cell:/
   link: status sets; kind: journal-kind membership (names come from the
   capture's vocab — GENERATED, never hard-coded). ── */
const FTYPES = ['is', 'node', 'origin', 'key', 'write', 'cell', 'link', 'kind'];
const SEV_ALIAS = { critical: 'crit', warning: 'warn' };
const parseFilter = (q) => {
  const clauses = [];
  for (const tok of (q || '').trim().split(/\s+/).filter(Boolean)) {
    const m = /^([a-z]+):(.*)$/i.exec(tok);
    if (m && FTYPES.includes(m[1].toLowerCase())) {
      const values = m[2].split(',').filter(Boolean).map(v => v.toLowerCase());
      if (values.length) clauses.push({ kind: 'facet', type: m[1].toLowerCase(), values });
      // a bare `key:` head still being typed → incomplete clause: match everything, never nothing
    } else clauses.push({ kind: 'bare', values: tok.split(',').filter(Boolean).map(v => v.toLowerCase()) });
  }
  return { clauses };
};
const matchNode = (n, ast) => {
  for (const c of ast.clauses) {
    const vs = c.values;
    let hit = false;
    if (c.kind === 'bare') hit = vs.some(v => n.label.toLowerCase().includes(v));
    else switch (c.type) {
      case 'is':     hit = vs.some(v => (SEV_ALIAS[v] || v) === n.sev); break;
      case 'node':   hit = !!n.f.node && vs.some(v => n.f.node.toLowerCase().includes(v)); break;   // the node row AND its links/streams
      case 'origin': hit = !!n.f.origin && vs.some(v => n.f.origin.toLowerCase().includes(v)); break;
      case 'key':    hit = !!n.f.key && vs.some(v => n.f.key.toLowerCase().includes(v)); break;
      case 'write':  hit = !!n.f.write && vs.some(v => n.f.write.has(v)); break;
      case 'cell':   hit = !!n.f.cell && vs.some(v => n.f.cell.has(v)); break;
      case 'link':   hit = !!n.f.link && vs.some(v => n.f.link.has(v)); break;
      case 'kind':   hit = !!n.f.kinds && vs.some(v => n.f.kinds.has(v)); break;
    }
    if (!hit) return false;
  }
  return true;
};
const subtreeMatch = (n, ast) => matchNode(n, ast) || (n.kids || []).some(k => subtreeMatch(k, ast));
// dropdown counts run against the SAME matcher the filter uses, so a count can't lie
const countTok = (forest, tok) => {
  let n = 0;
  const ast = parseFilter(tok);
  const walk = ns => { for (const x of ns) { if (matchNode(x, ast)) n++; if (x.kids && x.kids.length) walk(x.kids); } };
  walk(forest);
  return n;
};
// a same-axis repeat (key:a key:b) ANDs to ∅ — suggest the comma-OR form instead
const collapseHint = (ast) => {
  const byType = {};
  for (const c of ast.clauses) if (c.kind === 'facet') (byType[c.type] = byType[c.type] || []).push(c);
  for (const t of Object.keys(byType)) {
    const cs = byType[t];
    if (cs.length >= 2) return t + ':' + [...new Set(cs.flatMap(c => c.values))].join(',');
  }
  return '';
};
// the suggestible value space per filter head — kind names GENERATED from the capture's vocab
const sugValues = (capture, d) => ({
  is: ['crit', 'warn', 'info'],
  node: capture.nodes.map(n => n.uuid),
  origin: d.origins,
  key: [],                                                   // free text — no closed value set
  write: ['applied', 'lww-lost', 'never-arrived', 'duplicate'],
  cell: ['contested', 'diverged', 'differs'],
  link: ['syncing', 'paused', 'pre-admit', 'closing', 'observer'],
  kind: Object.keys(capture.vocab).sort((a, b) => (d.kindFreq.get(b) || 0) - (d.kindFreq.get(a) || 0)),
});

/* ════════════════════════════════════════════════════════════════════════
   STATE + RENDER (DOM from here on)

const $ = id => document.getElementById(id);

let CAP = null;         // the loaded capture (the ONE data model)
let D = null;           // derive(CAP) — cached folds
let SUMMARY = null;     // summarize(CAP)
let REPLAY = null;      // verifyReplay(CAP) — run ONCE per capture load, cached (renderers only read)
let FOREST = [];        // buildForest(CAP, T)
let expanded = new Set();
let selKey = '';        // inspector subject; also the bottom breadcrumb
let query = '';         // THE whole omni query string
let flat = [];          // current visible rows (for j/k)
let T = null;           // time-travel scrub point (journal t); null = present
let LIVE = false, PAUSED = false, pollTimer = null;

// the ONE effective-scrub predicate — T is only honoured when this capture can replay it
// (mirrors buildForest's gate exactly, so every surface agrees on whether we're time-travelling)
const scrubT = () => (CAP && D && T != null && !D.truncated && T < D.maxT) ? T : null;
// journal rows visible at the scrub point (journals are t-ascending, per-node index)
const jAt = (journal, t) => { let n = 0; for (const e of journal){ if (e.t > t) break; n++; } return n; };

/* flatten the forest into the visible row list, honouring expand + filter.
   With a filter active: prune non-matching branches and AUTO-EXPAND ancestors
   of matches so the hits reveal themselves. The Writes cap only applies when
   NOT filtering — a filter always searches every write. */
function flatten(){
  const ast = parseFilter(query);
  const filtering = ast.clauses.length > 0;
  flat = [];
  const walk = (nodes, depth) => {
    for (const n of nodes){
      if (filtering && !subtreeMatch(n, ast)) continue;               // prune
      const self = matchNode(n, ast);
      const hasKids = (n.kids || []).length > 0;
      const open = filtering ? (hasKids && n.kids.some(k => subtreeMatch(k, ast)) || expanded.has(n.key))
                             : expanded.has(n.key);
      flat.push({ n, depth, open, hasKids, dim: (filtering && !self) || !!n.tdim });
      if (open && hasKids){
        if (n.cap && !filtering && n.kids.length > n.cap){
          const shown = n.kids.slice(0, n.cap);
          if (selKey && !shown.some(k => k.key === selKey)){          // a selected write beyond the cap stays visible
            const s = n.kids.find(k => k.key === selKey); if (s) shown.push(s);
          }
          walk(shown, depth + 1);
          flat.push({ n: { key: n.key + '/·more', type: 'more',      // the honest cap row — filtering reveals the rest
            label: `… ${n.kids.length - n.cap} older writes not shown (filter to reveal)`,
            icon: '', sev: '', pill: null, metaRaw: '', f: {}, kids: [] },
            depth: depth + 1, open: false, hasKids: false, dim: true });
        } else walk(n.kids, depth + 1);
      }
    }
  };
  walk(FOREST, 0);
}

function rowHTML(row, i){
  const { n, depth, open, hasKids, dim } = row;
  const tw = hasKids ? (open ? '▾' : '▸') : '';
  const ind = 18 + depth * 15;
  const pill = n.pill
    ? `<span class="pill ${n.pill.cls}" data-tip="${esc(n.pill.key)}"${n.pill.fact ? ` data-tip-fact="${esc(n.pill.fact)}"` : ''}><span class="pd"></span>${esc(n.pill.lab)}</span>` : '';
  const gc = n.type === 'group' ? `<span class="gc">${n.gcount}</span>` : '';
  const tipKey = n.type === 'group' ? 'g:' + n.label.toLowerCase() : n.type;   // every row type explains itself (./eli5.mjs)
  return `<div class="trow${dim ? ' dim' : ''}" data-i="${i}" data-type="${n.type}" data-depth="${depth}" data-sev="${n.sev || ''}" ` +
    `${n.key === selKey ? 'aria-selected="true"' : ''} style="padding-left:${ind}px">` +
    `<span class="tw ${hasKids ? '' : 'leaf'}">${tw}</span>` +
    `<span class="sd"></span>` +
    `<span class="ic">${n.icon || ''}</span>` +
    `<span class="lab" data-tip="${tipKey}">${esc(n.label)}${gc}</span>` +
    `<span class="grow"></span>` +
    `<span class="pillwrap">${pill}</span>` +
    `<span class="meta">${n.metaRaw || ''}</span></div>`;
}

function renderTree(){
  flatten();
  $('tree').innerHTML = flat.map(rowHTML).join('') || `<div class="empty2">No rows match this filter.</div>`;
}

function findNode(key, nodes = FOREST){
  for (const n of nodes){ if (n.key === key) return n; const f = n.kids && findNode(key, n.kids); if (f) return f; }
  return null;
}
function revealKey(key){ // expand all ancestors of key
  const parts = key.split('/'); let acc = '';
  for (let i = 0; i < parts.length; i++){ acc = i ? acc + '/' + parts[i] : parts[i]; if (findNode(acc)) expanded.add(acc); }
}
// jump the tree to `key`: reveal its ancestors, select it, scroll it into view
function navTo(key){ if (!findNode(key)) return; revealKey(key); selKey = key; syncURL(); render(); scrollSel(); }
// a clickable reference token — only rendered as a link when the target row exists (no dead links)
function ref(text, rkey){
  return rkey && findNode(rkey) ? `<span class="ref" data-rkey="${esc(rkey)}">${esc(String(text))}</span>` : esc(String(text));
}
const R = (txt, rkey) => ref(txt, rkey);   // journalLine's ref hook

/* ── the omni bar: chips (time-travel only) · match count · suggestions ── */
const sevDotVar = s => s === 'crit' ? 'crit' : s === 'warn' ? 'warn' : s === 'info' ? 'info' : 'soft';
// a token's ELI5 key: a bare head → its filter-head entry; is:<sev> → the severity rollup; a write:/cell:/link:
// status value → the SAME entry its pill uses (the facet vocabulary IS the pill vocabulary); kind:<k> → that
// journal kind; node:/origin:/key: values are data, so the head's explanation applies
const tokTip = (tok) => {
  const m = /^([a-z]+):(.*)$/i.exec(tok); if (!m) return '';
  const t = m[1].toLowerCase(), v = m[2];
  if (!v) return 'f:' + t;
  if (t === 'is') return 'sev:' + (SEV_ALIAS[v.toLowerCase()] || v.toLowerCase());
  if (t === 'kind') return 'jk:' + v;
  if (t === 'write' || t === 'cell' || t === 'link') return t + ':' + v.toLowerCase();
  return 'f:' + t;
};
function menuItem(pick, label, note, dotCls, count){
  return `<div class="oitem" data-pick="${esc(pick)}" data-tip="${esc(tokTip(pick))}">` +
    `<span class="od" style="background:var(--${dotCls || 'soft'})"></span><span class="ot">${esc(label)}</span>` +
    `<span class="onote">${esc(note || '')}</span><span class="oc">${count === '' ? '' : count}</span></div>`;
}
// the partial token currently being typed = the text after the last whitespace
function currentToken(){ const m = query.match(/(\S*)$/); return (m && m[1]) || ''; }
function renderMenu(){
  if (!CAP){ $('omenu').innerHTML = ''; return; }
  const partial = currentToken();
  const vals = sugValues(CAP, D);
  if (partial){
    const m = /^([a-z]+):(.*)$/i.exec(partial);
    let items = [];
    if (m && vals[m[1].toLowerCase()]){
      // completing a facet value: enumerate that head's value space, filtered by the fragment. A bare `kind:` lists
      // only kinds this capture recorded — the vocabulary is append-only, so reserved / never-emitted names
      // (holdBack, catchup) would otherwise pad the list; typing a fragment still completes them, with their
      // zero count, so an old capture stays filterable (ISSUES I-9)
      const t = m[1].toLowerCase(), frag = m[2].toLowerCase();
      const space = t === 'kind' && !frag ? vals.kind.filter(k => D.kindFreq.get(k)) : vals[t];
      items = space.filter(v => v.toLowerCase().includes(frag)).slice(0, 14)
        .map(v => ({ tok: `${t}:${v}`, note: t === 'kind' ? 'journal kind (from capture.vocab)' : t, dot: t === 'is' ? sevDotVar(v) : 'gold-2' }));
    } else {
      // completing a bare fragment: filter heads, severities, node uuids, kind names — and key: when the
      // fragment names a cell's or a write's address (the text filter already matches those rows; name the facet)
      const p = partial.toLowerCase();
      items = [
        ...FTYPES.filter(t => t.startsWith(p)).map(t => ({ tok: t + ':', note: 'filter head', dot: 'gold-2', nocount: true })),
        ...['crit', 'warn', 'info'].filter(s => s.startsWith(p) || ('is:' + s).includes(p)).map(s => ({ tok: 'is:' + s, note: 'severity rollup', dot: sevDotVar(s) })),
        ...CAP.nodes.filter(n => n.uuid.toLowerCase().includes(p)).slice(0, 6).map(n => ({ tok: 'node:' + n.uuid, note: 'node', dot: 'info' })),
        ...Object.keys(CAP.vocab).filter(k => k.toLowerCase().includes(p)).slice(0, 6).map(k => ({ tok: 'kind:' + k, note: 'journal kind', dot: 'soft' })),
        ...(!partial.includes(':') && countTok(FOREST, 'key:' + p) ? [{ tok: 'key:' + p, note: 'cells + writes by key text', dot: 'gold-2' }] : []),
      ];
    }
    // the panel completes TOKENS; the count beside the box counts ROWS — an empty panel says "no completions",
    // never "no matches", so the two lines cannot contradict each other (a bare word still filters as text)
    const none = m && vals[m[1].toLowerCase()]
      ? `no ${esc(m[1].toLowerCase())}: value matches “${esc(m[2])}”`
      : `no completions for “${esc(partial)}” — filtering as text`;
    const rows = items.length
      ? items.map(it => menuItem(it.tok, it.tok, it.note, it.dot, it.nocount ? '' : countTok(FOREST, it.tok))).join('')
      : `<div class="oitem" style="cursor:default"><span class="onote">${none}</span></div>`;
    $('omenu').innerHTML = `<div class="oh">Complete “${esc(partial)}”</div>${rows}`;
    return;
  }
  // the curated default: severity rollups (live counts) → the type heads → per-type values
  const sev = ['crit', 'warn', 'info'].map(s => menuItem('is:' + s, 'is:' + s,
    s === 'crit' ? 'divergence, lost writes, violations' : s === 'warn' ? 'contested, truncated, in-flight' : 'transitions (pre-admit)',
    sevDotVar(s), countTok(FOREST, 'is:' + s))).join('');
  const heads = FTYPES.filter(t => t !== 'is').map(t =>
    menuItem(t + ':', t + ':', { node: 'a node + its links/streams', origin: 'writes/cells by origin', key: 'cells + writes by key text',
      write: 'route outcome', cell: 'election state', link: 'link state', kind: 'journal kind membership' }[t] || '', 'gold-2', '')).join('');
  const nodes = CAP.nodes.slice(0, 6).map(n => menuItem('node:' + n.uuid, 'node:' + n.uuid, 'node', 'info', countTok(FOREST, 'node:' + n.uuid))).join('');
  const kinds = vals.kind.filter(k => D.kindFreq.get(k)).slice(0, 8).map(k => menuItem('kind:' + k, 'kind:' + k, D.kindFreq.get(k) + ' journal rows', 'soft', countTok(FOREST, 'kind:' + k))).join('');   // recorded kinds only (ISSUES I-9)
  $('omenu').innerHTML = `<div class="oh">By severity</div>${sev}` +
    `<div class="osep"></div><div class="oh">By type — then a value</div>${heads}` +
    `<div class="osep"></div><div class="oh">By node</div>${nodes}` +
    `<div class="osep"></div><div class="oh">By journal kind (from this capture's vocab)</div>${kinds}`;
}
function renderBar(){
  // the only chip is the gold time-travel marker; the filter lives inline in the query string
  $('ochips').innerHTML = T != null
    ? `<span class="ochip tt" data-tip="time-travel"><span class="pd"></span>time-travel @ ${T}<span class="ox" data-ttx data-tip="time-travel-reset">✕</span></span>` : '';
  if (document.activeElement !== $('q')) $('q').value = query;   // don't fight the caret while typing
  renderMenu();
  const ast = parseFilter(query);
  const filtering = ast.clauses.length > 0;
  const m = filtering ? flat.filter(x => !x.dim).length : null;
  // ∅-collapse hint: a same-axis repeat that matched nothing → nudge toward the comma-OR form
  const hint = filtering && m === 0 ? collapseHint(ast) : '';
  $('ocount').innerHTML = m != null
    ? `<span class="fl">${m}</span> match${m === 1 ? '' : 'es'}${hint ? ` <span style="color:var(--soft)">· try ${esc(hint)}</span>` : ''}` : '';
  $('oclear').style.display = query.trim() ? '' : 'none';

/* ── URL ⇆ state: q + sel + t are deep-linkable; ?scenario passes through ── */
function syncURL(){
  const p = new URLSearchParams();
  if (SCENARIO) p.set('scenario', SCENARIO);
  if (query) p.set('q', query);
  if (selKey) p.set('sel', selKey);
  if (T != null) p.set('t', String(T));
  const qs = p.toString();
  history.replaceState(null, '', qs ? '?' + qs : location.pathname);
}
function readURL(){
  const p = new URLSearchParams(location.search);
  SCENARIO = p.get('scenario') || '';
  query = p.get('q') || '';
  const s = p.get('sel'); if (s != null) selKey = s;
  const t = p.get('t'); if (t != null && t !== '' && !Number.isNaN(+t)) T = +t;
}

/* ── bottom bar: breadcrumb (location) + level-scoped rollup + scrubber ── */
function renderCrumb(){
  const segs = [{ key: '', label: 'cluster', tip: 'crumb' }];
  if (selKey){
    const parts = selKey.split('/'); let acc = '';
    for (let i = 0; i < parts.length; i++){
      acc = i ? acc + '/' + parts[i] : parts[i];
      const n = findNode(acc);
      if (n) segs.push({ key: acc, label: n.type === 'group' ? n.label.toLowerCase() : n.label, tip: n.type === 'group' ? 'g:' + n.label.toLowerCase() : n.type });
    }
  }
  const cur = segs.length - 1;
  $('crumb').innerHTML = segs.map((s, i) =>
    `<span class="cseg${i === cur ? ' cur' : ''}" data-segkey="${esc(s.key)}" data-tip="${esc(s.tip)}">${esc(s.label)}</span>`).join('<span class="csep">›</span>');
}
// status-bar atoms carry their ELI5 key (./eli5.mjs): sst = a severity-coloured statement, fact = a quiet one
const sst = (st, txt, key) => `<span class="sst ${st || 'ok'}"${key ? ` data-tip="${esc(key)}"` : ''}>${txt}</span>`;
const fact = (txt, key) => `<span data-tip="${esc(key)}">${txt}</span>`;
// the capture header facts — everything from summarize() + the cached verifyReplay()
function headerFacts(){
  const s = SUMMARY;
  const bits = [fact(esc(s.kind || '—'), s.kind === 'live' ? 'kind:live' : 'kind:sim')];
  if (s.seed != null) bits.push(fact('seed ' + esc(String(s.seed)), 'seed'));
  if (s.kind === 'sim') bits.push(s.quiesced ? fact('quiesced', 'quiesced') : sst('warn', 'not quiesced', 'not-quiesced'));
  // shrunk captures (M7): the pill renders RECORDED facts only (summarize passes capture.shrunk through);
  // a capture frozen AT its violating event is mid-flight by construction — divergence there is not a
  // finding, so soften (never hide) it, keyed STRICTLY on the recorded atViolation fact.
  if (s.shrunk) bits.push(sst('warn', `shrunk ${s.shrunk.from.steps}→${s.shrunk.steps.length} steps${s.shrunk.atViolation ? ' · ends @ violation' : ''}`, 'shrunk'));
  // converged === null means ZERO captured nodes (an attach where nobody answered) — "no nodes" is the
  // only honest render; a green badge over an empty set would be the vacuous-true lie the fold refuses
  bits.push(s.converged === null ? sst('warn', 'no nodes', 'no-nodes')
    : s.converged ? fact('converged ✓', 'converged')
    : s.shrunk && s.shrunk.atViolation ? sst('warn', 'mid-flight @ violation', 'mid-flight')
    : D.settled ? (D.split ? sst('crit', `split ✗ ${D.sides.join(' vs ')}`, 'split')   // no strict majority: no side is "the" cluster
                            : sst('crit', 'diverged ✗', 'diverged'))                  // a quiesced sim: nothing else is coming
    : sst('warn', 'differs (in flight)', 'differs'));                     // live / a horizon: a change may still be on its way
  // absent rows (M7 attach): targets that yielded no slice this rebuild — named with their typed reason,
  // never synthesized into node cards (absence renders as absence)
  if (s.absent && s.absent.length)
    bits.push(sst('warn', `absent: ${s.absent.map(a => `${esc(a.target)} (<span data-tip="absent:${esc(a.reason)}">${esc(a.reason)}</span>)`).join(', ')}`, 'absent'));
  if (s.converged !== null) { // zero nodes ⇒ no replay basis — claim nothing rather than a vacuous ✓
    //! a TORN attach read (the bridge's `torn` flag, ISSUES I-2): rows landed between a node's snapshot and its state
    // pull, so its state is a later instant than its journal — a replay mismatch there is the read, not a fault.
    // Say so, and judge replay over the nodes whose slices are one instant
    const torn = CAP.nodes.filter(n => n.torn).map(n => n.uuid);
