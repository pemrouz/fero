  const sub = `<span data-tip="cell-value">= <span class="mono">${esc(fmtVal(c.value, 48))}</span></span> · <span data-tip="cell-winner">winner</span> ${winTok ? `<span class="mono">${ref(winTok, 'g/writes/' + winTok)}</span>` : '—'}`;
  const facts = kv([
    ['winner', winTok ? ref(winTok, 'g/writes/' + winTok) : '—', '', 'cell-winner'],   // '—' = no untruncated journal to replay: never guessed
    ['epoch·seq', c.winner ? `e${esc(String(c.winner.epoch))}·s${esc(String(c.winner.seq))}` : '—', '', 'stamp'],
    ['candidates', String(c.cand), c.cand > 1 ? 'warn' : '', 'candidates'],
  ]);
  // the election — every candidate the captured logs hold, newest first, winner badged.
  // Suppressed under scrub, matching cellRows: election data is end-of-run, and a mid-replay
  // cell showing its final election would be the viewer claiming the future
  const cont = scrubT() != null ? null : D.contested.get(c.ck);
  const election = cont ? seg('Election · newest first', `<div class="mlog">` + cont.candidates.map(x => {
    const tok = x.origin + '#' + x.seq;
    const won = cont.winner && cont.winner.origin === x.origin && cont.winner.seq === x.seq;
    return `<div class="mr" data-nav="${esc('g/writes/' + tok)}"><span class="stp" data-tip="rec-epoch">e${esc(String(x.epoch))}</span>` +
      `<span class="kvv">${esc(tok)} → ${x.ty === 2 ? '<span class="kk" data-tip="rec:remove">remove</span>' : esc(fmtVal(x.v))}</span>` +
      `<span class="oc ${won ? 'applied' : 'conflict'}" data-tip="${won ? 'won' : 'lost'}">${won ? 'won' : 'lost'}</span></div>`;
  }).join('') + `</div>`, `<span class="stn" data-tip="candidates">${cont.candidates.length} candidates</span>`, 'election') : '';
  // per-node values — only when nodes disagree; a missing cell renders as absent
  const first = c.perNode.find(p => p.has);
  const winJson = first ? JSON.stringify(first.v) : undefined;
  const perNode = c.diverged ? seg('Per-node value', `<table class="vt"><thead><tr><th data-tip="node">node</th><th data-tip="cell-value">value</th></tr></thead><tbody>` +
    c.perNode.map(p => {
      const bad = !p.has || JSON.stringify(p.v) !== winJson;
      return `<tr><td class="node">${ref(p.uuid, 'g/nodes/' + p.uuid)}</td>` +
        `<td class="${bad ? 'min' : 'maj'}">${p.has ? esc(fmtVal(p.v, 56)) : '<span data-tip="absent-cell">∅ absent</span>'}</td></tr>`;
    }).join('') + `</tbody></table>`, '', 'per-node') : '';
  return ihead(esc(prettyCell(c.ck)), 'cell', nd.sev, sub) + seg('Facts', facts, '', 'facts') + election + perNode;
}
function inspLink(nd){
  const { link: l, node: n } = nd.entity;
  const peer = l.diag ? '<span data-tip="link:observer">the debugger (observer)</span>'   // a DIAG session never says a member name: it is not one
    : l.uuid ? ref(l.uuid, 'g/nodes/' + l.uuid) : '<span class="warnt">unidentified</span>';
  const side = l.dialed ? 'dialed' : 'accepted';
  const tvr = refusedVerdict(n);
  const atEnd = tvr ? `<span class="stn" data-tip="at-end"${tvr.reason ? ` data-tip-fact="${esc(tvr.reason)}"` : ''}>@ capture end</span>` : '';
  return ihead(esc(l.uuid ? '→' + l.uuid : 'link#' + l.id), 'link', nd.sev,
      `${ref(n.uuid, 'g/nodes/' + n.uuid)} ⇄ ${peer} · <span data-tip="side:${side}">${side}</span>`) +
    seg('Facts', kv([
      ['link id', '#' + esc(String(l.id)), '', 'link-id'],
      ['peer', peer, '', 'peer'],
      ['side', side, '', 'side:' + side],
      l.diag ? ['admitted', 'observer — never', '', 'link:observer'] : ['admitted', l.admitted ? 'yes' : 'no', l.admitted ? '' : 'warn', 'admitted'],
      ...(l.closing ? [['closing', 'yes', '', 'link:closing']] : []),              // replay-only: a refused line awaiting its close echo (info, like its pill)
      ['synced', l.synced === true ? 'yes' : l.synced === false && !l.diag ? 'no' : '—', l.synced === false && !l.diag ? 'warn' : '', 'synced'],   // '—' = field absent from this capture, or meaningless on an observer
      ['paused', l.paused ? 'yes' : 'no', l.paused ? 'warn' : '', 'paused'],
      l.queued == null ? ['queued', '—', '', 'unknown@t'] : ['queued', String(l.queued), l.queued ? 'warn' : '', 'queued'],
    ]), atEnd, 'facts');
}
function inspStream(nd){
  const { origin, w, node: n } = nd.entity;   // w = the watermark ladder the row already shows (a `seen` field never existed on the entity — that fact rendered 'undefined')
  const tvr = refusedVerdict(n);
  const atEnd = tvr ? `<span class="stn" data-tip="at-end"${tvr.reason ? ` data-tip-fact="${esc(tvr.reason)}"` : ''}>@ capture end</span>` : '';
  return ihead(esc(origin), 'stream', '', `<span data-tip="stream">inbound stream</span> on ${ref(n.uuid, 'g/nodes/' + n.uuid)}`) +
    seg('Facts', kv([
      ['origin', ref(origin, 'g/nodes/' + origin), '', 'origin'],
      ['applied', esc(String(w.a)), '', 'wm:applied'],
      ['shippable', esc(String(w.s)), '', 'wm:shippable'],
      w.d == null ? ['durable', '—', '', 'unknown@t'] : ['durable', esc(String(w.d)), '', 'wm:durable'],
      w.n != null ? ['folded so far', String(w.n), '', 'stream-folded@t']            // replayed: records folded by the scrub point
                  : ['log records held', String((n.logs[origin] || []).length), '', 'log-records'],
    ]), atEnd, 'facts');
}
function inspViolation(nd){
  const v = nd.entity.v;
  return ihead(esc(nd.label), 'violation', 'crit', '<span data-tip="violation">an invariant the sim checks was violated</span> — shown verbatim') +
    seg('Violation', `<div class="recd">${esc(typeof v === 'string' ? v : JSON.stringify(v, null, 2))}</div>`, '', 'violation');
}

function render(){
  if (!CAP) return;
  renderTree(); renderBar(); renderCrumb(); renderInspector(); renderStatus(); renderScrub();   // renderTree sets `flat` → renderBar reads it
}

/* ════════════════════════════════════════════════════════════════════════
   INTERACTIONS
   ════════════════════════════════════════════════════════════════════════ */
function selectRow(i){
  const r = flat[i]; if (!r) return;
  if (r.n.type === 'more'){ $('q').focus(); return; }    // the cap row → nudge into the filter
  selKey = r.n.key; syncURL(); render();
}
function toggle(key){ if (expanded.has(key)) expanded.delete(key); else expanded.add(key); render(); }

$('tree').addEventListener('click', e => {
  if (!getSelection().isCollapsed) return;   // a drag-select ends in a click — don't nuke the highlight with a re-render
  if (e.target.closest('.ref')) return;      // reference tokens → the global .ref nav handler
  const row = e.target.closest('.trow'); if (!row) return;
  const i = +row.dataset.i; const r = flat[i];
  if (r.n.type === 'more'){ $('q').focus(); return; }
  if (e.target.closest('.tw') && r.hasKids){ toggle(r.n.key); return; }
  selKey = r.n.key;
  // clicking anywhere on a row with kids TOGGLES it (expand AND collapse), keeping it selected
  if (r.hasKids){ if (expanded.has(r.n.key)) expanded.delete(r.n.key); else expanded.add(r.n.key); }
  syncURL(); render();
});
// inspector clicks: close ✕, navigable election rows (reference tokens → the global handler)
$('insp').addEventListener('click', e => {
  if (!getSelection().isCollapsed) return;   // let inspector text be selected/copied, not swallowed as a jump
  if (e.target.closest('.iclose')){ selKey = ''; syncURL(); render(); return; }
  if (e.target.closest('.ref')) return;
  const nav = e.target.closest('[data-nav]');
  if (nav){ navTo(nav.dataset.nav); }
});
// any navigable reference token (tree meta, inspector, footer) → jump to the entity it names
document.addEventListener('click', e => {
  if (!getSelection().isCollapsed) return;
  const rf = e.target.closest('.ref'); if (!rf) return;
  e.stopPropagation(); navTo(rf.dataset.rkey);
});
// bottom breadcrumb: click a segment to navigate (root "cluster" → deselect)
$('crumb').addEventListener('click', e => {
  const s = e.target.closest('[data-segkey]'); if (!s) return;
  const k = s.dataset.segkey;
  if (k === ''){ selKey = ''; } else if (findNode(k)){ revealKey(k); selKey = k; }
  syncURL(); render(); scrollSel();
});

// ── omni box ──
// picking a suggestion INSERTS its token, replacing the partial being typed,
// then keeps focus for the next clause
function pick(tok){
  const base = query.replace(/(\S*)$/, '');
  query = (base + tok + (tok.endsWith(':') ? '' : ' ')).replace(/^\s+/, '');
  $('q').value = query; $('q').focus(); syncURL(); render();
}
$('omenu').addEventListener('mousedown', e => { const it = e.target.closest('[data-pick]'); if (!it) return; e.preventDefault(); pick(it.dataset.pick); });
$('q').addEventListener('focus', () => $('omni').classList.add('focus'));
$('q').addEventListener('blur', () => setTimeout(() => $('omni').classList.remove('focus'), 120));
$('omni').addEventListener('click', e => {
  if (e.target.closest('[data-ttx]')){ setT(null); return; }           // the time-travel chip's ✕
  if (!e.target.closest('[data-pick]')) $('q').focus();
});
$('q').addEventListener('input', e => { query = e.target.value; syncURL(); render(); });
$('oclear').addEventListener('click', e => { e.stopPropagation(); query = ''; $('q').value = ''; syncURL(); render(); });

// ── time-travel scrubber ──
function setT(v){
  const maxT = D ? D.maxT : 0;
  T = (v == null || v >= maxT) ? null : Math.max(0, v);
  if (LIVE){ if (T != null) stopPoll(true); else startPoll(); }        // scrubbing a live feed pauses polling; reset resumes
  FOREST = buildForest(CAP, T);                                        // cells + node key-stats recompute through stateAt
  // a selection absent at this T is KEPT (the inspector says 'not here yet'); it re-attaches when it reappears
  syncURL(); render();
}
$('trange').addEventListener('input', e => { if (!e.target.disabled) setT(+e.target.value); });
$('treset').addEventListener('click', () => setT(null));
// wheel over the scrubber steps time — up = forward, down = back; ~200 notches
// traverse any capture (native range inputs ignore the wheel, so this is the wiring)
$('scrub').addEventListener('wheel', e => {
  // !CAP: the error/empty pane never ran renderScrub, so the range still has its markup default
  // (enabled) — without this guard a wheel would drive setT into derive(null). deltaY 0 (a purely
  // horizontal trackpad pan) is not a time gesture — let it scroll, don't step backwards.
  if (!CAP || $('trange').disabled || !e.deltaY) return;
  e.preventDefault();
  const maxT = D ? D.maxT : 0;
  const step = Math.max(1, Math.round(maxT / 200)) * (e.deltaY < 0 ? 1 : -1);
  setT(Math.min(maxT, Math.max(0, (T != null ? T : maxT) + step)));
}, { passive: false });

// ── keyboard: j/k move · h/l collapse-expand · Enter toggle · g is:crit · a clear · / filter · Esc close ──
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && (e.key === 'o' || e.key === 'O')){ e.preventDefault(); $('file').click(); return; }  // ⌘/Ctrl+O → open a capture
  if (e.ctrlKey || e.metaKey || e.altKey) return;   // let Ctrl/Cmd+C, +A and other browser shortcuts through untouched
  if (e.target.tagName === 'INPUT'){ if (e.key === 'Escape') e.target.blur(); return; }
  const k = e.key;
  if (k === 'Escape'){ if (selKey){ selKey = ''; syncURL(); render(); } return; }   // Esc closes the inspector
  const cur = flat.findIndex(r => r.n.key === selKey);
  if (k === 'j' || k === 'ArrowDown'){ e.preventDefault(); selectRow(Math.min(flat.length - 1, (cur < 0 ? 0 : cur + 1))); scrollSel(); }
  else if (k === 'k' || k === 'ArrowUp'){ e.preventDefault(); selectRow(Math.max(0, (cur < 0 ? 0 : cur - 1))); scrollSel(); }
  else if (k === 'l' || k === 'ArrowRight'){ e.preventDefault(); const r = flat[cur]; if (r && r.hasKids && !r.open){ expanded.add(r.n.key); render(); } }
  else if (k === 'h' || k === 'ArrowLeft'){ e.preventDefault(); const r = flat[cur]; if (r && r.hasKids && r.open){ expanded.delete(r.n.key); render(); } }
  else if (k === 'Enter'){ const r = flat[cur]; if (r && r.hasKids) toggle(r.n.key); }
  else if (k === 'g'){ query = 'is:crit'; $('q').value = query; syncURL(); render(); }   // jump to the critical tier
  else if (k === 'a'){ query = ''; $('q').value = ''; syncURL(); render(); }             // clear the filter
  else if (k === '/'){ e.preventDefault(); $('q').focus(); }
});
function scrollSel(){ const el = document.querySelector('.trow[aria-selected=true]'); if (el) el.scrollIntoView({ block: 'nearest' }); }

/* ════════════════════════════════════════════════════════════════════════
   LOAD — ?scenario=<id> → one-shot /capture/<id>.json; else /capture.json
   (polled at 1.5s when kind==='live'). Any capture .json can also be dropped
   onto the page or opened via ⌘/Ctrl+O. The viewer is just a projection of
   whatever capture is loaded.
   ════════════════════════════════════════════════════════════════════════ */
function applyCapture(capture){
  CAP = capture;
  D = derive(capture);
  SUMMARY = summarize(capture);
  REPLAY = verifyReplay(capture);            // ONCE per capture load; every renderer reads this cache
  if (T != null && (D.truncated || T >= D.maxT)) T = null;   // a scrub point this capture can't honour → reset
  FOREST = buildForest(CAP, T);
  if (!SEEDED){                              // seed expansion once; live ticks preserve the user's tree thereafter
    expanded = new Set(['g/nodes', ...(capture.violations && capture.violations.length ? ['g/violations'] : [])]);
    SEEDED = true;
  }
  if (selKey && !findNode(selKey)) selKey = '';   // drop a stale selection this capture doesn't have
  if (selKey) revealKey(selKey);
  renderSrc();
}
function renderSrc(){
  const sn = $('srcName');
  if (!CAP){ sn.innerHTML = ''; return; }
  if (LIVE) sn.innerHTML = `<span data-tip="live"><b class="liveDot">●</b>&nbsp; live · ${CAP.nodes.length} node${CAP.nodes.length === 1 ? '' : 's'}</span> · ` +
    `<span data-tip="journal-rows">${klog(SUMMARY.journalRows)} journal rows</span>${PAUSED ? ' · <span class="paused" data-tip="live-paused">paused</span>' : ''}`;
  else if (SCENARIO) sn.innerHTML = `<span data-tip="scenario">scenario · <b>${esc(SCENARIO)}</b></span>`;
  else sn.innerHTML = '';                    // plain file/capture mode shows no source label (v2's quiet rule)
}
function loadStatic(capture, name){
  stopPoll(false); LIVE = false; SEEDED = false;
  try { applyCapture(capture); }
  catch (err){ $('tree').innerHTML = `<div class="empty2">Could not read <b>${esc(name)}</b>: ${esc(err.message)}</div>`; return; }
  render();
}
function startPoll(){ PAUSED = false; if (!pollTimer) pollTimer = setInterval(pollTick, 1500); renderSrc(); }
function stopPoll(paused){ if (pollTimer){ clearInterval(pollTimer); pollTimer = null; } PAUSED = !!paused; renderSrc(); }
async function pollTick(){
  try {
    const r = await fetch('/capture.json'); if (!r.ok) return;
    const capture = await r.json();
    if (capture.kind !== 'live') return;                     // the source flipped under us → keep what we have
    applyCapture(capture);                                   // expansion/selection/query all preserved (SEEDED)
    if (!getSelection().isCollapsed) return;                 // mid-copy: skip this tick's paint; the next catches up
    if (document.activeElement === $('q')){                  // don't fight the caret: repaint everything except the omni input
      renderTree(); renderCrumb(); renderInspector(); renderStatus(); renderScrub(); return;
    }
    render();
  } catch {}
}
function readFile(file){
  const r = new FileReader();
  r.onload = () => {
    try { loadStatic(JSON.parse(r.result), file.name); }
    catch (e){ $('tree').innerHTML = `<div class="empty2"><b>${esc(file.name)}</b> is not valid JSON: ${esc(e.message)}</div>`; }
  };
  r.readAsText(file);
}
$('file').addEventListener('change', e => { const f = e.target.files[0]; if (f) readFile(f); });
// drop a capture .json anywhere on the page
document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', e => { e.preventDefault(); const f = e.dataTransfer.files[0]; if (f) readFile(f); });

// the ELI5 hover layer — one delegated listener set, so every repaint above is covered (./eli5.mjs)
mountTips(document);

// boot: deep-link state first, then the source — scenario (one-shot) or /capture.json (poll when live).
// Without ?scenario= a /capture.json that is not there yet is not a failure: the file may land in a second
// (23-live starts the debugger first, then the role writes `capture 1`) — the page says it is waiting and asks
// again at the poll cadence, so no reload is ever needed. A capture the reader drops or opens meanwhile wins:
// a later answer never replaces it.
async function boot(){
  const url = SCENARIO ? `/capture/${encodeURIComponent(SCENARIO)}.json` : '/capture.json';
  try {
    const r = await fetch(url); if (!r.ok) throw new Error('HTTP ' + r.status);
    const capture = await r.json();
    if (CAP) return;
    if (!SCENARIO && capture.kind === 'live'){
      LIVE = true; applyCapture(capture); render();
      if (T == null) startPoll(); else { PAUSED = true; renderSrc(); }   // a deep-linked scrub point starts paused
    } else { applyCapture(capture); render(); }
  } catch (e){
    if (CAP) return;
    if (!SCENARIO){
      $('tree').innerHTML = `<div class="empty2">Waiting for <b>${esc(url)}</b>… (${esc(e.message)}) — asking again every 1.5 s.<br>` +
        `Or drop a capture <b>.json</b> anywhere, or press <b>⌘/Ctrl+O</b>.</div>`;
      setTimeout(boot, 1500);
      return;
    }
    $('tree').innerHTML = `<div class="empty2">Couldn't load <b>${esc(url)}</b> (${esc(e.message)}).<br>` +
      `Drop a capture <b>.json</b> anywhere, press <b>⌘/Ctrl+O</b>, or run <b>npm run debug</b>.</div>`;
  }
}
readURL(); boot();
</script>
</body>
</html>
