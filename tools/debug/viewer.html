/* ════════════════════════════════════════════════════════════════════════
   STATE + RENDER (DOM from here on)
   ════════════════════════════════════════════════════════════════════════ */
const $ = id => document.getElementById(id);

let CAP = null;         // the loaded capture (the ONE data model)
let D = null;           // derive(CAP) — cached folds
let SUMMARY = null;     // summarize(CAP)
let REPLAY = null;      // verifyReplay(CAP) — run ONCE per capture load, cached (renderers only read)
let FOREST = [];        // buildForest(CAP, T)
let expanded = new Set();
let selKey = '';        // inspector subject; also the bottom breadcrumb
let query = '';         // THE whole omni query string
let flat = [];          // current visible rows (for j/k)
let T = null;           // time-travel scrub point (journal t); null = present
let LIVE = false, PAUSED = false, pollTimer = null;
let SCENARIO = '';      // ?scenario=<id> → one-shot fetch, no polling
let SEEDED = false;     // expansion seeded once; live ticks preserve the user's tree

// the ONE effective-scrub predicate — T is only honoured when this capture can replay it
// (mirrors buildForest's gate exactly, so every surface agrees on whether we're time-travelling)
const scrubT = () => (CAP && D && T != null && !D.truncated && T < D.maxT) ? T : null;
// journal rows visible at the scrub point (journals are t-ascending, per-node index)
const jAt = (journal, t) => { let n = 0; for (const e of journal){ if (e.t > t) break; n++; } return n; };

/* flatten the forest into the visible row list, honouring expand + filter.
   With a filter active: prune non-matching branches and AUTO-EXPAND ancestors
   of matches so the hits reveal themselves. The Writes cap only applies when
   NOT filtering — a filter always searches every write. */
function flatten(){
  const ast = parseFilter(query);
  const filtering = ast.clauses.length > 0;
  flat = [];
  const walk = (nodes, depth) => {
    for (const n of nodes){
      if (filtering && !subtreeMatch(n, ast)) continue;               // prune
      const self = matchNode(n, ast);
      const hasKids = (n.kids || []).length > 0;
      const open = filtering ? (hasKids && n.kids.some(k => subtreeMatch(k, ast)) || expanded.has(n.key))
                             : expanded.has(n.key);
      flat.push({ n, depth, open, hasKids, dim: (filtering && !self) || !!n.tdim });
      if (open && hasKids){
        if (n.cap && !filtering && n.kids.length > n.cap){
          const shown = n.kids.slice(0, n.cap);
          if (selKey && !shown.some(k => k.key === selKey)){          // a selected write beyond the cap stays visible
            const s = n.kids.find(k => k.key === selKey); if (s) shown.push(s);
          }
          walk(shown, depth + 1);
          flat.push({ n: { key: n.key + '/·more', type: 'more',      // the honest cap row — filtering reveals the rest
            label: `… ${n.kids.length - n.cap} older writes not shown (filter to reveal)`,
            icon: '', sev: '', pill: null, metaRaw: '', f: {}, kids: [] },
            depth: depth + 1, open: false, hasKids: false, dim: true });
        } else walk(n.kids, depth + 1);
      }
    }
  };
  walk(FOREST, 0);
}

function rowHTML(row, i){
  const { n, depth, open, hasKids, dim } = row;
  const tw = hasKids ? (open ? '▾' : '▸') : '';
  const ind = 18 + depth * 15;
  const pill = n.pill
    ? `<span class="pill ${n.pill.cls}" title="${esc(n.pill.lab)} — ${esc(n.pill.tip || '')}"><span class="pd"></span>${esc(n.pill.lab)}</span>` : '';
  const gc = n.type === 'group' ? `<span class="gc">${n.gcount}</span>` : '';
  return `<div class="trow${dim ? ' dim' : ''}" data-i="${i}" data-type="${n.type}" data-depth="${depth}" data-sev="${n.sev || ''}" ` +
    `${n.key === selKey ? 'aria-selected="true"' : ''} style="padding-left:${ind}px">` +
    `<span class="tw ${hasKids ? '' : 'leaf'}">${tw}</span>` +
    `<span class="sd"></span>` +
    `<span class="ic">${n.icon || ''}</span>` +
    `<span class="lab">${esc(n.label)}${gc}</span>` +
    `<span class="grow"></span>` +
    `<span class="pillwrap">${pill}</span>` +
    `<span class="meta">${n.metaRaw || ''}</span></div>`;
}

function renderTree(){
  flatten();
  $('tree').innerHTML = flat.map(rowHTML).join('') || `<div class="empty2">No rows match this filter.</div>`;
}

function findNode(key, nodes = FOREST){
  for (const n of nodes){ if (n.key === key) return n; const f = n.kids && findNode(key, n.kids); if (f) return f; }
  return null;
}
function revealKey(key){ // expand all ancestors of key
  const parts = key.split('/'); let acc = '';
  for (let i = 0; i < parts.length; i++){ acc = i ? acc + '/' + parts[i] : parts[i]; if (findNode(acc)) expanded.add(acc); }
}
// jump the tree to `key`: reveal its ancestors, select it, scroll it into view
function navTo(key){ if (!findNode(key)) return; revealKey(key); selKey = key; syncURL(); render(); scrollSel(); }
// a clickable reference token — only rendered as a link when the target row exists (no dead links)
function ref(text, rkey){
  return rkey && findNode(rkey) ? `<span class="ref" data-rkey="${esc(rkey)}">${esc(String(text))}</span>` : esc(String(text));
}
const R = (txt, rkey) => ref(txt, rkey);   // journalLine's ref hook

/* ── the omni bar: chips (time-travel only) · match count · suggestions ── */
const sevDotVar = s => s === 'crit' ? 'crit' : s === 'warn' ? 'warn' : s === 'info' ? 'info' : 'soft';
function menuItem(pick, label, note, dotCls, count){
  return `<div class="oitem" data-pick="${esc(pick)}" title="${esc(label)}${note ? ' — ' + esc(note) : ''}">` +
    `<span class="od" style="background:var(--${dotCls || 'soft'})"></span><span class="ot">${esc(label)}</span>` +
    `<span class="onote">${esc(note || '')}</span><span class="oc">${count === '' ? '' : count}</span></div>`;
}
// the partial token currently being typed = the text after the last whitespace
function currentToken(){ const m = query.match(/(\S*)$/); return (m && m[1]) || ''; }
function renderMenu(){
  if (!CAP){ $('omenu').innerHTML = ''; return; }
  const partial = currentToken();
  const vals = sugValues(CAP, D);
  if (partial){
    const m = /^([a-z]+):(.*)$/i.exec(partial);
    let items = [];
    if (m && vals[m[1].toLowerCase()]){
      // completing a facet value: enumerate that head's value space, filtered by the fragment
      const t = m[1].toLowerCase(), frag = m[2].toLowerCase();
      items = vals[t].filter(v => v.toLowerCase().includes(frag)).slice(0, 14)
        .map(v => ({ tok: `${t}:${v}`, note: t === 'kind' ? 'journal kind (from capture.vocab)' : t, dot: t === 'is' ? sevDotVar(v) : 'gold-2' }));
    } else {
      // completing a bare fragment: filter heads, severities, node uuids, kind names
      const p = partial.toLowerCase();
      items = [
        ...FTYPES.filter(t => t.startsWith(p)).map(t => ({ tok: t + ':', note: 'filter head', dot: 'gold-2', nocount: true })),
        ...['crit', 'warn', 'info'].filter(s => s.startsWith(p) || ('is:' + s).includes(p)).map(s => ({ tok: 'is:' + s, note: 'severity rollup', dot: sevDotVar(s) })),
        ...CAP.nodes.filter(n => n.uuid.toLowerCase().includes(p)).slice(0, 6).map(n => ({ tok: 'node:' + n.uuid, note: 'node', dot: 'info' })),
        ...Object.keys(CAP.vocab).filter(k => k.toLowerCase().includes(p)).slice(0, 6).map(k => ({ tok: 'kind:' + k, note: 'journal kind', dot: 'soft' })),
      ];
    }
    const rows = items.length
      ? items.map(it => menuItem(it.tok, it.tok, it.note, it.dot, it.nocount ? '' : countTok(FOREST, it.tok))).join('')
      : `<div class="oitem" style="cursor:default"><span class="onote">no matches for “${esc(partial)}”</span></div>`;
    $('omenu').innerHTML = `<div class="oh">Complete “${esc(partial)}”</div>${rows}`;
    return;
  }
  // the curated default: severity rollups (live counts) → the type heads → per-type values
  const sev = ['crit', 'warn', 'info'].map(s => menuItem('is:' + s, 'is:' + s,
    s === 'crit' ? 'divergence, lost writes, violations' : s === 'warn' ? 'contested, truncated, in-flight' : 'transitions (pre-admit)',
    sevDotVar(s), countTok(FOREST, 'is:' + s))).join('');
  const heads = FTYPES.filter(t => t !== 'is').map(t =>
    menuItem(t + ':', t + ':', { node: 'a node + its links/streams', origin: 'writes/cells by origin', key: 'cells + writes by key text',
      write: 'route outcome', cell: 'election state', link: 'link state', kind: 'journal kind membership' }[t] || '', 'gold-2', '')).join('');
  const nodes = CAP.nodes.slice(0, 6).map(n => menuItem('node:' + n.uuid, 'node:' + n.uuid, 'node', 'info', countTok(FOREST, 'node:' + n.uuid))).join('');
  const kinds = vals.kind.slice(0, 8).map(k => menuItem('kind:' + k, 'kind:' + k, (D.kindFreq.get(k) || 0) + ' journal rows', 'soft', countTok(FOREST, 'kind:' + k))).join('');
  $('omenu').innerHTML = `<div class="oh">By severity</div>${sev}` +
    `<div class="osep"></div><div class="oh">By type — then a value</div>${heads}` +
    `<div class="osep"></div><div class="oh">By node</div>${nodes}` +
    `<div class="osep"></div><div class="oh">By journal kind (from this capture's vocab)</div>${kinds}`;
}
function renderBar(){
  // the only chip is the gold time-travel marker; the filter lives inline in the query string
  $('ochips').innerHTML = T != null
    ? `<span class="ochip tt"><span class="pd"></span>time-travel @ ${T}<span class="ox" data-ttx title="reset time travel">✕</span></span>` : '';
  if (document.activeElement !== $('q')) $('q').value = query;   // don't fight the caret while typing
  renderMenu();
  const ast = parseFilter(query);
  const filtering = ast.clauses.length > 0;
  const m = filtering ? flat.filter(x => !x.dim).length : null;
  // ∅-collapse hint: a same-axis repeat that matched nothing → nudge toward the comma-OR form
  const hint = filtering && m === 0 ? collapseHint(ast) : '';
  $('ocount').innerHTML = m != null
    ? `<span class="fl">${m}</span> match${m === 1 ? '' : 'es'}${hint ? ` <span style="color:var(--soft)">· try ${esc(hint)}</span>` : ''}` : '';
  $('oclear').style.display = query.trim() ? '' : 'none';
}

/* ── URL ⇆ state: q + sel + t are deep-linkable; ?scenario passes through ── */
function syncURL(){
  const p = new URLSearchParams();
  if (SCENARIO) p.set('scenario', SCENARIO);
  if (query) p.set('q', query);
  if (selKey) p.set('sel', selKey);
  if (T != null) p.set('t', String(T));
  const qs = p.toString();
  history.replaceState(null, '', qs ? '?' + qs : location.pathname);
}
function readURL(){
  const p = new URLSearchParams(location.search);
  SCENARIO = p.get('scenario') || '';
  query = p.get('q') || '';
  const s = p.get('sel'); if (s != null) selKey = s;
  const t = p.get('t'); if (t != null && t !== '' && !Number.isNaN(+t)) T = +t;
}

/* ── bottom bar: breadcrumb (location) + level-scoped rollup + scrubber ── */
function renderCrumb(){
  const segs = [{ key: '', label: 'cluster' }];
  if (selKey){
    const parts = selKey.split('/'); let acc = '';
    for (let i = 0; i < parts.length; i++){
      acc = i ? acc + '/' + parts[i] : parts[i];
      const n = findNode(acc);
      if (n) segs.push({ key: acc, label: n.type === 'group' ? n.label.toLowerCase() : n.label });
    }
  }
  const cur = segs.length - 1;
  $('crumb').innerHTML = segs.map((s, i) =>
    `<span class="cseg${i === cur ? ' cur' : ''}" data-segkey="${esc(s.key)}">${esc(s.label)}</span>`).join('<span class="csep">›</span>');
}
const sst = (st, txt) => `<span class="sst ${st || 'ok'}">${txt}</span>`;
// the capture header facts — everything from summarize() + the cached verifyReplay()
function headerFacts(){
  const s = SUMMARY;
  const bits = [esc(s.kind || '—')];
  if (s.seed != null) bits.push('seed ' + esc(String(s.seed)));
  if (s.kind === 'sim') bits.push(s.quiesced ? 'quiesced' : sst('warn', 'not quiesced'));
  // shrunk captures (M7): the pill renders RECORDED facts only (summarize passes capture.shrunk through);
  // a capture frozen AT its violating event is mid-flight by construction — divergence there is not a
  // finding, so soften (never hide) it, keyed STRICTLY on the recorded atViolation fact.
  if (s.shrunk) bits.push(sst('warn', `shrunk ${s.shrunk.from.steps}→${s.shrunk.steps.length} steps${s.shrunk.atViolation ? ' · ends @ violation' : ''}`));
  // converged === null means ZERO captured nodes (an attach where nobody answered) — "no nodes" is the
  // only honest render; a green badge over an empty set would be the vacuous-true lie the fold refuses
  bits.push(s.converged === null ? sst('warn', 'no nodes')
    : s.converged ? 'converged ✓'
    : (s.shrunk && s.shrunk.atViolation ? sst('warn', 'mid-flight @ violation') : sst('crit', 'diverged ✗')));
  // absent rows (M7 attach): targets that yielded no slice this rebuild — named with their typed reason,
  // never synthesized into node cards (absence renders as absence)
  if (s.absent && s.absent.length)
    bits.push(sst('warn', `absent: ${s.absent.map(a => `${esc(a.target)} (${esc(a.reason)})`).join(', ')}`));
  if (s.converged !== null) { // zero nodes ⇒ no replay basis — claim nothing rather than a vacuous ✓
    const bad = REPLAY.find(r => !r.ok);
    bits.push(!bad ? 'replay ✓' : sst('crit', `replay ✗ ${esc(bad.uuid)}: ${esc(bad.reason)}`));
  }
  if (s.violations.length) bits.push(sst('crit', s.violations.length + ' violation' + (s.violations.length === 1 ? '' : 's')));
  bits.push(s.events != null ? s.events + ' events' : klog(s.journalRows) + ' journal rows');
  return bits.join(' · ');
}
function renderStatus(){
  const sb = $('statusRight');
  if (!CAP){ sb.innerHTML = ''; return; }
  const node = selKey ? findNode(selKey) : null;
  if (!node){ sb.innerHTML = headerFacts(); return; }                    // nothing selected → the capture's headline facts
  const e = node.entity;
  if (node.type === 'group'){
    const bad = node.kids.filter(k => k.sev === 'crit').length, wrn = node.kids.filter(k => k.sev === 'warn').length;
    sb.innerHTML = `${node.gcount} ${esc(node.label.toLowerCase())}` +
      (bad ? ` · ${sst('crit', bad + ' crit')}` : '') + (wrn ? ` · ${sst('warn', wrn + ' warn')}` : '');
  } else if (node.type === 'node'){
    const n = e.node;
    const t = scrubT();   // the bar mirrors the tree: replayed keys + journal progress at the scrub point
    sb.innerHTML = t != null
      ? `${sst('', '@ t' + t)} · ${stateAt(CAP, n.uuid, t).size} keys · journal ${klog(jAt(n.journal, t))}/${klog(n.journal.length)}`
      : `${sst(node.sev, node.pill ? node.pill.lab : 'converged')} · seq ${n.seq ?? '—'} · ${n.state.length} keys · journal ${klog(n.journal.length)}`;
  } else if (node.type === 'write'){
    sb.innerHTML = `write ${esc(node.label)} · ${sst(node.sev, esc(e.o.summaryText))}`;
  } else if (node.type === 'cell'){
    sb.innerHTML = `cell · ${sst(node.sev, node.pill ? node.pill.lab : 'settled')} · winner ${e.cell.winner ? esc(e.cell.winner.origin + '#' + e.cell.winner.seq) : '—'}`;
  } else if (node.type === 'link'){
    sb.innerHTML = `link · ${sst(node.sev, node.pill ? node.pill.lab : 'up')} · queued ${e.link.queued}`;
  } else if (node.type === 'stream'){
    sb.innerHTML = `stream ${esc(e.origin)} · applied ${esc(String(e.w.a))} · shippable ${esc(String(e.w.s))} · durable ${esc(String(e.w.d))}`;
  } else if (node.type === 'violation'){
    sb.innerHTML = sst('crit', 'invariant violated');
  } else sb.innerHTML = headerFacts();
}
// the time-travel scrubber — quiet; disabled (with the honest tooltip) when any journal truncated
function renderScrub(){
  const r = $('trange'), maxT = D ? D.maxT : 0;
  r.max = maxT;
  const off = !CAP || (D && D.truncated) || maxT === 0;
  r.disabled = off;
  r.title = D && D.truncated ? 'journal truncated — replay unavailable'
    : 'time-travel — drag or mouse-wheel to replay every journal to an event index (stateAt fold)';
  const cur = T != null ? Math.min(T, maxT) : maxT;
  if (document.activeElement !== r) r.value = cur;
  $('tread').textContent = CAP ? `@ ${cur}/${maxT}` : '';
  $('tread').classList.toggle('on', T != null);
  $('treset').style.display = T != null ? '' : 'none';
}

/* ════════════════════════════════════════════════════════════════════════
   INSPECTOR — the selected row's rich leaf view
   ════════════════════════════════════════════════════════════════════════ */
const seg = (title, body, extra = '') => `<div class="seg"><div class="st">${title}${extra}</div>${body}</div>`;
const kv = rows => `<dl class="kv">${rows.map(([k, v, c]) => `<dt>${k}</dt><dd class="${c || ''}">${v}</dd>`).join('')}</dl>`;
function ihead(title, kind, sev, sub){
  return `<div class="ih ${sev || 'ok'}"><div class="ik"><span class="sd"></span><span class="tt">${title}</span>` +
    `<span class="kind">${esc(kind)}</span><span class="iclose" title="close · Esc">✕</span></div>` +
    `<div class="isub">${sub}</div></div>`;
}
function renderInspector(){
  const node = selKey ? findNode(selKey) : null;
  const body = document.querySelector('.body');
  // no selection → collapse the pane so the tree reclaims its column
  if (!node || !node.entity){ body.classList.add('noinsp'); $('insp').innerHTML = ''; return; }
  body.classList.remove('noinsp');
  const e = node.entity;
  let html = '';
  if (e.kind === 'node') html = inspNode(node);
  else if (e.kind === 'write') html = inspWrite(node);
  else if (e.kind === 'cell') html = inspCell(node);
  else if (e.kind === 'link') html = inspLink(node);
  else if (e.kind === 'stream') html = inspStream(node);
  else if (e.kind === 'violation') html = inspViolation(node);
  // one quiet banner while time-travelling — says which panes replay and which are end facts
  const t = scrubT();
  if (t != null) html = `<div class="tban">replayed @ t${t} — state, journal & routes at the scrub point · links, streams & elections show capture end</div>` + html;
  $('insp').innerHTML = html;
}
function inspNode(nd){
  const n = nd.entity.node;
  // time-travel scopes everything journal-DERIVABLE to t ≤ T (keys via stateAt, the mini-log,
  // the by-kind rollup); facts the capture only holds at END (seq/epoch/links/streams) stay,
  // labelled — deriving them would mean minting state the fold layer never proved
  const t = scrubT();
  const rows = t != null ? n.journal.slice(0, jAt(n.journal, t)) : n.journal;
  const sub = `<span class="mono">${esc(n.listen ?? '—')}</span> · seq ${esc(String(n.seq ?? '—'))} · epoch ${esc(String(n.epoch ?? '—'))}`;
  const facts = kv([
    ['listen', esc(String(n.listen ?? '—'))],
    ['seq', esc(String(n.seq ?? '—'))],
    ['epoch', esc(String(n.epoch ?? '—'))],
    ['stateHash', esc(String(n.stateHash)), n.stateHash !== D.modal && CAP.nodes.length > 1 ? 'bad' : ''],
    ['keys', t != null ? `${stateAt(CAP, n.uuid, t).size} <span class="x">@ t${t} · ${n.state.length} at end</span>` : String(n.state.length)],
    ['journal', t != null ? `${klog(rows.length)} <span class="x">≤ t${t} · ${klog(n.journal.length)} retained</span>`
                          : klog(n.journal.length) + (n.dropped > 0 ? ` / ${klog(n.dropped)} dropped` : ' / 0 dropped'), n.dropped > 0 ? 'warn' : ''],
  ]);
  const lrows = n.links.map(l => {
    const state = !l.admitted ? 'pre-admit' : l.synced === false ? 'syncing' : l.synced === true ? 'synced' : '—';
    const cls = !l.admitted ? '' : l.synced === false ? 'min' : l.synced === true ? 'maj' : '';
    return `<tr><td class="node">${l.uuid ? ref(l.uuid, 'g/nodes/' + l.uuid) : '—'} <span style="color:var(--soft)">#${esc(String(l.id))}</span></td>` +
      `<td>${l.dialed ? 'dialed' : 'accepted'}</td><td class="${cls}">${state}${l.paused ? ' <span class="min">· paused</span>' : ''}</td><td>${esc(String(l.queued))}</td></tr>`;
  }).join('');
  const links = n.links.length
    ? `<table class="vt"><thead><tr><th>peer</th><th>side</th><th>state</th><th>queued</th></tr></thead><tbody>${lrows}</tbody></table>`
    : `<div class="reason">No links.</div>`;
  const srows = Object.entries(n.streams || {}).map(([o, v]) => { const w = wm(v); return (
    `<tr><td class="node">${ref(o, 'g/nodes/' + o)}</td><td>${esc(String(w.a))}</td><td>${esc(String(w.s))}</td><td>${esc(String(w.d))}</td><td>${(n.logs[o] || []).length}</td></tr>`)}).join('');
  const streams = srows
    ? `<table class="vt"><thead><tr><th>origin</th><th>applied</th><th>shippable</th><th>durable</th><th>log records</th></tr></thead><tbody>${srows}</tbody></table>`
    : `<div class="reason">No inbound streams yet.</div>`;
  // the journal mini-log — newest first, human-readable via the capture's vocab;
  // under scrub it is the window ENDING AT the scrub point, so dragging/wheeling
  // steps visibly through this node's history (the whole point of time travel)
  const jr = rows.slice(-15).reverse();
  const jlog = jr.length ? `<div class="mlog">` + jr.map(e => {
    const name = D.names[e.kind] || ('kind' + e.kind);
    return `<div class="mr"><span class="stp">t${e.t}</span><span class="kvv">${journalLine(name, e, R)}</span>` +
      `<span class="oc ${JCLS[name] || 'fwd'}">${esc(name)}</span></div>`;
  }).join('') + `</div>` : `<div class="reason">Nothing yet at this point.</div>`;
  // one-line counts-by-kind rollup (scoped with the mini-log while scrubbing)
  const counts = new Map();
  for (const e of rows) { const nm = D.names[e.kind] || ('kind' + e.kind); counts.set(nm, (counts.get(nm) || 0) + 1); }
  const roll = [...counts.entries()].sort((a, b) => b[1] - a[1]).slice(0, 6)
    .map(([k, c]) => `${esc(k)} ×${c}`).join(' · ') + (counts.size > 6 ? ` · +${counts.size - 6} kinds` : '');
  const atEnd = t != null ? `<span class="stn">@ capture end</span>` : '';
  return ihead(esc(n.uuid), 'node', nd.sev, sub) +
    seg('Facts', facts) +
    seg('Links', links, atEnd || `<span class="stn">${n.links.filter(l => l.admitted).length}/${n.links.length} admitted</span>`) +
    seg('Streams', streams, atEnd) +
    seg('Journal · newest first', jlog, `<span class="stn">last ${jr.length} of ${klog(rows.length)}${t != null ? ` ≤ t${t}` : ''}${n.dropped > 0 ? ' · +' + klog(n.dropped) + ' dropped' : ''}</span>`) +
    seg('By kind', `<div class="reason mono" style="font-size:11px">${roll || '—'}</div>`, t != null ? `<span class="stn">≤ t${t}</span>` : '');
}
function inspWrite(nd){
  const { r, rec, o } = nd.entity;
  const key = rec ? prettyCell(cellKey(rec.k, rec.at)) : null;
  // under scrub the header rollup is the AT-T count (each stop's status is a journal fact AT its
  // own s.t, so counting stops with s.t ≤ T is a derivation) — o.summaryText is the END-of-run
  // verdict and would contradict the banner; same reason the sev colour is muted while scrubbing
  const t = scrubT();
  const allStops = CAP.nodes.map(n => ({ uuid: n.uuid, ...(r.nodes[n.uuid] || { status: 'never-arrived', t: null }) }));
  const okAtT = t != null ? allStops.filter(s => s.t != null && s.t <= t && (s.status === 'origin' || s.status === 'applied')).length : 0;
  const rollup = t != null ? `applied ${okAtT}/${CAP.nodes.length} by t${t}` : o.summaryText;
  const sub = rec
    ? `<span class="mono">${esc(key)}</span>${rec.ty === 2 ? ' <span class="warnt">removed</span>' : ' = <span class="mono">' + esc(fmtVal(rec.v, 48)) + '</span>'} · ${esc(rollup)}`
    : `record not captured · ${esc(rollup)}`;
  const recd = rec
    ? `{ type:<span class="vv">'${esc(tyName(rec.ty))}'</span>, key:<span class="kk">'${esc(key)}'</span>` +
      (rec.ty === 2 ? '' : `, value:<span class="vv">${esc(fmtVal(rec.v, 60))}</span>`) + ` }\n` +
      `<span style="color:var(--soft)">@ seq ${esc(String(rec.seq))} · epoch ${esc(String(rec.epoch))} · origin ${ref(r.origin, 'g/nodes/' + r.origin)}` +
      (r.partition !== '' ? ` · part ${esc(String(r.partition))}` : '') + `</span>`
    : `<span class="bad">record not captured</span> — no node's log holds ${esc(r.origin)} seq ${esc(String(r.seq))}; the payload is unknown (never invented)`;
  // the LWW winner that beat this write, when the election is findable in the captured logs.
  // NOT under scrub: D.contested is the END-of-run election — at T the loser may have lost to
  // an intermediate write, and the final winner may not even have arrived anywhere yet (naming
  // it would be the route pane minting the future the banner promises it doesn't)
  let beatenBy = '';
  if (rec && o.lost.length && t == null){
    const c = D.contested.get(cellKey(rec.k, rec.at));
    const w = c && c.winner;
    if (w && !(w.origin === r.origin && w.seq === r.seq))
      beatenBy = ` to ${ref(w.origin + '#' + w.seq, 'g/writes/' + w.origin + '#' + w.seq)}`;
  }
  // the route timeline — one stop per node, in arrival order; absence is REAL information.
  // Under scrub, each stop's t is compared to T: a stop the replay hasn't reached yet says
  // so instead of its end-of-run verdict (whose severity would be a claim about the future)
  const stops = [...allStops].sort((a, b) => (a.t == null) - (b.t == null) || (a.t ?? 0) - (b.t ?? 0));
  const lis = stops.map(s => {
    if (t != null && (s.t == null || s.t > t))
      return `<li class="now"><span class="ep">${ref(s.uuid, 'g/nodes/' + s.uuid)}</span><span class="x">not arrived by t${t}</span></li>`;
    const at = s.t != null ? ` <span class="x">· t${s.t}</span>` : '';
    if (s.status === 'origin') return `<li class="done"><span class="ep">${ref(s.uuid, 'g/nodes/' + s.uuid)}</span><b>origin</b> — wrote seq ${esc(String(r.seq))}${at}</li>`;
    if (s.status === 'applied') return `<li class="done"><span class="ep">${ref(s.uuid, 'g/nodes/' + s.uuid)}</span>applied${at}</li>`;
    if (s.status === 'lww-lost') return `<li class="bad"><span class="ep">${ref(s.uuid, 'g/nodes/' + s.uuid)}</span><span class="bad">lost LWW</span>${beatenBy}${at}</li>`;
    if (s.status === 'duplicate') return `<li class="now"><span class="ep">${ref(s.uuid, 'g/nodes/' + s.uuid)}</span>dup discarded — already seen${at}</li>`;
    return D.live
      ? `<li class="now"><span class="ep">${ref(s.uuid, 'g/nodes/' + s.uuid)}</span>not yet arrived</li>`
      : `<li class="bad"><span class="ep">${ref(s.uuid, 'g/nodes/' + s.uuid)}</span><b>never arrived</b></li>`;
  }).join('');
  // sev muted under scrub — the crit/warn colour is the END verdict (never-arrived/lww-lost),
  // not a fact at T; the tree row keeps it (with tdim) because the tree is explicitly the ledger
  return ihead(esc(r.origin + '#' + r.seq), 'write', t != null ? '' : nd.sev, sub) +
    seg('Change record', `<div class="recd">${recd}</div>`) +
    seg('Route', `<ul class="tl">${lis}</ul>`, r.partition !== '' ? `<span class="stn">part ${esc(String(r.partition))}</span>` : '');
}
function inspCell(nd){
  const c = nd.entity.cell;
  const winTok = c.winner ? c.winner.origin + '#' + c.winner.seq : null;
  const sub = `= <span class="mono">${esc(fmtVal(c.value, 48))}</span> · winner ${winTok ? `<span class="mono">${ref(winTok, 'g/writes/' + winTok)}</span>` : '—'}`;
  const facts = kv([
    ['winner', winTok ? ref(winTok, 'g/writes/' + winTok) : '—'],                       // '—' = no untruncated journal to replay: never guessed
    ['epoch·seq', c.winner ? `e${esc(String(c.winner.epoch))}·s${esc(String(c.winner.seq))}` : '—'],
    ['candidates', String(c.cand), c.cand > 1 ? 'warn' : ''],
  ]);
  // the election — every candidate the captured logs hold, newest first, winner badged.
  // Suppressed under scrub, matching cellRows: election data is end-of-run, and a mid-replay
  // cell showing its final election would be the viewer claiming the future
  const cont = scrubT() != null ? null : D.contested.get(c.ck);
  const election = cont ? seg('Election · newest first', `<div class="mlog">` + cont.candidates.map(x => {
    const tok = x.origin + '#' + x.seq;
    const won = cont.winner && cont.winner.origin === x.origin && cont.winner.seq === x.seq;
    return `<div class="mr" data-nav="${esc('g/writes/' + tok)}"><span class="stp">e${esc(String(x.epoch))}</span>` +
      `<span class="kvv">${esc(tok)} → ${x.ty === 2 ? '<span class="kk">remove</span>' : esc(fmtVal(x.v))}</span>` +
      `<span class="oc ${won ? 'applied' : 'conflict'}">${won ? 'won' : 'lost'}</span></div>`;
  }).join('') + `</div>`, `<span class="stn">${cont.candidates.length} candidates</span>`) : '';
  // per-node values — only when nodes disagree; a missing cell renders as absent
  const first = c.perNode.find(p => p.has);
  const winJson = first ? JSON.stringify(first.v) : undefined;
  const perNode = c.diverged ? seg('Per-node value', `<table class="vt"><thead><tr><th>node</th><th>value</th></tr></thead><tbody>` +
    c.perNode.map(p => {
      const bad = !p.has || JSON.stringify(p.v) !== winJson;
      return `<tr><td class="node">${ref(p.uuid, 'g/nodes/' + p.uuid)}</td>` +
        `<td class="${bad ? 'min' : 'maj'}">${p.has ? esc(fmtVal(p.v, 56)) : '∅ absent'}</td></tr>`;
    }).join('') + `</tbody></table>`) : '';
  return ihead(esc(prettyCell(c.ck)), 'cell', nd.sev, sub) + seg('Facts', facts) + election + perNode;
}
function inspLink(nd){
  const { link: l, node: n } = nd.entity;
  const peer = l.uuid ? ref(l.uuid, 'g/nodes/' + l.uuid) : '<span class="warnt">unidentified</span>';
  return ihead(esc(l.uuid ? '→' + l.uuid : 'link#' + l.id), 'link', nd.sev,
      `${ref(n.uuid, 'g/nodes/' + n.uuid)} ⇄ ${peer} · ${l.dialed ? 'dialed' : 'accepted'}`) +
    seg('Facts', kv([
      ['link id', '#' + esc(String(l.id))],
      ['peer', peer],
      ['side', l.dialed ? 'dialed' : 'accepted'],
      ['admitted', l.admitted ? 'yes' : 'no', l.admitted ? '' : 'warn'],
      ['synced', l.synced === true ? 'yes' : l.synced === false ? 'no' : '—', l.synced === false ? 'warn' : ''],   // '—' = field absent from this capture
      ['paused', l.paused ? 'yes' : 'no', l.paused ? 'warn' : ''],
      ['queued', String(l.queued), l.queued ? 'warn' : ''],
    ]));
}
function inspStream(nd){
  const { origin, seen, node: n } = nd.entity;
  return ihead(esc(origin), 'stream', '', `inbound stream on ${ref(n.uuid, 'g/nodes/' + n.uuid)}`) +
    seg('Facts', kv([
      ['origin', ref(origin, 'g/nodes/' + origin)],
      ['seen (high-water)', esc(String(seen))],
      ['log records held', String((n.logs[origin] || []).length)],
    ]));
}
function inspViolation(nd){
  const v = nd.entity.v;
  return ihead(esc(nd.label), 'violation', 'crit', 'an invariant the sim checks was violated — shown verbatim') +
    seg('Violation', `<div class="recd">${esc(typeof v === 'string' ? v : JSON.stringify(v, null, 2))}</div>`);
}

function render(){
  if (!CAP) return;
  renderTree(); renderBar(); renderCrumb(); renderInspector(); renderStatus(); renderScrub();   // renderTree sets `flat` → renderBar reads it
}

/* ════════════════════════════════════════════════════════════════════════
   INTERACTIONS
   ════════════════════════════════════════════════════════════════════════ */
function selectRow(i){
  const r = flat[i]; if (!r) return;
  if (r.n.type === 'more'){ $('q').focus(); return; }    // the cap row → nudge into the filter
  selKey = r.n.key; syncURL(); render();
}
function toggle(key){ if (expanded.has(key)) expanded.delete(key); else expanded.add(key); render(); }

$('tree').addEventListener('click', e => {
  if (!getSelection().isCollapsed) return;   // a drag-select ends in a click — don't nuke the highlight with a re-render
  if (e.target.closest('.ref')) return;      // reference tokens → the global .ref nav handler
  const row = e.target.closest('.trow'); if (!row) return;
  const i = +row.dataset.i; const r = flat[i];
  if (r.n.type === 'more'){ $('q').focus(); return; }
  if (e.target.closest('.tw') && r.hasKids){ toggle(r.n.key); return; }
  selKey = r.n.key;
  // clicking anywhere on a row with kids TOGGLES it (expand AND collapse), keeping it selected
  if (r.hasKids){ if (expanded.has(r.n.key)) expanded.delete(r.n.key); else expanded.add(r.n.key); }
  syncURL(); render();
});
// inspector clicks: close ✕, navigable election rows (reference tokens → the global handler)
$('insp').addEventListener('click', e => {
  if (!getSelection().isCollapsed) return;   // let inspector text be selected/copied, not swallowed as a jump
  if (e.target.closest('.iclose')){ selKey = ''; syncURL(); render(); return; }
  if (e.target.closest('.ref')) return;
  const nav = e.target.closest('[data-nav]');
  if (nav){ navTo(nav.dataset.nav); }
});
// any navigable reference token (tree meta, inspector, footer) → jump to the entity it names
document.addEventListener('click', e => {
  if (!getSelection().isCollapsed) return;
  const rf = e.target.closest('.ref'); if (!rf) return;
  e.stopPropagation(); navTo(rf.dataset.rkey);
});
// bottom breadcrumb: click a segment to navigate (root "cluster" → deselect)
$('crumb').addEventListener('click', e => {
  const s = e.target.closest('[data-segkey]'); if (!s) return;
  const k = s.dataset.segkey;
  if (k === ''){ selKey = ''; } else if (findNode(k)){ revealKey(k); selKey = k; }
  syncURL(); render(); scrollSel();
});

// ── omni box ──
// picking a suggestion INSERTS its token, replacing the partial being typed,
// then keeps focus for the next clause
function pick(tok){
  const base = query.replace(/(\S*)$/, '');
  query = (base + tok + (tok.endsWith(':') ? '' : ' ')).replace(/^\s+/, '');
  $('q').value = query; $('q').focus(); syncURL(); render();
}
$('omenu').addEventListener('mousedown', e => { const it = e.target.closest('[data-pick]'); if (!it) return; e.preventDefault(); pick(it.dataset.pick); });
$('q').addEventListener('focus', () => $('omni').classList.add('focus'));
$('q').addEventListener('blur', () => setTimeout(() => $('omni').classList.remove('focus'), 120));
$('omni').addEventListener('click', e => {
  if (e.target.closest('[data-ttx]')){ setT(null); return; }           // the time-travel chip's ✕
  if (!e.target.closest('[data-pick]')) $('q').focus();
});
$('q').addEventListener('input', e => { query = e.target.value; syncURL(); render(); });
$('oclear').addEventListener('click', e => { e.stopPropagation(); query = ''; $('q').value = ''; syncURL(); render(); });

// ── time-travel scrubber ──
function setT(v){
  const maxT = D ? D.maxT : 0;
  T = (v == null || v >= maxT) ? null : Math.max(0, v);
  if (LIVE){ if (T != null) stopPoll(true); else startPoll(); }        // scrubbing a live feed pauses polling; reset resumes
  FOREST = buildForest(CAP, T);                                        // cells + node key-stats recompute through stateAt
  if (selKey && !findNode(selKey)) selKey = '';
  syncURL(); render();
}
$('trange').addEventListener('input', e => { if (!e.target.disabled) setT(+e.target.value); });
$('treset').addEventListener('click', () => setT(null));
// wheel over the scrubber steps time — up = forward, down = back; ~200 notches
// traverse any capture (native range inputs ignore the wheel, so this is the wiring)
$('scrub').addEventListener('wheel', e => {
  // !CAP: the error/empty pane never ran renderScrub, so the range still has its markup default
  // (enabled) — without this guard a wheel would drive setT into derive(null). deltaY 0 (a purely
  // horizontal trackpad pan) is not a time gesture — let it scroll, don't step backwards.
  if (!CAP || $('trange').disabled || !e.deltaY) return;
  e.preventDefault();
  const maxT = D ? D.maxT : 0;
  const step = Math.max(1, Math.round(maxT / 200)) * (e.deltaY < 0 ? 1 : -1);
  setT(Math.min(maxT, Math.max(0, (T != null ? T : maxT) + step)));
}, { passive: false });

// ── keyboard: j/k move · h/l collapse-expand · Enter toggle · g is:crit · a clear · / filter · Esc close ──
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && (e.key === 'o' || e.key === 'O')){ e.preventDefault(); $('file').click(); return; }  // ⌘/Ctrl+O → open a capture
  if (e.ctrlKey || e.metaKey || e.altKey) return;   // let Ctrl/Cmd+C, +A and other browser shortcuts through untouched
  if (e.target.tagName === 'INPUT'){ if (e.key === 'Escape') e.target.blur(); return; }
  const k = e.key;
  if (k === 'Escape'){ if (selKey){ selKey = ''; syncURL(); render(); } return; }   // Esc closes the inspector
  const cur = flat.findIndex(r => r.n.key === selKey);
  if (k === 'j' || k === 'ArrowDown'){ e.preventDefault(); selectRow(Math.min(flat.length - 1, (cur < 0 ? 0 : cur + 1))); scrollSel(); }
  else if (k === 'k' || k === 'ArrowUp'){ e.preventDefault(); selectRow(Math.max(0, (cur < 0 ? 0 : cur - 1))); scrollSel(); }
  else if (k === 'l' || k === 'ArrowRight'){ e.preventDefault(); const r = flat[cur]; if (r && r.hasKids && !r.open){ expanded.add(r.n.key); render(); } }
  else if (k === 'h' || k === 'ArrowLeft'){ e.preventDefault(); const r = flat[cur]; if (r && r.hasKids && r.open){ expanded.delete(r.n.key); render(); } }
  else if (k === 'Enter'){ const r = flat[cur]; if (r && r.hasKids) toggle(r.n.key); }
  else if (k === 'g'){ query = 'is:crit'; $('q').value = query; syncURL(); render(); }   // jump to the critical tier
  else if (k === 'a'){ query = ''; $('q').value = ''; syncURL(); render(); }             // clear the filter
  else if (k === '/'){ e.preventDefault(); $('q').focus(); }
});
function scrollSel(){ const el = document.querySelector('.trow[aria-selected=true]'); if (el) el.scrollIntoView({ block: 'nearest' }); }

/* ════════════════════════════════════════════════════════════════════════
   LOAD — ?scenario=<id> → one-shot /capture/<id>.json; else /capture.json
   (polled at 1.5s when kind==='live'). Any capture .json can also be dropped
   onto the page or opened via ⌘/Ctrl+O. The viewer is just a projection of
   whatever capture is loaded.
   ════════════════════════════════════════════════════════════════════════ */
function applyCapture(capture){
  CAP = capture;
  D = derive(capture);
  SUMMARY = summarize(capture);
  REPLAY = verifyReplay(capture);            // ONCE per capture load; every renderer reads this cache
  if (T != null && (D.truncated || T >= D.maxT)) T = null;   // a scrub point this capture can't honour → reset
  FOREST = buildForest(CAP, T);
  if (!SEEDED){                              // seed expansion once; live ticks preserve the user's tree thereafter
    expanded = new Set(['g/nodes', ...(capture.violations && capture.violations.length ? ['g/violations'] : [])]);
    SEEDED = true;
  }
  if (selKey && !findNode(selKey)) selKey = '';   // drop a stale selection this capture doesn't have
  if (selKey) revealKey(selKey);
  renderSrc();
}
function renderSrc(){
  const sn = $('srcName');
  if (!CAP){ sn.innerHTML = ''; return; }
  if (LIVE) sn.innerHTML = `<b class="liveDot">●</b>&nbsp; live · ${CAP.nodes.length} node${CAP.nodes.length === 1 ? '' : 's'} · ` +
    `${klog(SUMMARY.journalRows)} journal rows${PAUSED ? ' · <span class="paused">paused</span>' : ''}`;
  else if (SCENARIO) sn.innerHTML = `scenario · <b>${esc(SCENARIO)}</b>`;
  else sn.innerHTML = '';                    // plain file/capture mode shows no source label (v2's quiet rule)
}
function loadStatic(capture, name){
  stopPoll(false); LIVE = false; SEEDED = false;
  try { applyCapture(capture); }
  catch (err){ $('tree').innerHTML = `<div class="empty2">Could not read <b>${esc(name)}</b>: ${esc(err.message)}</div>`; return; }
  render();
}
function startPoll(){ PAUSED = false; if (!pollTimer) pollTimer = setInterval(pollTick, 1500); renderSrc(); }
function stopPoll(paused){ if (pollTimer){ clearInterval(pollTimer); pollTimer = null; } PAUSED = !!paused; renderSrc(); }
async function pollTick(){
  try {
    const r = await fetch('/capture.json'); if (!r.ok) return;
    const capture = await r.json();
    if (capture.kind !== 'live') return;                     // the source flipped under us → keep what we have
    applyCapture(capture);                                   // expansion/selection/query all preserved (SEEDED)
    if (!getSelection().isCollapsed) return;                 // mid-copy: skip this tick's paint; the next catches up
    if (document.activeElement === $('q')){                  // don't fight the caret: repaint everything except the omni input
      renderTree(); renderCrumb(); renderInspector(); renderStatus(); renderScrub(); return;
    }
    render();
  } catch {}
}
function readFile(file){
  const r = new FileReader();
  r.onload = () => {
    try { loadStatic(JSON.parse(r.result), file.name); }
    catch (e){ $('tree').innerHTML = `<div class="empty2"><b>${esc(file.name)}</b> is not valid JSON: ${esc(e.message)}</div>`; }
  };
  r.readAsText(file);
}
$('file').addEventListener('change', e => { const f = e.target.files[0]; if (f) readFile(f); });
// drop a capture .json anywhere on the page
document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', e => { e.preventDefault(); const f = e.dataTransfer.files[0]; if (f) readFile(f); });

// boot: deep-link state first, then the source — scenario (one-shot) or /capture.json (poll when live)
(async function boot(){
  readURL();
  const url = SCENARIO ? `/capture/${encodeURIComponent(SCENARIO)}.json` : '/capture.json';
  try {
    const r = await fetch(url); if (!r.ok) throw new Error('HTTP ' + r.status);
    const capture = await r.json();
    if (!SCENARIO && capture.kind === 'live'){
      LIVE = true; applyCapture(capture); render();
      if (T == null) startPoll(); else { PAUSED = true; renderSrc(); }   // a deep-linked scrub point starts paused
    } else { applyCapture(capture); render(); }
  } catch (e){
    $('tree').innerHTML = `<div class="empty2">Couldn't load <b>${esc(url)}</b> (${esc(e.message)}).<br>` +
      `Drop a capture <b>.json</b> anywhere, press <b>⌘/Ctrl+O</b>, or run <b>npm run debug</b>.</div>`;
  }
})();
</script>
</body>
</html>
