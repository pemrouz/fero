<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fero · key autopsy — answer-first</title>
<style>
  :root{
    --bg:#0e1014; --panel:#16181d; --panel-2:#1b1e25; --line:#262932;
    --ink:#dde1e9; --dim:#8b919e; --soft:#5b616c;
    --accent:#6cb6ff; --bad:#e5645c; --benign:#c9a23f; --good:#5bbf91;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.65 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
  code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.92em;color:var(--ink);
    background:var(--panel-2);border:1px solid var(--line);border-radius:3px;padding:.02em .35em}
  b{font-weight:650;color:#fff}
  main{max-width:880px;margin:0 auto;padding:0 24px 80px}

  /* ---- top chrome ---- */
  header{max-width:880px;margin:0 auto;padding:22px 24px 0}
  .crumb{color:var(--soft);font-size:12px;letter-spacing:.02em}
  .crumb b{color:var(--dim);font-weight:600}
  .mock{float:right;color:var(--soft);font-size:11px;border:1px solid var(--line);border-radius:3px;padding:2px 8px}
  .switch{display:flex;gap:18px;align-items:baseline;margin:18px 0 6px;border-bottom:1px solid var(--line);padding-bottom:0}
  .switch button{background:none;border:0;color:var(--dim);font:inherit;font-size:14px;font-weight:600;
    padding:6px 0 10px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
  .switch button:hover{color:var(--ink)}
  .switch button[aria-pressed=true]{color:var(--ink);border-bottom-color:var(--accent)}
  .switch .st{font-size:11px;font-weight:600;margin-left:7px}
  .switch .st.bad{color:var(--bad)} .switch .st.ok{color:var(--good)}

  /* ---- the answer (lede) ---- */
  .answer{margin:30px 0 6px}
  .health{display:flex;align-items:center;gap:11px;margin-bottom:12px}
  .health .word{font-size:13px;font-weight:700;letter-spacing:.09em;text-transform:uppercase}
  .health .word.bad{color:var(--bad)} .health .word.ok{color:var(--good)}
  .health .keyname{color:var(--dim);font-size:14px}
  .health .keyname code{font-size:14px}
  .lede{font-size:21px;line-height:1.5;font-weight:400;color:var(--ink);letter-spacing:-.005em}
  .lede b{font-weight:650}
  .facts{margin-top:14px;color:var(--soft);font-size:12.5px}
  .facts span{white-space:nowrap}
  .facts i{color:var(--line);font-style:normal;margin:0 9px}

  /* ---- inline glossary terms ---- */
  .t{border-bottom:1px dotted var(--dim);cursor:help;text-decoration:none;color:inherit}
  .t:hover{border-bottom-color:var(--accent)}

  /* ---- section scaffold ---- */
  section.block{margin-top:38px}
  .h{display:flex;align-items:baseline;gap:10px;margin-bottom:14px}
  .h h2{font-size:13px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--dim);margin:0}
  .h .sub{color:var(--soft);font-size:12px}

  /* ---- agreement visual ---- */
  .agree{display:flex;gap:22px;align-items:stretch;flex-wrap:wrap}
  .cluster{display:flex;flex-direction:column;gap:9px}
  .cluster > .clabel{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--dim)}
  .cluster.dis > .clabel{color:var(--bad)}
  .tiles{display:flex;gap:9px;flex-wrap:wrap}
  .tile{min-width:96px;background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:11px 13px}
  .tile .v{font-size:22px;font-weight:650;color:var(--ink);line-height:1.1}
  .tile .addr{margin-top:7px;color:var(--dim);font-size:12px}
  .tile .state{margin-top:3px;font-size:11px;color:var(--soft)}
  .tile.owner .addr::after{content:' · owner';color:var(--soft)}
  .tile.stale{border-color:color-mix(in srgb,var(--bad) 55%,var(--line));border-left-width:3px;
    border-left-color:var(--bad);background:color-mix(in srgb,var(--bad) 7%,var(--panel))}
  .tile.stale .v{color:var(--bad)}
  .tile.stale .state{color:var(--bad)}
  .vs{align-self:center;color:var(--soft);font-size:13px;font-weight:600;letter-spacing:.05em}
  /* healthy: a calm single summary tile */
  .tile.summary{min-width:150px}
  .tile.summary .addr{color:var(--soft)}

  /* ---- the story ---- */
  ol.story{list-style:none;margin:0;padding:0;position:relative}
  ol.story::before{content:'';position:absolute;left:6px;top:8px;bottom:14px;width:1px;background:var(--line)}
  ol.story li{position:relative;padding:0 0 18px 30px}
  ol.story li::before{content:'';position:absolute;left:2px;top:8px;width:9px;height:9px;border-radius:50%;
    background:var(--panel);border:1px solid var(--dim)}
  ol.story li.key::before{background:var(--bad);border-color:var(--bad)}
  ol.story li.benign::before{background:var(--panel);border-color:var(--benign)}
  ol.story .when{display:block;font-size:11.5px;font-weight:600;letter-spacing:.03em;color:var(--soft);
    text-transform:uppercase;margin-bottom:2px}
  ol.story p{margin:0;color:var(--ink);font-size:14.5px;line-height:1.6}
  ol.story li.key p b{color:var(--bad)}
  ol.story .tag{font-size:11px;color:var(--soft);margin-left:6px}

  /* ---- meaning / next ---- */
  .meaning{border-left:2px solid var(--line);padding:2px 0 2px 16px;color:var(--ink);font-size:14.5px;line-height:1.6}
  .meaning.bad{border-left-color:var(--bad)}
  .meaning.ok{border-left-color:var(--good)}
  .meaning .lead{font-weight:650}

  /* ---- evidence (progressive disclosure) ---- */
  details.evidence{margin-top:40px;border-top:1px solid var(--line);padding-top:8px}
  details.evidence > summary{cursor:pointer;color:var(--dim);font-size:13px;font-weight:600;
    list-style:none;padding:10px 0;display:flex;align-items:center;gap:9px}
  details.evidence > summary::-webkit-details-marker{display:none}
  details.evidence > summary .chev{color:var(--soft);transition:none}
  details.evidence[open] > summary .chev{transform:rotate(90deg);display:inline-block}
  details.evidence > summary .note{color:var(--soft);font-weight:400;margin-left:auto}
  .evgrid{padding:6px 0 0}
  .ev{margin:18px 0}
  .ev > h3{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);margin:0 0 9px}
  /* compact version table */
  table.ev-tl{width:100%;border-collapse:collapse;font-size:12.5px}
  table.ev-tl th{text-align:left;color:var(--soft);font-weight:600;font-size:10.5px;text-transform:uppercase;
    letter-spacing:.05em;padding:0 10px 6px 0;border-bottom:1px solid var(--line)}
  table.ev-tl td{padding:6px 10px 6px 0;border-bottom:1px solid color-mix(in srgb,var(--line) 55%,transparent);
    vertical-align:top;color:var(--dim)}
  table.ev-tl td.out{font-size:10.5px;font-weight:700;letter-spacing:.04em}
  table.ev-tl tr.win td{color:var(--ink)}
  table.ev-tl tr.loss td.out{color:var(--bad)} table.ev-tl tr.fence td.out{color:var(--benign)}
  table.ev-tl tr.drop td.out{color:var(--soft)} table.ev-tl tr.won td.out{color:var(--accent)}
  table.ev-tl tr.local td.out{color:var(--good)} table.ev-tl tr.fwd td.out{color:var(--dim)}
  table.ev-tl tr.viewdiv td{color:var(--soft);font-style:italic;border-bottom-style:dashed}
  table.ev-tl tr.stuck td{color:var(--bad)}
  .kv{display:grid;grid-template-columns:120px 1fr;gap:5px 14px;font-size:13px}
  .kv .k{color:var(--soft);font-size:11px;text-transform:uppercase;letter-spacing:.05em;padding-top:2px}
  .route-line{font-size:13px;color:var(--dim);line-height:2}
  .route-line b{color:var(--ink)}
  .route-line .arr{color:var(--soft);margin:0 8px}
  .route-line .no{color:var(--bad)}
  .sources{font-size:12px;color:var(--soft);line-height:1.7}
  .sources b{color:var(--dim);font-weight:600}
  .sources .new{color:var(--benign)}
  .sources p{margin:6px 0}
</style>
</head>
<body>

<header>
  <span class="mock">MOCKUP · static data</span>
  <div class="crumb"><b>observe</b> › <b>key autopsy</b> › answer-first</div>
  <nav class="switch" id="switch"></nav>
</header>

<main>
  <!-- 1. THE ANSWER -->
  <section class="answer">
    <div class="health">
      <span class="word" id="word"></span>
      <span class="keyname">key <code id="keyname"></code></span>
    </div>
    <p class="lede" id="lede"></p>
    <p class="facts" id="facts"></p>
  </section>

  <!-- 2. WHO AGREES (the one spatial picture) -->
  <section class="block">
    <div class="h"><h2>Who holds what</h2><span class="sub">each server's current value for this key</span></div>
    <div class="agree" id="agree"></div>
  </section>

  <!-- 3. WHAT HAPPENED (the causal story, in sentences) -->
  <section class="block">
    <div class="h"><h2>What happened</h2><span class="sub">oldest first · the chain that produced today's state</span></div>
    <ol class="story" id="story"></ol>
  </section>

  <!-- 4. WHAT IT MEANS / NEXT -->
  <section class="block">
    <div class="h"><h2>What this means</h2></div>
    <p class="meaning" id="meaning"></p>
  </section>

  <!-- 5. EVIDENCE (collapsed by default — the raw data lives here, not up top) -->
  <details class="evidence" id="evidence">
    <summary><span class="chev">▸</span> Show the evidence
      <span class="note">version history · ownership · write route · data sources</span></summary>
    <div class="evgrid" id="evgrid"></div>
  </details>
</main>

<script>
'use strict';
/* The same fake cluster + key stories as the other Key Autopsy mockups — re-presented answer-first.
   Reading order is inverted: plain answer → spatial agreement → causal story → meaning → (collapsed) raw data. */
const NODES = {
  A:{addr:'127.0.0.1:49801', uuid:'3f8a1c2e-9b4d-4e7a-8c1f-2d5e6a7b8c9d'},
  B:{addr:'127.0.0.1:49803', uuid:'9d2b7f4a-1c3e-4b8d-9e2f-7a6c5d4e311a'},
  C:{addr:'127.0.0.1:49805', uuid:'6c1e9a3b-5d7f-4c2a-8b9e-3f4d2a1c7e5b'},
  D:{addr:'127.0.0.1:49807', uuid:'b4e2d8f6-3a1c-4d9b-8e7f-5c6a9b2d4f8e'},
  E:{addr:'127.0.0.1:49809', uuid:'e7a93c5d-8f2b-4a6e-9c1d-4b7e6f3a2d9c'},
};
const port = k => ':' + NODES[k].addr.split(':')[1];

/* glossary — terms get a dotted underline + plain-language definition on hover, so the page
   doesn't assume you already know fero's vocabulary */
const G = {
  view:'A numbered membership snapshot of the cluster (its "epoch"). It increments every time a node joins or leaves.',
  owner:'The server responsible for a key\'s partition. All writes to that key are sequenced through it.',
  fence:'An epoch-fence: a write stamped with an older view is rejected automatically, so a node that fell behind can\'t overwrite newer data. Expected during an ownership move.',
  handoff:'When the cluster changes view, partitions can change owner. In-flight writes around that moment need care — that\'s where most churn comes from.',
  seq:'The owner\'s per-write counter. Higher seq = newer write.',
  stuck:'A replica still showing an old value because it never applied a newer committed write.',
  viewcommit:'VIEW_COMMIT: the message that tells every node a new view is final. Missing it strands a node on the old view.',
};
const term = (t, label) => `<abbr class="t" title="${G[t].replace(/"/g,'&quot;')}">${label}</abbr>`;

const KEYS = {
  'user42.score':{
    health:'diverged', value:'8',
    word:'Diverged',
    lede:`<b>4 of 5 servers</b> agree this key is <b>8</b>. One server — <b class="mono">:49807</b> — still shows <b>5</b>. `+
         `It ${term('handoff','missed the last ownership handoff')} ~1 min ago and has applied no update to this key since, `+
         `so it's a ${term('stuck','stuck replica')} — not lost data.`,
    facts:['5 servers','4 agree · 1 stale',`owner ${port('A')}`,'partition user42 · epoch 4','full replication (R=∞)'],
    nodes:[
      {k:'A', v:'8', owner:true, state:'current · e4·s1287'},
      {k:'B', v:'8', state:'current · e4·s1287'},
      {k:'C', v:'8', state:'current · e4·s1287'},
      {k:'E', v:'8', state:'current · e4·s1287'},
      {k:'D', v:'5', stale:true, state:'stale 64s · stuck on e3·s1241'},
    ],
    story:[
      {when:'~1 min ago', text:`The cluster changed membership — ${term('view','view epoch 3 → 4')}. Ownership of the <code>user42</code> partition moved from ${port('B')} to ${port('A')}.`},
      {when:'during the move', cls:'benign', text:`A late write that arrived stamped with the old epoch was rejected automatically — an ${term('fence','epoch-fence')}. This is normal handoff churn, <span class="tag">not a conflict</span>.`},
      {when:'just after', text:`The new ${term('owner','owner')} ${port('A')} committed <b>8</b> (e4·${term('seq','s1287')}). Three of the four other servers applied it within ~30s.`},
      {when:'and since', cls:'key', text:`<b>:49807 never applied it.</b> It's still on <b>5</b> — the value from before the handoff (e3·s1241) — and has recorded no update for this key in the 64s since. That gap <b>is</b> the divergence.`},
    ],
    meaning:{cls:'bad', html:`<span class="lead">A single stuck replica, not data loss.</span> The other four servers are consistent, so reads served by them are correct. fero normally heals this on the next periodic ${term('view','view re-announce')}. If :49807 stays behind, it most likely dropped the ${term('viewcommit','VIEW_COMMIT')} for epoch 4 — a known failure mode (DECISIONS Y). Next step: check :49807's log for an epoch-4 view-commit, or restart it to force a fresh catch-up.`},
    ev:{
      partition:'user42', segment:73, owner:'A', moved:'moved ~1 min ago · e3→e4 · :49803 → :49801',
      route:[`<b>client</b> writes (attempt e4)`,`forwarded to <b>${port('B')}</b> <span class="no">· ack unknown</span>`,`owner <b>${port('A')}</b> commits e4·s1287`,`replicated → ${port('B')} ${port('C')} ${port('E')} <span class="no">· :49807 NO won</span>`],
      tl:[
        {out:'LOCAL · current', cls:'local win', o:'A', s:'e4·s1287', v:'8', note:'owner commit of the forwarded write (restamped origin = owner) — current winner'},
        {out:'DROP · dedup', cls:'drop', o:'CLI', s:'e4·s88', v:'8', note:'duplicate delivery — client retried; origin-seq already applied'},
        {out:'FWD', cls:'fwd', o:'CLI', s:'e4·s88', v:'8', note:'forward observed at :49803 (target inferred) → owner-forward → :49801'},
        {out:'LOST · conflict', cls:'loss', o:'B', s:'e4·s902', v:'7', note:'beaten by e4·s1265 (A) — true same-epoch contention, not churn'},
        {out:'WON', cls:'won', o:'A', s:'e4·s1265', v:'6'},
        {out:'LOST · fence', cls:'fence', o:'CLI', s:'e1·s87', v:'99', note:'epoch-1 client-local commit, fenced on every replica (the DECISIONS X bug class)'},
        {view:'view e3 → e4 · 5 members · segment 73 owner :49803 → :49801'},
        {out:'WON', cls:'won stuck', o:'C', s:'e3·s1241', v:'5', note:'◆ :49807 is stuck on this stamp'},
        {out:'LOST · fence', cls:'fence', o:'B', s:'e2·s851', v:'4', note:'write under a stale view during churn — expected'},
        {out:'WON', cls:'won', o:'C', s:'e3·s1203', v:'4'},
      ],
    },
  },

  'user43.name':{
    health:'healthy', value:'"amara"', word:'Healthy',
    lede:`All <b>5 servers</b> agree this key is <b>"amara"</b>. No disagreement and no losing writes in the observed window.`,
    facts:['5 servers','5 agree',`owner ${port('E')}`,'partition user43 · epoch 4','stable since e2'],
    nodes:[{summary:true, v:'"amara"', count:5, state:'all 5 servers · e4·s212 · origin '+port('E')}],
    story:[
      {when:'25s ago', text:`Owner ${port('E')} committed <b>"amara"</b> (e4·s212) as a local write — ${port('E')} is a member, so no forward was needed.`},
      {when:'within ~1s', text:`All four other servers applied it. Cluster converged.`},
    ],
    meaning:{cls:'ok', html:`<span class="lead">Converged and quiet.</span> Nothing to do — shown for contrast with a key that needs attention.`},
    ev:{
      partition:'user43', segment:17, owner:'E', moved:'stable since e2 · no recent move',
      route:[`<b>local write</b> on ${port('E')} (a member · no forward)`,`owner ${port('E')} commits e4·s212`,`replicated → ${port('A')} ${port('B')} ${port('C')} ${port('D')} · all won`],
      tl:[
        {out:'LOCAL · current', cls:'local win', o:'E', s:'e4·s212', v:'"amara"', note:'current winner — local commit on the owner'},
        {out:'WON', cls:'won', o:'E', s:'e4·s198', v:'"amy"'},
        {out:'WON', cls:'won', o:'A', s:'e3·s1102', v:'"am"', note:'insert'},
      ],
    },
  },

  'cart7.items':{
    health:'healthy', value:'[3 items]', word:'Healthy',
    lede:`All <b>5 servers</b> agree this key is <b>[3 items]</b>. Healthy — though one write was rejected during a recent ownership move (expected ${term('handoff','handoff')} churn, <b>not</b> a conflict).`,
    facts:['5 servers','5 agree · 1 fenced',`owner ${port('C')}`,'partition cart7 · epoch 4','moved ~1 min ago'],
    nodes:[{summary:true, v:'[3 items]', count:5, state:'all 5 servers · e4·s977 · origin '+port('C')}],
    story:[
      {when:'~1 min ago', text:`${term('view','View 3 → 4')} — ownership of <code>cart7</code> moved from ${port('E')} to ${port('C')}.`},
      {when:'during the move', cls:'benign', text:`A write stamped with the old epoch was ${term('fence','epoch-fenced')}. <span class="tag">expected churn</span> — the page surfaces it so you can confirm it wasn't a real conflict.`},
      {when:'just after', text:`New owner ${port('C')} committed <b>[3 items]</b> (e4·s977); all four other servers applied it.`},
    ],
    meaning:{cls:'ok', html:`<span class="lead">Converged.</span> The one fenced write is normal ownership-move churn, not a contended write — distinguishing the two is exactly what stops "rebalance noise" from looking like a bug.`},
    ev:{
      partition:'cart7', segment:41, owner:'C', moved:'moved ~1 min ago · e3→e4 · :49809 → :49805',
      route:[`<b>client</b> writes (attempt e4)`,`forwarded to <b>${port('C')}</b> — already the owner (single hop) <span class="no">· ack unknown</span>`,`owner ${port('C')} commits e4·s977`,`replicated → ${port('A')} ${port('B')} ${port('D')} ${port('E')} · all won`],
      tl:[
        {out:'LOCAL · current', cls:'local win', o:'C', s:'e4·s977', v:'[3 items]', note:'owner commit — current winner'},
        {out:'LOST · fence', cls:'fence', o:'D', s:'e3·s412', v:'[1 item]', note:'beaten by e4·s951 (C) — stale-view write during rebalance, expected'},
        {out:'WON', cls:'won', o:'C', s:'e4·s951', v:'[2 items]'},
        {view:'view e3 → e4 · 5 members · segment 41 owner :49809 → :49805'},
        {out:'WON', cls:'won', o:'D', s:'e3·s401', v:'[1 item]', note:'insert'},
      ],
    },
  },
};

const $ = id => document.getElementById(id);
const el = (t,c,h) => { const e=document.createElement(t); if(c)e.className=c; if(h!=null)e.innerHTML=h; return e; };

function renderAgree(K){
  const box = $('agree'); box.innerHTML='';
  if (K.nodes[0].summary){                         // healthy: one calm summary tile
    const n = K.nodes[0];
    const c = el('div','cluster');
    c.appendChild(el('div','clabel',`all ${n.count} agree`));
    const t = el('div','tiles');
    t.appendChild(el('div','tile summary',`<div class="v">${n.v}</div><div class="state mono">${n.state}</div>`));
    c.appendChild(t); box.appendChild(c);
    return;
  }
  const agree = K.nodes.filter(n=>!n.stale), dis = K.nodes.filter(n=>n.stale);
  const mk = (label, list, disCls) => {
    const c = el('div','cluster'+(disCls?' dis':''));
    c.appendChild(el('div','clabel',label));
    const t = el('div','tiles');
    for (const n of list){
      const tile = el('div','tile'+(n.stale?' stale':'')+(n.owner?' owner':''));
      tile.innerHTML = `<div class="v">${n.v}</div><div class="addr mono">${port(n.k)}</div><div class="state mono">${n.state}</div>`;
      t.appendChild(tile);
    }
    c.appendChild(t); return c;
  };
  box.appendChild(mk(`agree · ${agree.length}`, agree, false));
  if (dis.length){
    box.appendChild(el('div','vs','vs'));
    box.appendChild(mk(`diverged · ${dis.length}`, dis, true));
  }
}

function renderStory(K){
  const ol = $('story'); ol.innerHTML='';
  for (const s of K.story){
    const li = el('li', s.cls||'');
    li.innerHTML = `<span class="when">${s.when}</span><p>${s.text}</p>`;
    ol.appendChild(li);
  }
}

function renderEvidence(K){
  const ev = K.ev, box = $('evgrid'); box.innerHTML='';
  // version history (compact)
  const tl = el('div','ev'); tl.appendChild(el('h3',null,'Version history <span style="color:var(--soft);font-weight:400;text-transform:none;letter-spacing:0">· newest first · the raw record stream the summary is built from</span>'));
  let rows = '<table class="ev-tl"><thead><tr><th>outcome</th><th>origin</th><th>stamp</th><th>value</th><th>why</th></tr></thead><tbody>';
  for (const r of ev.tl){
    if (r.view){ rows += `<tr class="viewdiv"><td colspan="5">${r.view}</td></tr>`; continue; }
    rows += `<tr class="${r.cls}"><td class="out">${r.out}</td><td class="mono">${r.o==='CLI'?'client':port(r.o)}</td>`+
            `<td class="mono">${r.s}</td><td class="mono">${r.v}</td><td>${r.note||''}</td></tr>`;
  }
  rows += '</tbody></table>';
  tl.appendChild(el('div',null,rows)); box.appendChild(tl);

  // ownership
  const ow = el('div','ev'); ow.appendChild(el('h3',null,'Ownership'));
  ow.appendChild(el('div','kv',
    `<span class="k">partition</span><span class="mono">${ev.partition}</span>`+
    `<span class="k">segment</span><span class="mono">${ev.segment} / 120</span>`+
    `<span class="k">owner</span><span class="mono">${port(ev.owner)}</span>`+
    `<span class="k">replicas</span><span>∞ — full replication (all members hold every partition)</span>`+
    `<span class="k">ownership</span><span class="mono">${ev.moved}</span>`));
  box.appendChild(ow);

  // route
  const rt = el('div','ev'); rt.appendChild(el('h3',null,'Write route · most recent'));
  rt.appendChild(el('div','route-line', ev.route.join('<span class="arr">→</span>')));
  box.appendChild(rt);

  // data sources (honest footnote, condensed — every NEW flag preserved)
  const src = el('div','ev'); src.appendChild(el('h3',null,'Data sources'));
  src.appendChild(el('div','sources',
    `<p><b>Who-holds-what / divergence</b> — <span class="new">⚠ NEW instrumentation:</span> per-key version sample. Snapshot ships the <b>versions</b> COUNT only today; a gated <b>__inspect{versions:K}</b> returns {key → {epoch,seq,origin}} from the LWW map (the Map is already held by reference). Cross-node merge keyed on snapshot <b>uuid</b> [A]. Values shown need a gated <b>__dump</b> over <b>Log.since()</b> [C] — stamps never carry values.</p>`+
    `<p><b>What happened / version history</b> — observe stream [B]: kinds <b>won / lost / local / forwarded</b> (+ <b>dropped</b>, verbose). Loss reason = loser epoch vs winner <b>we/ws</b> (epoch &lt; we ⇒ fence; epoch = we ⇒ same-epoch conflict). View dividers from <b>kind:view</b>. <span class="new">⚠ NEW:</span> wall-clock ages (ProvRecords carry no time — "~1 min"/"64s" here are illustrative) and history beyond the 256-slot prov ring (retained provenance, /history?since=t).</p>`+
    `<p><b>Write route</b> — correlates <b>forwarded → local → won</b> [B]; the forward TARGET is inferred from the event's <b>by</b> vantage. <span class="new">⚠ NEW:</span> forward ACK status — not observable today; "ack unknown" until a per-write trace id exists [D].</p>`+
    `<p><b>Ownership</b> — segment from <b>ring.coverage</b>; owner move from the bridge cover diff [E]. The full per-segment heatmap is the shipped dashboard's job, not duplicated here.</p>`));
  box.appendChild(src);
}

function show(key){
  const K = KEYS[key];
  document.querySelectorAll('#switch button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.k===key));
  try{ history.replaceState(null,'','#'+encodeURIComponent(key)); }catch{}
  $('word').textContent = K.word;
  $('word').className = 'word ' + (K.health==='diverged'?'bad':'ok');
  $('keyname').textContent = key;
  $('lede').innerHTML = K.lede;
  $('facts').innerHTML = K.facts.map(f=>`<span>${f}</span>`).join('<i>·</i>');
  $('meaning').className = 'meaning ' + (K.meaning.cls);
  $('meaning').innerHTML = K.meaning.html;
  renderAgree(K); renderStory(K); renderEvidence(K);
}

// key switcher — worst first, with a plain health marker (no badge clutter)
const order = Object.keys(KEYS).sort((a,b)=>(KEYS[a].health==='diverged'?0:1)-(KEYS[b].health==='diverged'?0:1));
const sw = $('switch');
for (const k of order){
  const bad = KEYS[k].health==='diverged';
  const b = el('button', null, `${k}<span class="st ${bad?'bad':'ok'}">${bad?'diverged':'ok'}</span>`);
  b.dataset.k = k; b.onclick = ()=>show(k);
  sw.appendChild(b);
}
const fromHash = decodeURIComponent(location.hash.slice(1));
show(KEYS[fromHash] ? fromHash : order[0]);
</script>
</body>
</html>
