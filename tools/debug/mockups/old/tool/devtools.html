<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fero inspector — sessions</title>
<style>
  /* ── A data inspector in the Chrome DevTools / pgAdmin / TablePlus lineage.
        Not a theme: character comes from panes, a tree, a dense gridlined table,
        a filter/command line, a triage strip and a decode pane — tool conventions. ── */
  :root{
    --bg:#1d1f21;            /* panel chrome */
    --grid:#181a1c;          /* table body, a touch darker than chrome */
    --line:#303338;          /* hairline gridlines */
    --line2:#3a3e44;         /* heavier divider between panes */
    --ink:#d7dadd;           /* primary text */
    --dim:#9aa0a6;           /* secondary */
    --soft:#6b7178;          /* tertiary / chrome labels */
    --head:#26282b;          /* tree/table header strip */
    --sel:#2b4b6b;           /* DevTools selection blue */
    --selln:#3d6da0;
    --hov:#26292d;
    --link:#6cb6ff;
    --bad:#e5645c; --badbg:#2a1c1c;
    --warn:#d6a44c; --warnbg:#29241a;
    --good:#5bbf91;
    --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,"Liberation Mono",monospace;
    --ui:-apple-system,system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:12px/1.45 var(--ui);-webkit-font-smoothing:antialiased;overflow:hidden}
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
  a{color:var(--link);text-decoration:none}
  ::-webkit-scrollbar{width:11px;height:11px}
  ::-webkit-scrollbar-thumb{background:#3a3e44;border:3px solid var(--bg);border-radius:6px}
  ::-webkit-scrollbar-track{background:transparent}

  /* ── window shell: toolbar / body(tree|main) / status ── */
  .app{display:grid;grid-template-rows:auto 1fr auto;height:100vh}

  /* ── TOOLBAR: tabs + a command/filter line + a tool-control scenario toggle ── */
  .toolbar{display:flex;align-items:stretch;background:var(--bg);border-bottom:1px solid var(--line2);
    height:34px;user-select:none}
  .tabs{display:flex;align-items:stretch}
  .tab{display:flex;align-items:center;padding:0 13px;color:var(--soft);border-right:1px solid var(--line);
    font-size:12px;cursor:default;gap:6px}
  .tab.on{color:var(--ink);background:var(--head);box-shadow:inset 0 -2px 0 var(--link)}
  .tab .ic{color:var(--soft);font-size:11px}
  .tab.on .ic{color:var(--link)}
  .path{display:flex;align-items:center;gap:6px;padding:0 12px;color:var(--soft);font-size:12px;border-right:1px solid var(--line)}
  .path b{color:var(--dim);font-weight:600}
  .path .res{color:var(--ink);font-weight:600}
  .filterwrap{flex:1;display:flex;align-items:center;gap:7px;padding:0 10px;min-width:0}
  .filterwrap .mag{color:var(--soft);font-size:12px}
  #filter{flex:1;min-width:0;background:var(--grid);border:1px solid var(--line);border-radius:3px;color:var(--ink);
    font:12px/1 var(--mono);padding:5px 8px;outline:none}
  #filter:focus{border-color:var(--selln)}
  #filter::placeholder{color:var(--soft)}
  .fcount{color:var(--soft);font-size:11px;white-space:nowrap}
  /* scenario toggle styled as a native segmented tool control, not buttons-with-pills */
  .seg{display:flex;align-self:center;margin:0 10px;border:1px solid var(--line2);border-radius:3px;overflow:hidden}
  .seg button{background:var(--bg);border:0;border-left:1px solid var(--line2);color:var(--soft);
    font:11px/1 var(--ui);padding:6px 11px;cursor:pointer;display:flex;align-items:center;gap:6px}
  .seg button:first-child{border-left:0}
  .seg button:hover{color:var(--ink);background:var(--head)}
  .seg button[aria-pressed=true]{color:var(--ink);background:var(--head)}
  .seg .lamp{width:7px;height:7px;border-radius:50%;background:var(--soft)}
  .seg button[aria-pressed=true][data-id=healthy] .lamp{background:var(--good)}
  .seg button[aria-pressed=true][data-id=attention] .lamp{background:var(--bad)}

  /* ── BODY: left tree | main(triage + table) | detail ── */
  .body{display:grid;grid-template-columns:248px 1fr 340px;min-height:0;overflow:hidden}

  /* ── LEFT: partition tree, DevTools Application-panel style ── */
  .tree{background:var(--bg);border-right:1px solid var(--line2);overflow:auto;font-size:12px}
  .tree .ph{display:flex;align-items:center;justify-content:space-between;padding:6px 10px;color:var(--soft);
    background:var(--head);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:1;
    font-size:11px;letter-spacing:.02em}
  .tree .ph .c{color:var(--dim);font-family:var(--mono)}
  .tnode{display:flex;align-items:center;gap:5px;padding:3px 8px 3px 0;cursor:pointer;white-space:nowrap;color:var(--dim)}
  .tnode:hover{background:var(--hov)}
  .tnode.sel{background:var(--sel);color:#fff}
  .tnode .tw{width:14px;text-align:center;color:var(--soft);font-size:9px;flex:none}
  .tnode .ti{color:var(--soft);font-size:11px;width:12px;flex:none}
  .tnode.part{font-family:var(--mono);padding-left:8px}
  .tnode.part .nm{color:var(--ink)}
  .tnode.part.sel .nm{color:#fff}
  .tnode .badge{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--soft);padding-left:8px}
  .tnode.flag .dot{width:6px;height:6px;border-radius:50%;flex:none}
  .tnode.flag.bad .dot{background:var(--bad)} .tnode.flag.warn .dot{background:var(--warn)}
  .tnode.flag.bad .badge{color:var(--bad)} .tnode.flag.warn .badge{color:var(--warn)}
  .tkid{font-family:var(--mono);font-size:11px;color:var(--dim);padding:2px 8px 2px 40px;cursor:pointer;
    display:flex;align-items:center;gap:6px;white-space:nowrap}
  .tkid:hover{background:var(--hov)}
  .tkid.sel{background:var(--sel);color:#fff}
  /* DevTools trees flag status only where it's interesting: converged keys get a
     blank 6px gutter (alignment), only non-converged keys get a coloured dot. */
  .tkid .st{width:6px;height:6px;border-radius:50%;background:transparent;flex:none}
  .tkid.bad .st{background:var(--bad)} .tkid.warn .st{background:var(--warn)}
  .tkids{display:none} .tnode.open + .tkids{display:block}

  /* ── MAIN: triage strip atop a dense, gridlined, sortable data table ── */
  .main{display:flex;flex-direction:column;min-width:0;background:var(--grid);border-right:1px solid var(--line2)}

  /* triage list — worst-first work queue, functional row tint (no pills) */
  /* size to content for a short worst-first queue so no item is clipped below the
     fold (the old fixed 188px cap could hide the 4th item); only a pathological
     list reaches 40vh and scrolls, with the header 'N open' count as the tally. */
  .triage{border-bottom:1px solid var(--line2);background:var(--bg);flex:none;max-height:40vh;overflow:auto}
  .triage .th{display:flex;align-items:center;gap:8px;padding:5px 12px;background:var(--head);color:var(--soft);
    border-bottom:1px solid var(--line);font-size:11px;position:sticky;top:0}
  .triage .th .n{margin-left:auto;font-family:var(--mono);color:var(--dim)}
  .titem{display:grid;grid-template-columns:16px 168px 92px 1fr auto;gap:10px;align-items:center;
    padding:6px 12px;border-bottom:1px solid var(--line);border-left:3px solid transparent;cursor:pointer}
  .titem:hover{background:var(--hov)}
  .titem[data-sev=crit]{border-left-color:var(--bad);background:var(--badbg)}
  .titem[data-sev=crit]:hover{background:#33201f}
  .titem[data-sev=warn]{border-left-color:var(--warn);background:var(--warnbg)}
  .titem[data-sev=warn]:hover{background:#322b1c}
  .titem .sv{font-family:var(--mono);font-size:13px;text-align:center}
  .titem[data-sev=crit] .sv{color:var(--bad)} .titem[data-sev=warn] .sv{color:var(--warn)}
  .titem .k{font-family:var(--mono);color:var(--ink);font-weight:600}
  .titem .p{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.03em}
  .titem[data-sev=crit] .p{color:var(--bad)} .titem[data-sev=warn] .p{color:var(--warn)}
  .titem .w{color:var(--dim);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .titem .w .mono{color:var(--ink)}
  .titem .go{color:var(--soft);font-family:var(--mono);font-size:11px;white-space:nowrap}
  .titem:hover .go{color:var(--link)}
  .triage .clear{padding:10px 12px;color:var(--good);font-size:12px;display:flex;gap:8px;align-items:center}
  .triage .clear .s{color:var(--soft)}

  /* the data table */
  .tabwrap{flex:1;overflow:auto;min-height:0}
  table{border-collapse:separate;border-spacing:0;width:100%;font-size:12px}
  thead th{position:sticky;top:0;z-index:2;background:var(--head);color:var(--soft);text-align:left;
    font-weight:600;padding:5px 10px;border-bottom:1px solid var(--line2);border-right:1px solid var(--line);
    white-space:nowrap;cursor:pointer;user-select:none;font-size:11px}
  thead th:hover{color:var(--ink)}
  thead th .ar{color:var(--link);font-size:9px;margin-left:3px}
  thead th.num{text-align:right}
  tbody td{padding:4px 10px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);
    white-space:nowrap;color:var(--dim);font-family:var(--mono)}
  tbody tr{cursor:pointer}
  tbody tr:hover td{background:var(--hov)}
  tbody tr.sel td{background:var(--sel);color:#fff}
  tbody tr.sel td .v{color:#fff}
  td.key{color:var(--ink);font-weight:600}
  td.val .v{color:var(--ink)} td.val .t{color:var(--soft)}
  td.num{text-align:right}
  td.stamp{color:var(--dim)}
  td.st{font-size:11px}
  td.st .ok{color:var(--good)} td.st .bad{color:var(--bad)} td.st .warn{color:var(--warn)}
  tr[data-sev=crit] td:first-child{box-shadow:inset 3px 0 0 var(--bad)}
  tr[data-sev=crit] td{background:var(--badbg)}
  tr[data-sev=crit].sel td{background:var(--sel)}
  tr[data-sev=crit]:hover td{background:#33201f}
  tr[data-sev=crit].sel:hover td{background:var(--sel)}
  tr[data-sev=warn] td:first-child{box-shadow:inset 3px 0 0 var(--warn)}
  tr[data-sev=warn] td{background:var(--warnbg)}
  tr[data-sev=warn].sel td{background:var(--sel)}
  tr[data-sev=warn]:hover td{background:#322b1c}
  tr[data-sev=warn].sel:hover td{background:var(--sel)}
  td .repbad{color:var(--bad)} td .repok{color:var(--dim)}

  /* ── RIGHT: detail / decode pane for the selected key ── */
  .detail{background:var(--bg);overflow:auto;display:flex;flex-direction:column;font-size:12px}
  .detail .dh{padding:6px 12px;background:var(--head);border-bottom:1px solid var(--line);color:var(--soft);
    font-size:11px;display:flex;align-items:center;gap:8px;position:sticky;top:0}
  .detail .dh .x{margin-left:auto;color:var(--soft);font-family:var(--mono)}
  .dbody{padding:0}
  .drow{display:grid;grid-template-columns:96px 1fr;gap:0;border-bottom:1px solid var(--line)}
  .drow .dk{padding:5px 12px;color:var(--soft);font-size:11px;border-right:1px solid var(--line);background:#202225}
  .drow .dv{padding:5px 12px;color:var(--ink);font-family:var(--mono);overflow-wrap:anywhere}
  .drow .dv.bad{color:var(--bad)} .drow .dv.warn{color:var(--warn)} .drow .dv.ok{color:var(--good)}
  .dsec{padding:6px 12px;color:var(--soft);font-size:11px;background:#202225;border-bottom:1px solid var(--line);
    border-top:1px solid var(--line2);letter-spacing:.03em}
  .json{padding:9px 12px;font-family:var(--mono);font-size:12px;line-height:1.6;border-bottom:1px solid var(--line);
    background:var(--grid);white-space:pre;overflow:auto;color:var(--dim)}
  .json .jk{color:#9cdcfe} .json .js{color:#ce9178} .json .jn{color:#b5cea8} .json .jp{color:var(--soft)}
  .dact{padding:10px 12px;display:flex;gap:8px;flex-wrap:wrap}
  .dact a{display:inline-flex;align-items:center;gap:6px;background:var(--head);border:1px solid var(--line2);
    border-radius:3px;color:var(--ink);font-size:12px;padding:6px 11px}
  .dact a:hover{border-color:var(--selln);background:#22272d}
  .dact a.primary{border-color:var(--badln,#7a3b38);background:#2a1c1c;color:#f0a8a3}
  .dact a.primary:hover{background:#33201f}
  .dnote{padding:9px 12px;color:var(--soft);font-size:11px;line-height:1.6;border-top:1px solid var(--line2)}
  .dnote b{color:var(--dim)} .dnote .nw{color:var(--warn)}
  .dempty{padding:24px 14px;color:var(--soft);font-size:12px;line-height:1.6;text-align:center}
  .dempty .kbd{display:inline-block;background:var(--head);border:1px solid var(--line2);border-radius:3px;
    padding:1px 5px;font-family:var(--mono);font-size:11px;color:var(--dim);margin:0 1px}

  /* ── STATUS BAR: summary rollup + activity + hotkey hints, k9s/lazygit style ── */
  .status{display:flex;align-items:center;gap:0;background:var(--bg);border-top:1px solid var(--line2);
    height:26px;font-size:11px;user-select:none;overflow:hidden}
  .status .seg-s{display:flex;align-items:center;gap:6px;padding:0 12px;border-right:1px solid var(--line);
    color:var(--dim);white-space:nowrap;height:100%}
  .status .seg-s b{color:var(--ink);font-family:var(--mono);font-weight:600}
  .status .seg-s.h .lamp{width:7px;height:7px;border-radius:50%;background:var(--good)}
  .status .seg-s.h.warn .lamp{background:var(--bad)}
  .status .seg-s.h .word{color:var(--good);font-weight:600;letter-spacing:.02em}
  .status .seg-s.h.warn .word{color:var(--bad)}
  .status .n-bad{color:var(--bad);font-family:var(--mono);font-weight:600}
  .status .n-warn{color:var(--warn);font-family:var(--mono);font-weight:600}
  .status .n-ok{color:var(--good);font-family:var(--mono);font-weight:600}
  .status .arrow{color:var(--soft);font-family:var(--mono);font-size:10px}
  .status .hints{margin-left:auto;display:flex;gap:0;height:100%}
  .status .hint{display:flex;align-items:center;gap:5px;padding:0 11px;border-left:1px solid var(--line);color:var(--soft)}
  .status .hint .kbd{background:var(--head);border:1px solid var(--line2);border-radius:3px;
    padding:0 5px;font-family:var(--mono);font-size:10px;color:var(--dim);line-height:1.4}

  .hl{background:#5a4a1e;color:#fff;border-radius:1px}
</style>
</head>
<body>
<div class="app">

  <!-- ── TOOLBAR ── -->
  <div class="toolbar">
    <div class="tabs">
      <div class="tab"><span class="ic">▤</span>Network</div>
      <div class="tab on"><span class="ic">▦</span>Resource</div>
    </div>
    <div class="path">
      <a href="../ia-map.html"><b>cluster</b></a><span>/</span><span class="res">sessions</span>
    </div>
    <div class="filterwrap">
      <span class="mag">⌕</span>
      <input id="filter" placeholder="filter keys, values, owners…   (e.g.  diverged   billing   :49807)" autocomplete="off" spellcheck="false">
      <span class="fcount" id="fcount"></span>
    </div>
    <div class="seg" id="seg">
      <button data-id="healthy"><span class="lamp"></span>healthy</button>
      <button data-id="attention"><span class="lamp"></span>needs&nbsp;attention</button>
    </div>
  </div>

  <!-- ── BODY ── -->
  <div class="body">

    <!-- LEFT: partition tree -->
    <div class="tree">
      <div class="ph"><span>PARTITIONS</span><span class="c" id="treeCount">8</span></div>
      <div id="treeBody"></div>
    </div>

    <!-- MAIN: triage + table -->
    <div class="main">
      <div class="triage" id="triage"></div>
      <div class="tabwrap">
        <table>
          <thead><tr id="thead"></tr></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </div>

    <!-- RIGHT: detail / decode pane -->
    <div class="detail" id="detail"></div>
  </div>

  <!-- ── STATUS BAR ── -->
  <div class="status" id="status"></div>
</div>

<script>
'use strict';
const KEY = '../key-autopsy/happy.html';            // drill target (the Key page)
const DIV = '../key-autopsy/happy.html#diverged';   // worst item → divergence view (hash-routed)

/* ── Data. Same content as resource.html, modelled as table rows so a serious
      tool can sort/filter/select them. A resource = its keys rolled up; healthy
      means every row converged and the work queue is empty. ── */
const ROWS_HEALTHY = [
  {key:'user42.score', part:'user42',  v:8,        t:'num',  ep:4,s:1287, owner:':49801', rep:'5/5', sev:null, status:'converged'},
  {key:'user42.name',  part:'user42',  v:'"ada"',  t:'str',  ep:4,s:1290, owner:':49801', rep:'5/5', sev:null, status:'converged'},
  {key:'cart7.items',  part:'cart7',   v:3,        t:'num',  ep:4,s:1281, owner:':49805', rep:'5/5', sev:null, status:'converged'},
  {key:'cart7.total',  part:'cart7',   v:42.50,    t:'num',  ep:4,s:1279, owner:':49805', rep:'5/5', sev:null, status:'converged'},
  {key:'order7.lines', part:'order7',  v:'[…6]',   t:'arr',  ep:4,s:1288, owner:':49803', rep:'5/5', sev:null, status:'converged'},
  {key:'order7.state', part:'order7',  v:'"open"', t:'str',  ep:4,s:1275, owner:':49803', rep:'5/5', sev:null, status:'converged'},
  {key:'user43.name',  part:'user43',  v:'"lin"',  t:'str',  ep:4,s:1262, owner:':49809', rep:'5/5', sev:null, status:'converged'},
  {key:'billing.due',  part:'billing', v:120.00,   t:'num',  ep:4,s:1270, owner:':49807', rep:'5/5', sev:null, status:'converged'},
  {key:'session.tok',  part:'session', v:'"…7f2"', t:'str',  ep:4,s:1284, owner:':49801', rep:'5/5', sev:null, status:'converged'},
  {key:'audit.last',   part:'audit',   v:'"login"',t:'str',  ep:4,s:1251, owner:':49805', rep:'5/5', sev:null, status:'converged'},
  {key:'prefs.theme',  part:'prefs',   v:'"dark"', t:'str',  ep:4,s:1244, owner:':49809', rep:'5/5', sev:null, status:'converged'},
];
const ROWS_ATT = [
  {key:'user42.score', part:'user42',  v:'8 ⚠5',   t:'num',  ep:4,s:1287, owner:':49807', rep:'4/5', sev:'crit', status:'diverged',  href:DIV,
    why:'<span class="mono">:49807</span> stuck on <span class="mono">e3·s1241</span> ("5") while 4 hold <span class="mono">e4·s1287</span> ("8") · 64s'},
  {key:'cart9.total',  part:'cart9',   v:'19.90?', t:'num',  ep:4,s:1286, owner:':49803', rep:'4/5', sev:'crit', status:'diverged',  href:KEY,
    why:'<span class="mono">:49803</span> missed the <span class="mono">e4</span> commit · 12s behind, not yet draining'},
  {key:'order7.lines', part:'order7',  v:'[…6]',   t:'arr',  ep:4,s:1291, owner:':49803', rep:'5/5', sev:'warn', status:'contended', href:KEY,
    why:'<span class="mono">3</span> same-epoch conflicts in 60s — a real write-write hotspot, not rebalance churn'},
  {key:'user42.name',  part:'user42',  v:'"ada"',  t:'str',  ep:4,s:1290, owner:':49807', rep:'5/5', sev:null, status:'converged'},
  {key:'cart7.items',  part:'cart7',   v:3,        t:'num',  ep:4,s:1281, owner:':49805', rep:'5/5', sev:null, status:'converged'},
  {key:'cart7.total',  part:'cart7',   v:42.50,    t:'num',  ep:4,s:1279, owner:':49805', rep:'5/5', sev:null, status:'converged'},
  {key:'order7.state', part:'order7',  v:'"open"', t:'str',  ep:4,s:1275, owner:':49803', rep:'5/5', sev:null, status:'converged'},
  {key:'billing.due',  part:'billing', v:120.00,   t:'num',  ep:4,s:1270, owner:':49807', rep:'2/3', sev:'crit', status:'under-repl', href:'#',
    why:'partition held on <span class="mono">2 of 3</span> replicas since the e4 rebalance — orphan awaiting confirmed shed'},
  {key:'session.tok',  part:'session', v:'"…7f2"', t:'str',  ep:4,s:1284, owner:':49801', rep:'5/5', sev:null, status:'converged'},
  {key:'audit.last',   part:'audit',   v:'"login"',t:'str',  ep:4,s:1251, owner:':49805', rep:'5/5', sev:null, status:'converged'},
  {key:'prefs.theme',  part:'prefs',   v:'"dark"', t:'str',  ep:4,s:1244, owner:':49809', rep:'5/5', sev:null, status:'converged'},
];

/* per-partition owner / replica health (left tree) */
const PARTS_HEALTHY = [
  {n:'user42', o:':49801', rep:'5/5'}, {n:'cart7',   o:':49805', rep:'5/5'},
  {n:'order7', o:':49803', rep:'5/5'}, {n:'user43',  o:':49809', rep:'5/5'},
  {n:'billing',o:':49807', rep:'5/5'}, {n:'session', o:':49801', rep:'5/5'},
  {n:'audit',  o:':49805', rep:'5/5'}, {n:'prefs',   o:':49809', rep:'5/5'},
];
const PARTS_ATT = [
  {n:'user42', o:':49801', rep:'5/5'}, {n:'cart7',   o:':49805', rep:'5/5'},
  {n:'order7', o:':49803', rep:'5/5'}, {n:'cart9',   o:':49803', rep:'5/5'},
  {n:'billing',o:':49807', rep:'2/3', flag:'bad', note:'under-replicated'},
  {n:'session',o:':49801', rep:'5/5'}, {n:'audit',   o:':49805', rep:'5/5'},
  {n:'prefs',  o:':49809', rep:'5/5'},
];

const SCEN = {
  healthy:{
    word:'HEALTHY', warn:false,
    summary:{keys:1284, converged:1284, diverged:0, contended:0},
    activity:{wFrom:142, wTo:142, cFrom:0, cTo:0},
    hot:[['user42.score','38 w/s'],['cart7.items','21 w/s'],['order7.lines','14 w/s'],['user43.name','9 w/s']],
    rows:ROWS_HEALTHY, parts:PARTS_HEALTHY,
    triage:[],
  },
  attention:{
    word:'NEEDS ATTENTION', warn:true,
    summary:{keys:1284, converged:1281, diverged:2, contended:1},
    activity:{wFrom:142, wTo:168, cFrom:0, cTo:0.4},
    hot:[['order7.lines','61 w/s'],['user42.score','40 w/s'],['cart7.items','19 w/s'],['cart9.total','11 w/s']],
    rows:ROWS_ATT, parts:PARTS_ATT,
    triage:[
      {key:'user42.score', sev:'crit', prob:'diverged',   href:DIV, why:ROWS_ATT[0].why},
      {key:'cart9.total',  sev:'crit', prob:'diverged',   href:KEY, why:ROWS_ATT[1].why},
      {key:'order7.lines', sev:'warn', prob:'contended',  href:KEY, why:ROWS_ATT[2].why},
      {part:'billing',     sev:'crit', prob:'under-repl', href:'#', why:ROWS_ATT[7].why},
    ],
  },
};

const COLS = [
  {id:'key',   t:'key',     cls:'key'},
  {id:'value', t:'value',   cls:'val'},
  {id:'stamp', t:'stamp e·s',cls:'stamp'},
  {id:'owner', t:'owner',   cls:''},
  {id:'rep',   t:'replicas',cls:'num'},
  {id:'status',t:'status',  cls:'st'},
];
const SEV_RANK = {crit:0, warn:1, null:2};

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

/* ── replica string "held/target" → numeric, so under-replication is a real
      comparison (held < target), not a brittle suffix test like endsWith('/3'). ── */
function repParse(rep){ const [h,t]=String(rep).split('/').map(n=>parseInt(n,10)); return {held:h,target:t}; }
function repUnder(rep){ const {held,target}=repParse(rep); return Number.isFinite(held)&&Number.isFinite(target)&&held<target; }

let state = {
  scen:'healthy', sort:{col:'status', dir:1}, filter:'',
  sel:null, openParts:new Set(['user42']),
};

/* ── derived helpers ── */
function rows(){ return SCEN[state.scen].rows; }
function partRows(part){ return rows().filter(r=>r.part===part); }
function matches(r,q){
  if(!q) return true;
  const hay=(r.key+' '+String(r.v)+' '+r.owner+' '+r.status+' '+r.part+' e'+r.ep+'·s'+r.s).toLowerCase();
  return hay.includes(q);
}
function sortRows(list){
  const {col,dir}=state.sort;
  const v=r=>{
    if(col==='key') return r.key;
    if(col==='value') return typeof r.v==='number'?r.v:String(r.v);
    if(col==='stamp') return r.ep*100000+r.s;
    if(col==='owner') return r.owner;
    if(col==='rep'){ const {held,target}=repParse(r.rep); return (held-target)*1000+held; }
    if(col==='status') return SEV_RANK[r.sev] + ' ' + r.status;
    return '';
  };
  return [...list].sort((a,b)=>{ const x=v(a),y=v(b); return (x<y?-1:x>y?1:0)*dir; });
}

/* ── highlight filter match in a cell ── */
function mark(text,q){
  if(!q) return esc(text);
  const i=String(text).toLowerCase().indexOf(q);
  if(i<0) return esc(text);
  return esc(String(text).slice(0,i))+'<span class="hl">'+esc(String(text).slice(i,i+q.length))+'</span>'+esc(String(text).slice(i+q.length));
}

/* ── RENDER: left tree ── */
function renderTree(){
  const s=SCEN[state.scen];
  $('treeCount').textContent=s.parts.length;
  let h='';
  for(const p of s.parts){
    const kids=partRows(p.n);
    const open=state.openParts.has(p.n);
    const flag=p.flag?` flag ${p.flag}`:'';
    const dot=p.flag?`<span class="dot"></span>`:'';
    const badge=p.flag?`${dot} ${p.rep}`:p.rep;
    h+=`<div class="tnode part${flag}${open?' open':''}" data-part="${p.n}">`+
         `<span class="tw">${kids.length?(open?'▾':'▸'):' '}</span>`+
         `<span class="ti">▦</span>`+
         `<span class="nm">${p.n}</span>`+
         `<span class="badge">${badge}</span>`+
       `</div>`;
    h+=`<div class="tkids">`;
    for(const k of kids){
      const c=k.sev==='crit'?' bad':k.sev==='warn'?' warn':'';
      const selc=state.sel===k.key?' sel':'';
      h+=`<div class="tkid${c}${selc}" data-key="${k.key}"><span class="st"></span>${k.key}</div>`;
    }
    h+=`</div>`;
  }
  $('treeBody').innerHTML=h;
}

/* ── RENDER: triage strip (worst-first work queue) ── */
function renderTriage(){
  const s=SCEN[state.scen];
  if(!s.triage.length){
    $('triage').innerHTML=`<div class="th"><span>TRIAGE</span><span class="n">0</span></div>`+
      `<div class="clear">✓ all ${s.summary.keys.toLocaleString()} keys converged — work queue empty`+
      `<span class="s">· fills only on divergence, under-replication or contention</span></div>`;
    return;
  }
  // worst-first: crit before warn before the rest, so the strip leads with the worst
  const order=[...s.triage].sort((a,b)=>SEV_RANK[a.sev]-SEV_RANK[b.sev]);
  let h=`<div class="th"><span>TRIAGE · worst-first</span><span class="n">${order.length} open</span></div>`;
  for(const t of order){
    const label=t.key?t.key:`partition ${t.part}`;
    const go=t.href==='#'?'partition →':t.href.includes('#diverged')?'autopsy#diverged →':'autopsy →';
    const dk=t.key||'';
    h+=`<div class="titem" data-sev="${t.sev}" data-href="${t.href}" data-key="${dk}">`+
        `<span class="sv">${t.sev==='crit'?'✗':'!'}</span>`+
        `<span class="k">${label}</span>`+
        `<span class="p">${t.prob}</span>`+
        `<span class="w">${t.why}</span>`+
        `<span class="go">${go}</span>`+
      `</div>`;
  }
  $('triage').innerHTML=h;
}

/* ── RENDER: data table ── */
function renderTable(){
  const q=state.filter.trim().toLowerCase();
  // header
  $('thead').innerHTML=COLS.map(c=>{
    const on=state.sort.col===c.id;
    const ar=on?(state.sort.dir>0?'▲':'▼'):'';
    return `<th data-col="${c.id}" class="${c.cls==='num'?'num':''}">${c.t}${on?`<span class="ar">${ar}</span>`:''}</th>`;
  }).join('');
  // body
  const list=sortRows(rows().filter(r=>matches(r,q)));
  const total=SCEN[state.scen].summary.keys;
  $('fcount').textContent = q
    ? `${list.length} / ${rows().length} shown · notable of ${total.toLocaleString()}`
    : `notable keys (sampled) · ${rows().length} of ${total.toLocaleString()}`;
  let h='';
  for(const r of list){
    const sev=r.sev?` data-sev="${r.sev}"`:'';
    const selc=state.sel===r.key?' sel':'';
    const vcell=`<span class="v">${mark(String(r.v),q)}</span>`;
    const stcls=r.sev==='crit'?'bad':r.sev==='warn'?'warn':'ok';
    const repcls=repUnder(r.rep)?'repbad':'repok';
    h+=`<tr class="${selc.trim()}"${sev} data-key="${r.key}">`+
        `<td class="key">${mark(r.key,q)}</td>`+
        `<td class="val">${vcell} <span class="t">${r.t}</span></td>`+
        `<td class="stamp">e${r.ep}·s${r.s}</td>`+
        `<td class="">${mark(r.owner,q)}</td>`+
        `<td class="num"><span class="${repcls}">${r.rep}</span></td>`+
        `<td class="st"><span class="${stcls}">${r.status}</span></td>`+
      `</tr>`;
  }
  $('tbody').innerHTML=h;
}

/* ── RENDER: detail / decode pane ── */
function jsonFor(r){
  // a small resolved-state preview, syntax-coloured like a JSON viewer
  const num = typeof r.v==='number';
  const valTok = num ? `<span class="jn">${r.v}</span>`
              : `<span class="js">${esc(String(r.v).replace(/^"|"$/g,'').replace(/^\[|\]$/g,''))}</span>`;
  return `<span class="jp">{</span>\n`+
    `  <span class="jk">"key"</span>: <span class="js">"${esc(r.key)}"</span>,\n`+
    `  <span class="jk">"value"</span>: ${num?`<span class="jn">${r.v}</span>`:`<span class="js">${esc(String(r.v))}</span>`},\n`+
    `  <span class="jk">"stamp"</span>: <span class="js">"e${r.ep}·s${r.s}"</span>,\n`+
    `  <span class="jk">"owner"</span>: <span class="js">"${r.owner}"</span>,\n`+
    `  <span class="jk">"replicas"</span>: <span class="js">"${r.rep}"</span>,\n`+
    `  <span class="jk">"status"</span>: <span class="js">"${r.status}"</span>\n`+
    `<span class="jp">}</span>`;
}
function renderDetail(){
  const d=$('detail');
  if(!state.sel){
    d.innerHTML=`<div class="dh"><span>DETAIL</span><span class="x">no selection</span></div>`+
      `<div class="dempty">Select a key in the table or tree to decode its resolved state.<br><br>`+
      `<span class="kbd">↑</span><span class="kbd">↓</span> move · <span class="kbd">↵</span> open autopsy · <span class="kbd">/</span> filter</div>`;
    return;
  }
  const r=rows().find(x=>x.key===state.sel);
  if(!r){ state.sel=null; return renderDetail(); }
  const bad=r.sev==='crit', warn=r.sev==='warn';
  const stcls=bad?'bad':warn?'warn':'ok';
  const flag=bad||warn;
  const drillHref = r.href || KEY;
  const drillLabel = (r.href&&r.href.includes('#diverged')) ? 'open autopsy (#diverged)' : 'open autopsy';
  d.innerHTML=
    `<div class="dh"><span>DETAIL · KEY</span><span class="x">${esc(r.key)}</span></div>`+
    `<div class="dbody">`+
      `<div class="drow"><span class="dk">key</span><span class="dv">${esc(r.key)}</span></div>`+
      `<div class="drow"><span class="dk">partition</span><span class="dv">${esc(r.part)}</span></div>`+
      `<div class="drow"><span class="dk">stamp</span><span class="dv">e${r.ep}·s${r.s}</span></div>`+
      `<div class="drow"><span class="dk">owner</span><span class="dv">${esc(r.owner)}</span></div>`+
      `<div class="drow"><span class="dk">replicas</span><span class="dv ${repUnder(r.rep)?'bad':''}">${r.rep}${r.status==='under-repl'?'  (under-replicated)':repUnder(r.rep)?'  (1 replica behind)':''}</span></div>`+
      `<div class="drow"><span class="dk">status</span><span class="dv ${stcls}">${r.status}</span></div>`+
    `</div>`+
    `<div class="dsec">RESOLVED STATE</div>`+
    `<div class="json">${jsonFor(r)}</div>`+
    (flag&&r.why?`<div class="dsec">WHY FLAGGED</div><div class="dnote" style="border-top:0">${r.why}</div>`:'')+
    `<div class="dact">`+
      `<a class="${flag?'primary':''}" href="${drillHref}">⤢ ${drillLabel}</a>`+
      `<a href="${KEY}">history</a>`+
    `</div>`+
    `<div class="dnote">`+
      `<b>Sources</b> — resolved value + stamp from the merged per-key state on node <b>uuid</b>; `+
      `divergence needs the <span class="nw">⚠ NEW</span> per-key version sample `+
      `(<span class="mono">__inspect{versions:K}</span>, scoped to this resource) cross-merged [A]. `+
      `Contention from <span class="mono">__observe</span> <b>lost</b> events at <b>we=epoch</b> (same-epoch) [B]. `+
      `Replica count vs <b>R</b>; under-replication from snapshot <b>orphans</b> + cover diff [A][E].`+
    `</div>`;
}

/* ── RENDER: status bar ── */
function renderStatus(){
  const s=SCEN[state.scen], su=s.summary, ac=s.activity;
  const dCls=su.diverged?'n-bad':'n-ok', cCls=su.contended?'n-warn':'n-ok';
  const wArrow = ac.wTo>ac.wFrom?`${ac.wFrom}<span class="arrow"> → </span>${ac.wTo}`:`${ac.wTo}`;
  const cArrow = ac.cTo>ac.cFrom?`<span class="n-bad">${ac.cFrom} → ${ac.cTo}</span>`:`<span class="n-ok">${ac.cTo}</span>`;
  const hot = s.hot.slice(0,2).map(([k,v])=>`${k} <b>${v}</b>`).join('  ');
  $('status').innerHTML=
    `<div class="seg-s h ${s.warn?'warn':''}"><span class="lamp"></span><span class="word">${s.word}</span></div>`+
    `<div class="seg-s"><b>${su.keys.toLocaleString()}</b> keys · <b>${s.parts.length}</b> parts · view <b>e4</b> · <b>5</b> members</div>`+
    `<div class="seg-s">rollup <span class="n-ok">${su.converged.toLocaleString()}</span> converged · `+
      `<span class="${dCls}">${su.diverged}</span> diverged · <span class="${cCls}">${su.contended}</span> contended (60s)</div>`+
    `<div class="seg-s">writes/s ${wArrow} · conflicts/s ${cArrow}</div>`+
    `<div class="seg-s">hot ${hot}</div>`+
    `<div class="hints">`+
      `<span class="hint"><span class="kbd">↑↓</span>row</span>`+
      `<span class="hint"><span class="kbd">↵</span>autopsy</span>`+
      `<span class="hint"><span class="kbd">/</span>filter</span>`+
      `<span class="hint"><span class="kbd">⇥</span>scenario</span>`+
    `</div>`;
}

function renderAll(){ renderTree(); renderTriage(); renderTable(); renderDetail(); renderStatus();
  document.querySelectorAll('#seg button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.id===state.scen));
}

/* ── selection ── */
function select(key, opts){
  state.sel=key;
  const r=rows().find(x=>x.key===key);
  if(r) state.openParts.add(r.part);
  renderTree(); renderTable(); renderDetail();
  if(opts&&opts.scroll){
    const el=document.querySelector(`#tbody tr[data-key="${CSS.escape(key)}"]`);
    if(el) el.scrollIntoView({block:'nearest'});
  }
}

/* ── events: scenario toggle ── */
$('seg').addEventListener('click', e=>{
  const b=e.target.closest('button'); if(!b) return;
  state.scen=b.dataset.id; state.sel=null;
  state.openParts=new Set(state.scen==='attention'?['user42','cart9','billing']:['user42']);
  try{ history.replaceState(null,'','#'+state.scen);}catch{}
  renderAll();
});

/* ── events: tree ── */
$('treeBody').addEventListener('click', e=>{
  const kid=e.target.closest('.tkid');
  if(kid){ select(kid.dataset.key,{scroll:true}); return; }
  const node=e.target.closest('.tnode.part');
  if(node){ const p=node.dataset.part;
    if(state.openParts.has(p)) state.openParts.delete(p); else state.openParts.add(p);
    renderTree();
  }
});

/* ── events: table — sort headers + row select; dblclick drills ── */
$('thead').addEventListener('click', e=>{
  const th=e.target.closest('th'); if(!th) return;
  const c=th.dataset.col;
  if(state.sort.col===c) state.sort.dir*=-1; else { state.sort.col=c; state.sort.dir=1; }
  renderTable();
});
$('tbody').addEventListener('click', e=>{
  const tr=e.target.closest('tr'); if(!tr) return; select(tr.dataset.key);
});
$('tbody').addEventListener('dblclick', e=>{
  const tr=e.target.closest('tr'); if(!tr) return;
  const r=rows().find(x=>x.key===tr.dataset.key); if(r) location.href=(r.href&&r.href!=='#')?r.href:KEY;
});

/* ── events: triage — click drills straight into the key page ── */
$('triage').addEventListener('click', e=>{
  const it=e.target.closest('.titem'); if(!it) return;
  if(it.dataset.key) state.sel=it.dataset.key;
  const href=it.dataset.href;
  if(href && href!=='#'){ location.href=href; return; }
  renderTree(); renderTable(); renderDetail();
});

/* ── events: filter line ── */
$('filter').addEventListener('input', e=>{ state.filter=e.target.value; renderTable(); });

/* ── events: keyboard, native to the idiom ── */
document.addEventListener('keydown', e=>{
  if(e.key==='/' && document.activeElement!==$('filter')){ e.preventDefault(); $('filter').focus(); return; }
  if(e.key==='Escape'){ $('filter').blur(); }
  if(document.activeElement===$('filter')) return;
  if(e.key==='Tab'){ e.preventDefault(); state.scen=state.scen==='healthy'?'attention':'healthy';
    state.sel=null; state.openParts=new Set(state.scen==='attention'?['user42','cart9','billing']:['user42']);
    renderAll(); return; }
  const q=state.filter.trim().toLowerCase();
  const list=sortRows(rows().filter(r=>matches(r,q)));
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){
    e.preventDefault();
    let i=list.findIndex(r=>r.key===state.sel);
    i = e.key==='ArrowDown' ? Math.min(list.length-1,i+1) : Math.max(0,i<0?0:i-1);
    if(list[i]) select(list[i].key,{scroll:true});
  }
  if(e.key==='Enter' && state.sel){
    const r=rows().find(x=>x.key===state.sel);
    if(r) location.href=(r.href&&r.href!=='#')?r.href:KEY;
  }
});

/* ── boot ── */
const fromHash=location.hash.slice(1);
if(SCEN[fromHash]){ state.scen=fromHash;
  state.openParts=new Set(fromHash==='attention'?['user42','cart9','billing']:['user42']); }
renderAll();
</script>
