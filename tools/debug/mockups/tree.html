<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cluster — explorer · fero</title>
<!-- sharp technical type: Inter (UI) + JetBrains Mono (data/labels) — crisper than the rounded system Segoe UI / Consolas fallbacks -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ────────────────────────────────────────────────────────────────────
     IDIOM: outline + inspector (Chrome DevTools elements tree / Linear /
     Finder column view), on the SAME graphite design system as the rest of
     the tool. ONE page, ONE data model — the whole cluster encoded once, so
     the cross-page data drift the multi-page version had to audit for (8 vs
     16 partitions, R=∞) is structurally impossible here.
       LEFT  = a filterable TREE. Resources expand to their four children
               (partitions · server nodes · client nodes · epochs); each row
               expands further (partition→commits, node→owned partitions,
               client→subscriptions, epoch→per-node layout). The data is a
               DAG, not a tree — a partition appears under BOTH its resource
               AND its owning node, each showing the relationship-relevant
               stats. Every row carries level-appropriate stats + a status pill.
       TOP   = ONE global filter that PRUNES the whole hierarchy at once
               (is:diverged collapses the tree to just the bad branches across
               every resource) — the triage superpower a per-page filter can't
               match. The bar shows the current view + the selected path.
       RIGHT = the INSPECTOR — the selected row's rich leaf view (the partition
               LOG, the divergence decode, the write route, the epoch map),
               the content the multi-page "leaves" held, now in a pane.
     Colour stays FUNCTIONAL (severity only).
     ──────────────────────────────────────────────────────────────────── */
  :root{
    /* pure-black high-contrast monochrome: #000 ground, near-pure-white ink, crisp
       hairlines lifted enough to read on true black — maximum black/white range */
    --bg:#000000; --rail:#0a0a0c; --pane:#0c0c0e; --line:#2a2a30; --line-2:#3b3b43;
    --ink:#fbfcfe; --dim:#a2a2ac; --soft:#70707a; --faint:#48484f;
    --gold:#ecc36a; --gold-2:#caa24a;                                /* brand/chrome accent — selection bar, focus ring, omni glow (NOT a status colour) */
    --sel:#221b0a; --sel-line:var(--gold); --hover:#141417;
    --crit:#f0655d; --crit-bg:#2a1614; --warn:#e0a93f; --warn-bg:#261f10;
    --ok:#5fc78f; --ok-bg:#13241b; --info:#62a6ec; --info-bg:#11212f;
    --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
    --ui:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.5 var(--ui);
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow:hidden;display:flex;flex-direction:column}
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
  a{color:var(--info);text-decoration:none} a:hover{text-decoration:underline}
  /* a navigable reference token (an address / partition / epoch / commit / sub that IS a tree node) — click jumps the tree there. Discoverable via a faint dotted underline; lights up gold on hover. */
  .ref{cursor:pointer;border-bottom:1px dotted var(--faint);transition:color .1s,border-color .1s}
  .ref:hover{color:var(--gold);border-bottom-color:var(--gold-2)}
  ::selection{background:var(--sel)}

  /* ── top command bar: just the ONE omni filter box, edge to edge — pure black ── */
  .bar{display:flex;align-items:center;justify-content:center;gap:0;height:60px;background:#000;position:relative;
    border-bottom:1px solid var(--line);padding:0 26px;flex:0 0 auto;font-size:12.5px}

  /* the omni box — a single control: search icon + active chips + free-text input
     + an in-box match count and a reset ✕, with a suggestions dropdown on focus.
     Everything (filters, scenario, selection, URL) flows through here. */
  .omni{position:relative;display:flex;align-items:center;gap:8px;flex:0 1 auto;height:38px;
    min-width:470px;max-width:760px;                                  /* roomy enough for the full placeholder; grows with chips up to the cap */
    background:#17171d;border:1px solid #44444e;border-radius:0;padding:0 12px 0 14px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.06), 0 4px 14px rgba(0,0,0,.6), 0 0 20px rgba(225,190,110,.12)}   /* neutral fill + lift + warm gold glow, squared */
  .omni:hover{border-color:#4d4d57}
  .omni.focus{border-color:var(--sel-line);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.06), 0 0 0 3px rgba(236,195,106,.18), 0 4px 14px rgba(0,0,0,.6)}
  .omni .oicon{color:var(--gold-2);font-size:13px;flex:0 0 auto}
  .omni .ochips{display:flex;align-items:center;gap:6px;flex:0 0 auto}
  .omni input{background:none;border:0;outline:0;color:var(--ink);font:inherit;font-family:var(--mono);
    font-size:12px;flex:1 1 300px;min-width:70px;height:100%}
  .omni input::placeholder{color:var(--soft);font-family:var(--ui)}
  .omni .ocount{flex:0 0 auto;color:var(--soft);font-family:var(--mono);font-size:11px;white-space:nowrap;font-variant-numeric:tabular-nums}
  .omni .ocount .fl{color:var(--warn);font-weight:600}
  .omni .oclear{flex:0 0 auto;cursor:pointer;color:var(--soft);font-size:12px;line-height:1;padding:2px 4px;border-radius:5px}
  .omni .oclear:hover{color:var(--ink);background:rgba(255,255,255,.07)}
  /* chips: a neutral black/white row — colour reduced to a small accent dot; the
     selection chip renders as a breadcrumb path (sessions › Partitions › user42) */
  .ochip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 5px 0 10px;border-radius:6px;
    font-family:var(--mono);font-size:11px;white-space:nowrap;flex:0 0 auto;
    background:#121317;border:1px solid var(--line-2);color:var(--ink)}
  .ochip .pd{width:5px;height:5px;border-radius:50%;flex:0 0 auto;background:var(--soft)}
  .ochip.scen .pd{background:var(--warn)}
  .ochip .ox{cursor:pointer;color:var(--soft);font-size:13px;line-height:1;padding:0 3px;border-radius:4px;margin-left:2px}
  .ochip .ox:hover{color:var(--ink);background:rgba(255,255,255,.10)}
  /* suggestions dropdown (focus-only) */
  .omenu{display:none;position:absolute;top:calc(100% + 7px);left:0;width:420px;background:var(--pane);
    border:1px solid var(--line-2);border-radius:10px;box-shadow:0 14px 44px #000d;z-index:40;padding:6px}
  .omni.focus .omenu{display:block}
  .omenu .oh{font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);padding:7px 9px 5px;font-family:var(--ui)}
  .omenu .oitem{display:flex;align-items:center;gap:8px;padding:5px 9px;border-radius:6px;cursor:pointer;color:var(--ink)}
  .omenu .oitem:hover{background:var(--hover)}
  .omenu .oitem .od{width:7px;height:7px;border-radius:2px;transform:rotate(45deg);flex:0 0 auto}
  .omenu .oitem .ot{font-family:var(--mono);font-size:12px;flex:0 0 auto}
  .omenu .oitem .onote{font-size:10.5px;color:var(--soft);font-family:var(--ui);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1 1 auto;min-width:0}
  .omenu .oitem .oc{flex:0 0 auto;color:var(--soft);font-family:var(--mono);font-size:11px;font-variant-numeric:tabular-nums}
  .omenu .osep{height:1px;background:var(--line);margin:5px 6px}

  /* live-feed indicator only (file mode shows nothing here); sits at the bar's right */
  .srcname{position:absolute;right:26px;top:0;height:100%;display:flex;align-items:center;color:var(--soft);font-family:var(--mono);font-size:11px;white-space:nowrap}
  .srcname .liveDot{color:var(--ok);animation:livePulse 1.6s ease-in-out infinite}
  @keyframes livePulse{0%,100%{opacity:1}50%{opacity:.35}}
  .srcname b{color:var(--dim);font-weight:600}

  /* ── 2-pane body: tree | inspector ─────────────────────────────────── */
  .body{display:grid;grid-template-columns:minmax(0,1fr) 396px;flex:1 1 auto;min-height:0}
  .body.noinsp{grid-template-columns:minmax(0,1fr)}   /* nothing selected / closed → the tree reclaims the inspector's column */
  .body.noinsp .insp{display:none}

  /* ── TREE ──────────────────────────────────────────────────────────── */
  .tree{overflow:auto;background:var(--bg);min-width:0;padding:10px 0}
  /* full-bleed rows: background, hover, selected accent and the section hairline
     all span edge-to-edge — so separators reach the viewport edge with the
     inspector closed; stats just right-align within a roomy gutter */
  .trow{display:flex;align-items:center;gap:7px;height:32px;padding-right:28px;cursor:pointer;white-space:nowrap;position:relative}
  .trow:hover{background:var(--hover)}
  .trow[aria-selected=true]{background:var(--sel);box-shadow:inset 2px 0 0 var(--sel-line)}   /* crisp left accent on the selected row */
  .trow[data-type=resource]{height:38px}                                                      /* top-level resources get more presence + air */
  .trow[data-type=resource]:not(:first-child){border-top:1px solid var(--line)}               /* hairline between top-level resources → sectioned, full-width */
  .trow.dim{opacity:.42}
  .trow .tw{width:15px;text-align:center;color:var(--soft);flex:0 0 auto;font-size:9px}
  .trow .tw.leaf{visibility:hidden}
  .trow .sd{width:7px;height:7px;border-radius:2px;transform:rotate(45deg);flex:0 0 auto;background:transparent}
  .trow[data-sev=crit] .sd{background:var(--crit)} .trow[data-sev=warn] .sd{background:var(--warn)} .trow[data-sev=info] .sd{background:var(--info)}
  .trow .ic{width:14px;text-align:center;color:var(--soft);flex:0 0 auto;font-family:var(--mono);font-size:11px}
  .trow[data-type=resource] .ic{color:var(--gold-2)}                                          /* top-level resource marks carry the gold brand accent */
  .trow .lab{font-family:var(--mono);font-size:12.5px;color:var(--ink);flex:0 0 auto}
  .trow[aria-selected=true] .lab{color:#fff}
  .trow[data-sev=crit] .lab{color:#f0a39c} .trow[aria-selected=true][data-sev=crit] .lab{color:#fff}
  .trow[data-type=group] .lab{font-family:var(--ui);font-weight:700;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--soft)}
  .trow[data-type=group] .gc{color:var(--faint);font-size:11px;margin-left:5px;font-family:var(--mono)}
  .trow[data-type=resource] .lab{font-size:13px;font-weight:600}
  .trow .grow{flex:1 1 auto;min-width:10px}
  .trow .meta{display:inline-flex;align-items:center;font-family:var(--mono);font-size:11px;color:#93939c;font-variant-numeric:tabular-nums}
  /* each stat is a fixed-width, right-aligned cell → the same column lines up across sibling rows */
  .trow .meta .stat{flex:0 0 auto;display:inline-block;text-align:right;padding-left:15px;white-space:nowrap}
  .trow .meta .stat .su{color:var(--soft)}
  .trow .meta .stat.bad{color:var(--crit)} .trow .meta .stat.bad .su{color:var(--crit)}
  .trow .meta .stat.warn{color:var(--warn)} .trow .meta .stat.warn .su{color:var(--warn)}
  .trow .meta .bad{color:var(--crit);font-weight:600} .trow .meta .warnt{color:var(--warn);font-weight:600} .trow .meta .x{color:var(--faint)} .trow .meta .info{color:var(--info);font-weight:600}
  /* pill is the FIRST column of the right cluster → stats stay anchored to the row's right edge whether or not a row has a badge (so 'nothing' / patchy stat rows still read right-aligned) */
  .trow .pillwrap{flex:0 0 auto;width:120px;display:flex;justify-content:flex-end;align-items:center}
  .pill{display:inline-flex;align-items:center;gap:5px;font-size:9.5px;font-weight:700;letter-spacing:.03em;
    text-transform:uppercase;padding:1px 7px;border-radius:3px;white-space:nowrap;flex:0 0 auto}
  .pill .pd{width:5px;height:5px;border-radius:50%;flex:0 0 auto}
  .pill.ok{color:var(--ok);background:var(--ok-bg);border:1px solid #1f3a2c} .pill.ok .pd{background:var(--ok)}
  .pill.crit{color:var(--crit);background:var(--crit-bg);border:1px solid #4a2622} .pill.crit .pd{background:var(--crit)}
  .pill.warn{color:var(--warn);background:var(--warn-bg);border:1px solid #443613} .pill.warn .pd{background:var(--warn)}
  .pill.info{color:var(--info);background:var(--info-bg);border:1px solid #234055} .pill.info .pd{background:var(--info)}
  .pill.calm{color:var(--soft);background:#0c0e12;border:1px solid var(--line)} .pill.calm .pd{background:var(--faint)}
  /* the guide line down the indentation */
  .trow .guide{position:absolute;top:0;bottom:0;width:1px;background:var(--line)}

  /* ── INSPECTOR (right) ─────────────────────────────────────────────── */
  .insp{background:var(--pane);border-left:1px solid var(--line);overflow-y:auto;display:flex;flex-direction:column}
  .insp .ih{padding:15px 16px 13px;border-bottom:1px solid var(--line)}
  .insp .ih .ik{font-family:var(--mono);font-size:15px;font-weight:600;color:#fff;display:flex;align-items:center;gap:8px}
  .insp .ih .ik .sd{width:9px;height:9px;border-radius:2px;transform:rotate(45deg)}
  .insp .ih.ok .ik .sd{background:var(--ok)} .insp .ih.crit .ik .sd{background:var(--crit)} .insp .ih.warn .ik .sd{background:var(--warn)} .insp .ih.info .ik .sd{background:var(--info)}
  .insp .ih .kind{font-family:var(--ui);font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--soft);margin-left:auto}
  .insp .ih .iclose{margin-left:4px;cursor:pointer;color:var(--soft);font-size:13px;line-height:1;padding:0 2px}   /* close the inspector → tree goes full-width */
  .insp .ih .iclose:hover{color:var(--ink)}
  .insp .ih .isub{margin-top:5px;color:var(--dim);font-size:11.5px;line-height:1.45}
  .insp .ih .isub .mono{color:var(--ink)} .insp .ih .isub .bad{color:var(--crit)} .insp .ih .isub .warnt{color:var(--warn)}
  .insp .seg{padding:14px 16px;border-bottom:1px solid var(--line)}
  .insp .seg .st{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);margin-bottom:9px;display:flex;gap:7px;align-items:center}
  .insp .seg .st .new{color:var(--warn);font-family:var(--mono);font-size:9px;border:1px solid #443613;border-radius:3px;padding:0 5px;background:var(--warn-bg);letter-spacing:0}
  .insp .seg .st .stn{margin-left:auto;color:var(--faint);font-weight:600;letter-spacing:0}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:12px}
  .kv dt{color:var(--soft)} .kv dd{margin:0;color:var(--ink);font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right}
  .kv dd.bad{color:var(--crit)} .kv dd.warn{color:var(--warn)} .kv dd.ok{color:var(--ok)}
  /* mini log */
  .mlog{display:flex;flex-direction:column;font-family:var(--mono);font-size:11.5px}
  .mlog .mr{display:grid;grid-template-columns:64px 1fr auto;gap:9px;align-items:center;padding:4px 0;border-bottom:1px solid var(--line)}
  .mlog .mr:last-child{border-bottom:0}
  .mlog .mr .stp{color:var(--soft)} .mlog .mr .stp .e{color:var(--faint)}
  .mlog .mr .kvv{color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mlog .mr .kvv .kk{color:var(--dim)}
  .mlog .mr .oc{font-size:10px;font-weight:700;text-transform:uppercase}
  .mlog .mr .oc.applied,.mlog .mr .oc.local{color:var(--ok)} .mlog .mr .oc.fwd{color:var(--dim)} .mlog .mr .oc.fence{color:var(--warn)} .mlog .mr .oc.conflict{color:var(--crit)}
  .mlog .mr.stuck{background:var(--warn-bg)} .mlog .mr .stuckb{color:var(--warn);font-size:9px;font-weight:700;text-transform:uppercase}
  /* replica lag bars */
  .reps{display:flex;flex-direction:column;gap:7px;font-family:var(--mono);font-size:12px}
  .reps .rr{display:grid;grid-template-columns:auto 1fr auto;gap:9px;align-items:center}
  .reps .rr .rn{color:var(--ink)} .reps .rr .rn .ow{color:var(--info);font-family:var(--ui);font-size:9px;font-weight:700;text-transform:uppercase;margin-left:5px;border:1px solid #234866;border-radius:2px;padding:0 4px}
  .reps .rr .bar{height:5px;background:var(--line);border-radius:3px;overflow:hidden}
  .reps .rr .bar i{display:block;height:100%;background:var(--ok)} .reps .rr .bar i.bad{background:var(--crit)}
  .reps .rr .lg{text-align:right;color:var(--soft)} .reps .rr .lg.bad{color:var(--crit);font-weight:600}
  /* owner-by-epoch / layout list */
  .ebe{display:flex;flex-direction:column;font-family:var(--mono);font-size:12px}
  .ebe .er{display:grid;grid-template-columns:34px 1fr auto;gap:9px;align-items:center;padding:4px 0;border-bottom:1px solid var(--line)}
  .ebe .er:last-child{border-bottom:0} .ebe .er .ep{color:var(--soft)} .ebe .er.cur .ep{color:var(--ink);font-weight:600}
  .ebe .er .ono{color:var(--ink)} .ebe .er .bdg{font-family:var(--ui);font-size:9px;font-weight:700;text-transform:uppercase;padding:0 5px;border-radius:2px}
  .ebe .er.cur .bdg{color:var(--ok);background:var(--ok-bg)} .ebe .er.moved .bdg{color:var(--warn);background:var(--warn-bg)} .ebe .er.placed .bdg{color:var(--info);background:var(--info-bg)}
  /* version sample table */
  .vt{font-family:var(--mono);font-size:11.5px;width:100%;border-collapse:collapse}
  .vt th{text-align:left;color:var(--soft);font-weight:600;font-size:10px;text-transform:uppercase;letter-spacing:.04em;padding:0 0 5px;border-bottom:1px solid var(--line)}
  .vt td{padding:5px 0;border-bottom:1px solid var(--line);color:var(--ink)} .vt tr:last-child td{border-bottom:0}
  .vt td.node{color:var(--dim)} .vt .min{color:var(--crit)} .vt .maj{color:var(--ok)}
  .vt .bdg{font-family:var(--ui);font-size:9px;font-weight:700;padding:0 4px;border-radius:2px;margin-left:5px}
  .vt .bdg.lag{background:var(--crit-bg);color:var(--crit)} .vt .bdg.cur{background:var(--ok-bg);color:var(--ok)}
  /* route timeline */
  .tl{list-style:none;margin:0;padding:0 0 0 2px}
  .tl li{position:relative;padding:0 0 11px 18px;font-size:11.5px;line-height:1.5;color:var(--dim)}
  .tl li:last-child{padding-bottom:0}
  .tl li::before{content:'';position:absolute;left:3px;top:4px;width:7px;height:7px;border-radius:50%;background:var(--faint);border:2px solid var(--pane);z-index:1}
  .tl li::after{content:'';position:absolute;left:6px;top:11px;bottom:-1px;width:1px;background:var(--line-2)} .tl li:last-child::after{display:none}
  .tl li.done::before{background:var(--ok)} .tl li.move::before{background:var(--warn)} .tl li.now::before{background:var(--info)} .tl li.bad::before{background:var(--crit)}
  .tl li .ep{font-family:var(--mono);color:var(--ink);font-weight:600;margin-right:6px} .tl li .mono{color:var(--ink)} .tl li b{color:var(--ink)} .tl li .bad{color:var(--crit)}
  .reason{font-size:12px;line-height:1.55;color:var(--dim)} .reason b{color:var(--ink);font-weight:600}
  .next{display:flex;gap:8px;align-items:flex-start;background:#0c0e12;border:1px solid var(--line-2);border-radius:5px;padding:9px 11px;font-size:12px;line-height:1.5;color:var(--ink);margin-top:10px}
  .next .arr{color:var(--warn);font-weight:700}
  .reclist{display:flex;flex-direction:column;gap:6px}
  .recitem{display:grid;grid-template-columns:auto 1fr auto;gap:9px;align-items:baseline;font-family:var(--mono);font-size:12px;cursor:pointer;padding:3px 6px;border-radius:4px;margin:0 -6px}
  .recitem:hover{background:var(--hover)} .recitem .rk{color:var(--ink)} .recitem .rd{color:var(--soft);font-size:11px} .recitem .rsev{width:6px;height:6px;border-radius:2px;transform:rotate(45deg)}
  .recitem[data-sev=crit] .rsev{background:var(--crit)} .recitem[data-sev=warn] .rsev{background:var(--warn)} .recitem[data-sev=ok] .rsev{background:var(--faint)}
  .empty2{padding:30px 16px;color:var(--soft);font-size:12px;line-height:1.6;text-align:center}
  .recd{font-family:var(--mono);font-size:11.5px;color:var(--dim);line-height:1.6;white-space:pre-wrap;background:#0c0e12;border:1px solid var(--line);border-radius:5px;padding:9px 11px}
  .recd .kk{color:var(--info)} .recd .vv{color:var(--ink)} .recd .bad{color:var(--crit)}

  /* ── bottom status bar: centered selection breadcrumb · level-dependent state (right) ── */
  .keys{display:flex;align-items:center;justify-content:center;position:relative;height:30px;background:var(--rail);
    border-top:1px solid var(--line);padding:0 20px;flex:0 0 auto;font-size:11px;color:var(--soft)}
  .crumb{display:flex;align-items:center;min-width:0;overflow:hidden;font-family:var(--mono);font-size:11.5px}
  .crumb .cseg{color:var(--dim);cursor:pointer;white-space:nowrap}
  .crumb .cseg:hover{color:var(--ink)} .crumb .cseg.cur{color:var(--gold);font-weight:600}
  .crumb .csep{color:var(--faint);padding:0 8px;flex:0 0 auto}
  .kright{position:absolute;right:20px;top:0;height:100%;display:flex;align-items:center;flex:0 0 auto}
  .kright .right{font-family:var(--mono);color:var(--soft);white-space:nowrap}
  .keys .sst{font-weight:600} .keys .sst.crit{color:var(--crit)} .keys .sst.warn{color:var(--warn)}
  .keys .sst.ok{color:var(--ok)} .keys .sst.info{color:var(--info)}
</style>
</head>
<body>

<!-- ── command bar: the ONE omni filter box — chips + input + match count + reset ✕ + suggestions ── -->
<div class="bar">
  <div class="omni" id="omni">
    <span class="oicon">⌕</span>
    <div class="ochips" id="ochips"></div>
    <input id="q" spellcheck="false" placeholder="filter the whole tree — type a name, or pick a filter" autocomplete="off">
    <span class="ocount" id="ocount"></span>
    <span class="oclear" id="oclear" title="reset — clear filters &amp; selection">✕</span>
    <div class="omenu" id="omenu"></div>
  </div>
  <span class="srcname" id="srcName"></span>
  <input type="file" id="file" accept=".json,application/json" hidden>
</div>

<div class="body">
  <!-- ── LEFT: the tree ── -->
  <div class="tree" id="tree"></div>
  <!-- ── RIGHT: the inspector ── -->
  <aside class="insp" id="insp"></aside>
</div>

<!-- ── bottom status bar: the selection breadcrumb (location) + data sources + cluster health ── -->
<div class="keys">
  <div class="crumb" id="crumb"></div>
  <div class="kright"><span class="right" id="statusRight"></span></div>
</div>

<script type="module">
// normalize() + its derivation helpers (deriveOwnerAt/layoutAt/fmt) live in
// ./shape.js — the ONE model seam this viewer and the Node producers share.
import { normalize, layoutAt, fmt } from './shape.js';
/* ════════════════════════════════════════════════════════════════════════
   ONE DATA MODEL — the whole cluster, encoded once. The tree is a projection
   of this; the inspector reads from it. Sessions is the fully-detailed
   resource (the e3→e4 incident); the others are light & healthy, so a
   is:diverged filter correctly prunes the tree down to just sessions.
   ════════════════════════════════════════════════════════════════════════ */
const $ = id => document.getElementById(id);

// status → pill class + label (FUNCTIONAL colour only)
const ST = {
  diverged:{cls:'crit',lab:'diverged'}, under:{cls:'crit',lab:'under-replicated'},
  contended:{cls:'warn',lab:'contended'}, lagging:{cls:'warn',lab:'lagging'},
  slow:{cls:'crit',lab:'slow consumer'}, stale:{cls:'warn',lab:'stale view'},
  resub:{cls:'warn',lab:'re-subscribing'}, gone:{cls:'info',lab:'disconnected'},
  healthy:{cls:'ok',lab:'healthy'}, ok:{cls:'ok',lab:'ok'},
};
// terse one-line "what it means" per status — shown INLINE beside each filter in the dropdown AND as the hover tooltip on every status badge (the colour/dot carries severity)
// note the lagging↔slow split: lagging is a REPLICA behind on the data plane (self-heals via anti-entropy); slow is a SUBSCRIBER behind on the read plane (can get dropped) — different actors, different planes.
const STATUS_DOC = {
  under: 'one failure from data loss (held on < R)',
  diverged: 'serving an older value than the owner',
  slow: 'a subscriber can’t keep up with delivery',
  stale: 'old view-epoch — its writes get fenced',
  contended: 'same-epoch write conflict — lower loses',
  resub: 'owner moved at a view change — re-subbing',
  lagging: 'a replica is behind its owner, catching up',
  gone: 'client disconnected — subs released',
  critical: 'data at risk — durability or correctness',
  warn: 'degraded, but expected or self-healing',
  healthy: 'converged and up to date', ok: 'converged and up to date',
};
const docOf = st => STATUS_DOC[st] || '';
const SEV = {crit:'crit', warn:'warn', info:'info', ok:''};
const sevOf = st => SEV[(ST[st]||ST.healthy).cls];
// is:critical / is:warn are SEVERITY filters — they match a whole tier, not one status. clsOf maps a status OR a severity token to its colour class; statusMatch backs both the filter and the dropdown counts.
const clsOf = st => st==='critical' ? 'crit' : st==='warn' ? 'warn' : (ST[st]||ST.healthy).cls;
const isSeverity = st => st==='critical' || st==='warn';
const statusMatch = (nodeSt, fst) => isSeverity(fst)
  ? (nodeSt!=='healthy' && nodeSt!=='ok' && clsOf(nodeSt)===clsOf(fst))   // severity tier: any flagged status of that colour class
  : nodeSt===fst;                                                          // exact status bucket

let MODEL = null;

/* ════════════════════════════════════════════════════════════════════════
   TREE BUILD — turn the model into nested tree nodes. The DAG is embraced:
   a partition appears under its resource's Partitions group AND under its
   owner node's "owns" — each occurrence keyed by its path, each showing the
   relationship-relevant meta, both inspecting the same entity.
   ════════════════════════════════════════════════════════════════════════ */
const klog = n => n>=1000 ? (n/1000).toFixed(n>=10000?0:1)+'k' : ''+n;
// a fixed-width, right-aligned stat cell (value + dim unit) → same column lines up across sibling rows; `tip` is the hover tooltip
function stat(v, u, tip, w, cls){
  return `<span class="stat${cls?' '+cls:''}" style="width:${w}px" title="${tip}">${v}${u?`<span class="su"> ${u}</span>`:''}</span>`;
}

// a tree node: {key,type,label,icon,st,meta(html),entity,kids:[]}
function commitNodes(p, prefix){
  return p.log.map(c => ({
    key:prefix+'/c/'+c.e+'.'+c.s+'.'+c.key, type:'commit', label:'e'+c.e+'·s'+c.s, icon:'·',
    st: c.out==='conflict'?'diverged':c.out==='fence'?'lagging':'healthy',
    metaRaw:`<span class="x">${c.key}</span> = ${c.val} · <span class="oc ${c.out}">${c.out}</span>`,
    entity:{kind:'commit', c, p}, kids:[]
  }));
}
function partitionNode(p, prefix, rel){
  // rel: 'res' (under resource) or {host:addr,lag} (under a node as owned/hosted)
  const meta = rel==='res'
    ? stat(p.owner,'','partition owner (node address)',76)
      + stat(`${p.held}/${p.R}`,'held','replicas held / required (R)',62)
      + stat(p.wps,'w/s','writes per second',74)
      + stat(klog(p.log.length),'log','log records',62)
    : stat(`${p.held}/${p.R}`,'held','replicas held / required (R)',62)
      + stat(p.keys,'keys','keys in this partition',76)
      + stat(p.wps,'w/s','writes per second',74);
  return {key:prefix+'/p/'+p.id, type:'partition', label:p.id, icon:'◧', st:p.st,
    metaRaw:meta, entity:{kind:'partition', p}, kids:commitNodes(p, prefix+'/p/'+p.id)};
}
function nodeNode(n, res, prefix){
  const ownsParts = res.parts.filter(p=>p.owner===n.id);
  const kids = ownsParts.map(p => partitionNode(p, prefix+'/n/'+n.id, {host:n.id}));
  const meta = stat(ownsParts.length,'owns','partitions owned by this node',64)
    + stat(n.keys!=null?fmt(n.keys):'—','keys','keys hosted on this node',84)
    + stat(n.wps!=null?n.wps:'—','w/s','writes per second',74)
    + stat('+'+(n.lag||0),'lag','replication lag behind the floor',64, n.lag?'bad':'');
  return {key:prefix+'/n/'+n.id, type:'node', label:n.id, icon:'▢', st:n.st, metaRaw:meta,
    entity:{kind:'node', n, res}, kids};
}
function clientNode(c, prefix){
  const kids = c.subs.map((s,i)=>({key:prefix+'/cl/'+c.id+'/s/'+i, type:'sub', label:s.sub, icon:'↳', st:'healthy',
    metaRaw:`→ ${s.own} · head ${s.head} · ${s.lag==='0'?'<span class="x">+0</span>':s.lag==='released'?'<span class="x">released</span>':'<span class="'+(s.cls==='min'?'bad':'')+'">'+s.lag+'</span>'}`,
    entity:{kind:'sub', s, c}, kids:[]}));
  const meta = stat(c.srv,'','connected server',82)
    + stat(c.role,'','client role',64)
    + stat(c.subs.length, c.subs.length===1?'sub':'subs','active subscriptions',58)
    + stat('+'+(c.lag||0),'lag','max subscription lag',60, c.lag?(c.st==='slow'?'bad':'warn'):'');
  return {key:prefix+'/cl/'+c.id, type:'client', label:c.id, icon:'○', st:c.st, metaRaw:meta,
    entity:{kind:'client', c}, kids};
}
function epochNode(e, res, prefix){
  const at = layoutAt(res, e.ep);
  const kids = res.nodes.map(n=>{
    const owns = at[n.id] || [];
    return {key:prefix+'/e/'+e.ep+'/n/'+n.id, type:'epochnode', label:n.id, icon:'▢', st:'healthy',
      metaRaw:`owns ${owns.length} · <span class="x">${owns.slice(0,4).join(', ')||'—'}${owns.length>4?'…':''}</span>`,
      entity:{kind:'epochnode', n, owns, ep:e.ep}, kids:[]};
  });
  // partition-centric summary: how many partitions exist at this view, how many are NEW (first written
  // here — a placement), and how many MOVED (a handoff). A birth is "new", not a move (the disjoint count).
  const nP = (e.placed||[]).length;                                              // new this view (placed)
  const count = res.parts.filter(p => p.ownerByEpoch ? p.ownerByEpoch[e.ep]!==undefined : true).length; // partitions that exist at this view
  // both moved + new are PER-PARTITION counts → qualify the partition total in one bracket: "N partitions (X moved, Y new)"
  const inb = [];
  if(e.moves.length) inb.push(`<span class="warnt">${e.moves.length} moved</span>`);
  if(nP) inb.push(`<span class="info">${nP} new</span>`);
  const bits = [`${e.members} members`, `${count} partition${count!==1?'s':''}${inb.length?` (${inb.join(', ')})`:''}`];
  return {key:prefix+'/e/'+e.ep, type:'epoch', label:e.ep, icon:'◷', st:'healthy',
    metaRaw:`${bits.join(' · ')}${e.cur?' · current':''}`,
    entity:{kind:'epoch', e, res}, kids};
}
function groupNode(label, icon, kids, key){
  return {key, type:'group', label, icon, st:'healthy', metaRaw:'', gcount:kids.length, entity:null, kids};
}
function resourceNode(res){
  const pre = res.id;
  // child keys NEST under their group's key (sessions/g/parts/p/user42) so the
  // ancestor chain is recoverable by key prefix — that's what revealKey() walks
  // to auto-expand down to a jumped-to / filtered entity.
  const gP=pre+'/g/parts', gN=pre+'/g/nodes', gC=pre+'/g/clients', gE=pre+'/g/epochs';
  const groups = [
    groupNode('Partitions','◧', res.parts.map(p=>partitionNode(p, gP, 'res')), gP),
    groupNode('Server nodes','▢', res.nodes.map(n=>nodeNode(n, res, gN)), gN),
    groupNode('Client nodes','○', res.clients.map(c=>clientNode(c, gC)), gC),
    groupNode('Epochs','◷', res.epochs.map(e=>epochNode(e, res, gE)), gE),
  ];
  const meta = stat(res.members,'nodes','cluster members serving this resource',58)
    + stat(res.parts.length,'partitions','ring partitions (hash shards) the keyspace is split across',104)
    + stat(klog(res.keys),'keys','total top-level keys across all partitions (entries, not fields)',88)
    + stat(fmt(res.wps),'w/s','writes per second',86);
  return {key:pre, type:'resource', label:res.id, icon:'▦', st:resStatus(res), metaRaw:meta, entity:{kind:'resource', res}, kids:groups};
}
// a resource is as unhealthy as its worst child (rolled up) — computed, not stored
function resStatus(res){
  const bad = [...res.parts, ...res.nodes, ...res.clients].map(x=>x.st).filter(s=>s&&s!=='healthy');
  if(!bad.length) return 'healthy';
  const rank = {diverged:0,under:1,slow:2,contended:3,lagging:4,stale:5,resub:6,gone:7};
  return bad.sort((a,b)=>(rank[a]??9)-(rank[b]??9))[0];
}
let FOREST = [];   // built from MODEL on load (see boot)

/* ════════════════════════════════════════════════════════════════════════
   STATE + RENDER
   ════════════════════════════════════════════════════════════════════════ */
let scen = 'attention';                 // 'attention' | 'healthy' — now a CHIP, not a segmented toggle
let expanded = new Set(['sessions']);   // sessions open one level by default
let selKey = '';                        // inspector subject + a SELECTION chip in the omni box
let statusFilter = '';                  // '' or a status bucket (diverged/under/…) — a FILTER chip
let query = '';                         // free-text part of the omni box
let flat = [];                          // current visible rows (for j/k)

// is: tokens → status buckets; bare text → label substring
const IS = {diverged:'diverged',under:'under',contended:'contended',lagging:'lagging',slow:'slow',
  stale:'stale',resub:'resub',resubscribing:'resub',disconnected:'gone',gone:'gone',healthy:'healthy',
  critical:'critical',crit:'critical',warn:'warn',warning:'warn'};

// the omni box's effective filter = the status chip + the free text
function activeFilter(){ return {st: statusFilter || null, text: query.toLowerCase().trim()}; }
function statusOf(node){ return scen==='attention' ? (node.st||'healthy') : 'healthy'; }
// does a node itself match the active filter?
function selfMatch(node, f){
  if(!f.st && !f.text) return true;
  let ok = true;
  if(f.st) ok = ok && statusMatch(statusOf(node), f.st);
  if(f.text) ok = ok && node.label.toLowerCase().includes(f.text);
  return ok;
}
// does the node or any descendant match? (drives prune + auto-expand)
function subtreeMatch(node, f){
  if(selfMatch(node, f)) return true;
  return (node.kids||[]).some(k=>subtreeMatch(k, f));
}

/* flatten the forest into the visible row list, honouring expand + filter.
   With a filter active: prune non-matching branches and AUTO-EXPAND ancestors
   of matches so the hits reveal themselves. */
function flatten(){
  const f = activeFilter();
  const filtering = !!(f.st || f.text);
  flat = [];
  const walk = (nodes, depth) => {
    for(const n of nodes){
      if(filtering && !subtreeMatch(n, f)) continue;                 // prune
      const self = selfMatch(n, f);
      const hasKids = (n.kids||[]).length>0;
      const open = filtering ? (hasKids && (n.kids).some(k=>subtreeMatch(k,f)) || expanded.has(n.key))
                             : expanded.has(n.key);
      flat.push({n, depth, open, hasKids, dim: filtering && !self});
      if(open && hasKids) walk(n.kids, depth+1);
    }
  };
  walk(FOREST, 0);
}

function rowHTML(row, i){
  const {n, depth, open, hasKids, dim} = row;
  const st = statusOf(n);
  const sev = n.type==='group' ? '' : sevOf(st);
  const tw = hasKids ? (open?'▾':'▸') : '';
  const ind = 18 + depth*15;
  // no per-row pill for 'contended' — it's a soft warn (the partition's Rejected-writes detail carries the story); pill the harder states (diverged/under/slow/…)
  const pill = (n.type!=='group' && n.type!=='sub' && n.type!=='epochnode' && n.type!=='commit' && st!=='healthy' && st!=='contended')
    ? `<span class="pill ${ST[st].cls}" title="${ST[st].lab} — ${docOf(st)}"><span class="pd"></span>${ST[st].lab}</span>` : '';
  const gc = n.type==='group' ? `<span class="gc">${n.gcount}</span>` : '';
  const sd = (sev && n.type!=='group') ? `<span class="sd"></span>` : `<span class="sd"></span>`;
  return `<div class="trow${dim?' dim':''}" data-i="${i}" data-type="${n.type}" data-sev="${sev}" `+
    `${n.key===selKey?'aria-selected="true"':''} style="padding-left:${ind}px">`+
    `<span class="tw ${hasKids?'':'leaf'}">${tw}</span>`+
    sd+
    `<span class="ic">${n.icon}</span>`+
    `<span class="lab">${n.label}${gc}</span>`+
    `<span class="grow"></span>`+
    `<span class="pillwrap">${pill}</span>`+
    `<span class="meta">${n.metaRaw||''}</span></div>`;
}

function renderTree(){
  flatten();
  $('tree').innerHTML = flat.map(rowHTML).join('') || `<div class="empty2">No rows match this filter.</div>`;
}

/* ── the omni bar: brand · chips · suggestions · health rollup ──
   selection + scenario + status-filter all render as chips; the dropdown offers
   common filters with live counts; everything mirrors to the URL query string. */
// the selection breadcrumb lives in the BOTTOM status bar now (the "location"):
// a "cluster" root + the selected entity's resolvable ancestors (resource › group › entity)
function renderCrumb(){
  const segs = [{key:'', label:'cluster'}];
  if(selKey){ const parts = selKey.split('/'); let acc='';
    for(let i=0;i<parts.length;i++){ acc = i?acc+'/'+parts[i]:parts[i]; const n=findNode(acc);
      if(n) segs.push({key:acc, label: n.type==='group' ? n.label.toLowerCase() : n.label}); } }   // group crumbs read lowercase
  const cur = segs.length-1;
  $('crumb').innerHTML = segs.map((s,i)=>
    `<span class="cseg${i===cur?' cur':''}" data-segkey="${s.key}">${s.label}</span>`).join('<span class="csep">›</span>');
}
function filterChip(st){
  return `<span class="ochip filter" title="is:${st} — ${docOf(st)}"><span class="pd" style="background:var(--${clsOf(st)})"></span>is:${st}`+
    `<span class="ox" data-clear="filter" title="clear filter">×</span></span>`;
}
// how many entities currently carry a given status (drives the dropdown counts)
function countStatus(b){
  let n=0; for(const res of (MODEL?MODEL.resources:[])) for(const x of [...res.parts,...res.nodes,...res.clients]) if(statusMatch(x.st, b)) n++;
  return n;
}
function renderMenu(){
  // statuses ordered by criticality (most → least); each row is single-line — dot · is:status · dim note · live count (full note on hover via title)
  const buckets = ['under','diverged','slow','stale','contended','resub','lagging','gone'];
  const item = (pick, st, count) =>
    `<div class="oitem" data-pick="${pick}" title="is:${st} — ${docOf(st)}"><span class="od" style="background:var(--${clsOf(st)})"></span>`+
    `<span class="ot">is:${st}</span><span class="onote">${docOf(st)}</span><span class="oc">${count||''}</span></div>`;
  const rows = buckets.map(b=>item('is:'+b, b, countStatus(b))).join('');
  // by severity — is:critical / is:warn collapse the tiers above into one filter each (replaces the old "needs attention")
  const sev = item('is:critical','critical',countStatus('critical')) + item('is:warn','warn',countStatus('warn'));
  const view = `<div class="oitem" data-pick="scen:healthy" title="all converged — hide every status flag"><span class="od" style="background:var(--ok)"></span><span class="ot">all converged</span><span class="onote">hide every status flag (the healthy view)</span><span class="oc"></span></div>`;
  $('omenu').innerHTML = `<div class="oh">Filter by status</div>${rows}`+
    `<div class="osep"></div><div class="oh">By severity</div>${sev}`+
    `<div class="osep"></div><div class="oh">View</div>${view}`;
}
function renderBar(){
  const chips = [];   // the box holds only FILTER chips now; the selection breadcrumb moved to the bottom bar
  if(statusFilter) chips.push(filterChip(statusFilter));
  $('ochips').innerHTML = chips.join('');
  if(document.activeElement!==$('q')) $('q').value = query;               // don't fight the caret while typing
  $('q').placeholder = chips.length ? 'filter…' : 'filter the whole tree — type a name, or pick a filter';
  renderMenu();
  // in-box match count (while filtering) + reset ✕ (whenever the view differs from default)
  const f = activeFilter();
  const m = (f.st||f.text) ? flat.filter(x=>!x.dim).length : null;
  $('ocount').innerHTML = m!=null ? `<span class="fl">${m}</span> match${m===1?'':'es'}` : '';
  $('oclear').style.display = (statusFilter || query.trim() || scen!=='attention') ? '' : 'none';   // reset clears FILTERS (selection is the bottom crumb)
}
// URL ⇆ state — deep-linkable filters + selection
function syncURL(){
  const p = new URLSearchParams();
  if(query) p.set('q', query);
  if(statusFilter) p.set('is', statusFilter);
  if(scen!=='attention') p.set('scen', scen);
  if(selKey) p.set('sel', selKey);
  const qs = p.toString();
  history.replaceState(null,'', qs ? '?'+qs : location.pathname);
}
function readURL(){
  const p = new URLSearchParams(location.search);
  query = p.get('q') || '';
  statusFilter = p.get('is') || '';
  scen = p.get('scen')==='healthy' ? 'healthy' : 'attention';
  const s = p.get('sel'); if(s!=null) selKey = s;
}
function findNode(key, nodes=FOREST){
  for(const n of nodes){ if(n.key===key) return n; const f=n.kids&&findNode(key,n.kids); if(f) return f; }
  return null;
}
/* (header breadcrumb + scope line folded into renderBar above) */

/* ════════════════════════════════════════════════════════════════════════
   INSPECTOR — the selected row's rich leaf view
   ════════════════════════════════════════════════════════════════════════ */
const seg = (title, body, extra='') => `<div class="seg"><div class="st">${title}${extra}</div>${body}</div>`;
const kv  = rows => `<dl class="kv">${rows.map(([k,v,c])=>`<dt>${k}</dt><dd class="${c||''}">${v}</dd>`).join('')}</dl>`;

/* ── navigable references ────────────────────────────────────────────────
   Every entity named in the inspector / footer (an address, partition,
   client, epoch, commit, subscription) IS a tree node — `ref()` turns the
   token into a link that jumps there. Resolution is scoped to the selected
   row's resource first, then global, so an address resolves to ITS resource's
   server node. A token that resolves to nothing renders as plain text (no
   dead links). Resolution happens at render time and the target key is baked
   into the span, so clicks are a direct lookup. */
const REF_FALLBACK = { commit:'epoch' };                                   // a commit eN·sM that isn't a visible log node → fall back to its epoch eN
function curResNode(){ const rid = selKey ? selKey.split('/')[0] : ''; return rid ? findNode(rid) : null; }
function findTyped(kind, label, nodes){
  for(const n of nodes){ if(n.type===kind && n.label===label) return n;
    if(n.kids){ const f=findTyped(kind,label,n.kids); if(f) return f; } }
  return null;
}
function resolveRefKey(kind, label){
  const r = curResNode();
  let t = (r && findTyped(kind,label,r.kids)) || findTyped(kind,label,FOREST);
  if(!t && REF_FALLBACK[kind]==='epoch'){ const m=/^e(\d+)/.exec(label);     // commit → its epoch
    if(m){ const ep='e'+m[1]; t = (r && findTyped('epoch',ep,r.kids)) || findTyped('epoch',ep,FOREST); } }
  return t ? t.key : null;
}
// a clickable reference token; `label` (default = text) is what we resolve by. Falls back to plain text when nothing matches.
function ref(text, kind, label){
  const key = resolveRefKey(kind, label==null ? text : label);
  return key ? `<span class="ref" data-rkey="${key}">${text}</span>` : text;
}
// linkify free-text notes: addresses (:port), commits (eN·sM), epochs (eN) and known
// partition names of the current resource become refs. ONE ordered-alternation pass
// (commit before bare-epoch so eN·sM isn't split; replacement text is never re-scanned),
// so injecting ref HTML can't corrupt a later match.
function linkify(text){
  if(!text) return text;
  const r = curResNode(), parts = [];
  if(r) for(const g of r.kids) if(g.key.endsWith('/parts')) for(const p of g.kids) parts.push(p.label);
  const dict = parts.sort((a,b)=>b.length-a.length).map(s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')); // longest-first, escaped
  const RX = new RegExp('(e\\d+·s\\d+)|(:\\d{2,})|(\\be\\d+\\b)'+(dict.length?'|\\b('+dict.join('|')+')\\b':''),'g');
  return text.replace(RX, (m, commit, addr, epoch, part) =>
    commit ? ref(m,'commit') : addr ? ref(m,'node') : epoch ? ref(m,'epoch') : part ? ref(m,'partition') : m);
}

function renderInspector(){
  const node = selKey ? findNode(selKey) : null;
  const body = document.querySelector('.body');
  // no selection → collapse the pane so the tree reclaims its column (don't reserve 396px for a placeholder)
  if(!node || !node.entity){ body.classList.add('noinsp'); $('insp').innerHTML = ''; return; }
  body.classList.remove('noinsp');
  const e = node.entity;
  const calm = scen!=='attention';
  let html = '';
  if(e.kind==='resource')  html = inspResource(e.res, calm);
  else if(e.kind==='partition') html = inspPartition(e.p, calm);
  else if(e.kind==='node') html = inspNode(e.n, e.res, calm);
  else if(e.kind==='client') html = inspClient(e.c, calm);
  else if(e.kind==='epoch') html = inspEpoch(e.e, e.res);
  else if(e.kind==='epochnode') html = inspEpochNode(e);
  else if(e.kind==='commit') html = inspCommit(e.c, e.p);
  else if(e.kind==='sub') html = inspSub(e.s, e.c, calm);
  $('insp').innerHTML = html;
}
function ihead(title, kind, st, sub){
  return `<div class="ih ${sevOf(st)||'ok'}"><div class="ik"><span class="sd"></span>${title}<span class="kind">${kind}</span><span class="iclose" title="close · Esc">✕</span></div>`+
    `<div class="isub">${sub}</div></div>`;
}
function inspResource(res, calm){
  const st = calm?'healthy':resStatus(res);
  const flagged = calm?[]:[...res.parts,...res.nodes,...res.clients].filter(x=>x.st&&x.st!=='healthy');
  const sub = calm ? `${res.parts.length} partitions · ${res.members} members · all converged`
    : `${flagged.length} item${flagged.length===1?'':'s'} need attention across partitions / nodes / clients`;
  const attn = flagged.length ? seg('Needs attention', `<div class="reclist">`+
    flagged.map(x=>`<div class="recitem" data-sev="${sevOf(x.st)}"><span class="rsev"></span>`+
      `<span class="rk">${x.id}</span><span class="rd">${ST[x.st].lab}${x.note?' · '+linkify(x.note):''}</span></div>`).join('')+`</div>`) : '';
  return ihead(res.id, 'resource', st, sub)+
    seg('Rollup', kv([['members',res.members],['partitions',res.parts.length],['keys',fmt(res.keys)],
      ['writes/s',res.wps],['conflicts/s', calm?'0':(res.id==='sessions'?'0.4':'0'), calm?'ok':(res.id==='sessions'?'warn':'ok')]]))+
    attn;
}
function inspPartition(p, calm){
  const st = calm?'healthy':p.st;
  const reps = p.reps, mx = Math.max(1,...reps.map(r=>calm?0:(r.lag||0)));
  const sub = calm ? `owner <span class="mono">${ref(p.owner,'node')}</span> · ${p.keys} keys · all replicas at the floor`
    : (p.st==='diverged'?`a replica serves stale reads — ${linkify(p.note)}`
      : p.st==='under'?`held on only ${p.held}/${p.R} — ${linkify(p.note)}`
      : `owner <span class="mono">${ref(p.owner,'node')}</span> · ${linkify(p.note)||p.keys+' keys'}`);
  const log = p.log;
  const logHtml = `<div class="mlog">`+log.slice(0,8).map(c=>{
    const stuck = !calm && c.stuck;
    return `<div class="mr ${stuck?'stuck':''}"><span class="stp">${ref(`<span class="e">e${c.e}·</span>s${c.s}`,'commit',`e${c.e}·s${c.s}`)}</span>`+
      `<span class="kvv"><span class="kk">${c.key.replace('user42.','·')}</span> = ${c.val}${stuck?' <span class="stuckb">'+ref(':49807','node')+' stuck</span>':''}</span>`+
      `<span class="oc ${calm&&(c.out==='conflict'||c.out==='fence')?'applied':c.out}">${calm&&(c.out==='conflict'||c.out==='fence')?'applied':c.out}</span></div>`;
  }).join('')+`</div>`;
  const repHtml = `<div class="reps">`+reps.map(r=>{
    if(r.missing && !calm) return `<div class="rr"><span class="rn">${ref(r.addr,'node')}</span>`+
      `<span class="bar"><i class="bad" style="width:0%"></i></span><span class="lg bad">missing</span></div>`;
    const lag = calm?0:(r.lag||0); const pct = lag===0?100:Math.max(10,100-Math.round(lag/mx*86));
    return `<div class="rr"><span class="rn">${ref(r.addr,'node')}${r.owner?'<span class="ow">owner</span>':''}</span>`+
      `<span class="bar"><i class="${lag?'bad':''}" style="width:${pct}%"></i></span>`+
      `<span class="lg ${lag?'bad':''}">+${lag}</span></div>`;
  }).join('')+`</div>`;
  const owners = p.owners;
  const ownHtml = `<div class="ebe">`+owners.map(o=>`<div class="er ${o.cur?'cur':''} ${o.placed?'placed':o.moved&&!calm?'moved':''}">`+
    `<span class="ep">${ref(o.ep,'epoch')}</span><span class="ono">${ref(o.o,'node')}</span>`+
    `<span class="bdg">${o.placed?'new':o.cur?'current':o.moved&&!calm?'moved':''}</span></div>`).join('')+`</div>`;
  // rejected writes (fence/conflict) folded from the observe 'lost' stream — never committed records,
  // so they only appear on a LIVE capture (foldOutcomes). Reuses the .mlog/.oc styling the log uses.
  const outc = p.outcomes;
  const outcHtml = !calm && outc && outc.length ? seg('Rejected writes · newest first',
    `<div class="mlog">`+outc.slice(0,8).map(o=>
      `<div class="mr"><span class="stp">${ref(`<span class="e">e${o.epoch}·</span>s${o.seq}`,'commit',`e${o.epoch}·s${o.seq}`)}</span>`+
      `<span class="kvv"><span class="kk">${o.key}</span>${o.winner?` <span class="x">lost to ${o.winner}</span>`:''}</span>`+
      `<span class="oc ${o.out}">${o.out}</span></div>`).join('')+`</div>`,
    `<span class="new">⚠ NEW</span>`) : '';
  return ihead(p.id, 'partition', st, sub)+
    seg('The log · newest first', logHtml, `<span class="stn">${p.id} · ${klog(p.log.length)} records</span>`)+
    seg('Replica health · lag', repHtml, `<span class="stn">R=${p.R}</span>`)+
    seg('Owner by epoch', ownHtml, `<span class="new">⚠ NEW</span>`)+
    outcHtml;
}
function inspNode(n, res, calm){
  const st = calm?'healthy':n.st;
  const owns = res.parts.filter(p=>p.owner===n.id);
  const hosts = n.hosts || [];
  const sub = calm ? `owns ${owns.length} · all hosted replicas at the floor`
    : (linkify(n.note) || `owns ${owns.length} partitions`);
  const ownsHtml = `<div class="reps">`+owns.map(p=>`<div class="rr"><span class="rn">${ref(p.id,'partition')}</span>`+
    `<span class="bar"><i style="width:100%"></i></span><span class="lg">${p.wps} w/s</span></div>`).join('')+`</div>`;
  const hostHtml = hosts.length ? seg('Replicates · hosted copies', `<div class="reps">`+hosts.map(h=>{
    const lag = calm?0:h.lag;
    return `<div class="rr"><span class="rn">${ref(h.id,'partition')}<span class="ow" style="color:var(--soft);border-color:var(--line)">owner ${ref(h.owner,'node')}</span></span>`+
      `<span class="bar"><i class="${lag?'bad':''}" style="width:${lag?20:100}%"></i></span><span class="lg ${lag?'bad':''}">+${lag}</span></div>`;
  }).join('')+`</div>`) : '';
  return ihead(n.id, 'server node', st, sub)+
    seg('Footprint', kv([['owns',owns.length+' partitions'],['keys', n.keys!=null?fmt(n.keys):'—'],['writes/s', n.wps!=null?n.wps:'—'],
      ['max lag', '+'+(calm?0:n.lag), (calm?0:n.lag)?'bad':'ok'],['view',ref('e4','epoch')]]))+
    seg('Owns @ '+ref('e4','epoch'), ownsHtml)+ hostHtml;
}
function inspClient(c, calm){
  const st = calm?'healthy':c.st;
  const sub = calm ? `connected to <span class="mono">${ref(c.srv,'node')}</span> · ${c.role} · caught up`
    : linkify(c.note);
  const rows = c.subs.map(s=>`<tr><td class="node">${ref(s.sub,'sub')} <span style="color:var(--soft)">→ ${ref(s.own,'node')}</span></td>`+
    `<td>${s.head}</td><td class="${calm?'maj':s.cls}">${calm&&s.lag!=='released'?'0':s.lag}`+
    `<span class="bdg ${calm||s.cls==='maj'?'cur':'lag'}">${calm||s.cls==='maj'?'CURR':'BEHIND'}</span></td></tr>`).join('');
  return ihead(c.id, 'client', st, sub)+
    seg('Connection', kv([['connected to',ref(c.srv,'node')],['role',c.role],['subscriptions',c.subs.length],
      ['client view', c.st==='stale'&&!calm?ref('e1','epoch'):ref('e4','epoch'), c.st==='stale'&&!calm?'bad':'ok'],
      ['max sub lag','+'+(calm?0:c.lag), (calm?0:c.lag)?'bad':'ok']]))+
    seg('Subscriptions · cursor', `<table class="vt"><thead><tr><th>subscription → owner</th><th>head</th><th>lag</th></tr></thead><tbody>${rows}</tbody></table>`, `<span class="new">⚠ NEW</span>`);
}
function inspEpoch(e, res){
  // a MOVE is a handoff (the partition had data at the prior view); a PLACEMENT is a birth
  // (first written at this view). Distinct rows, never the same partition twice.
  const placed = e.placed || [];
  const rows = [
    ...e.moves.map(m=>`<li class="move"><span class="ep">${e.ep}</span><b>${ref(m[0],'partition')}</b> ownership moved <span class="mono">${ref(m[1],'node')}→${ref(m[2],'node')}</span></li>`),
    ...placed.map(pid=>`<li class="now"><span class="ep">${e.ep}</span><b>${ref(pid,'partition')}</b> <span class="mono">new — first written at this view</span></li>`),
  ];
  const change = rows.length ? `<ul class="tl">`+rows.join('')+`</ul>`
    : `<div class="reason">No ownership changes at this view — stable membership and layout.</div>`;
  const at = layoutAt(res, e.ep);
  const layout = at ? `<div class="ebe">`+res.nodes.map(n=>{
    const owns = at[n.id] || [];
    return `<div class="er"><span class="ep">${ref(n.id,'node')}</span><span class="ono" style="text-align:left;font-size:11px">${owns.map(o=>ref(o,'partition')).join(', ')}</span><span class="bdg">${owns.length}</span></div>`;
  }).join('')+`</div>` : `<div class="reason">${res.members} members.</div>`;
  const tally = [e.moves.length?`${e.moves.length} moved`:'', placed.length?`${placed.length} new`:''].filter(Boolean).join(' · ');
  return ihead(e.ep+(e.cur?' · current':''), 'epoch / view', 'healthy',
    `${e.members} members${tally?' · '+tally:''} · ${linkify(e.note)}`)+
    seg('View change', change, `<span class="new">⚠ NEW</span>`)+
    seg('Ownership layout at '+e.ep, layout);
}
function inspEpochNode(e){
  return ihead(e.n.id+' @ '+e.ep, 'node @ epoch', 'healthy', `owned ${e.owns.length} partitions at view ${e.ep}`)+
    seg('Owned at '+ref(e.ep,'epoch'), `<div class="reason">${e.owns.map(o=>`<span class="mono" style="color:var(--ink)">${ref(o,'partition')}</span>`).join(' · ')||'—'}</div>`);
}
function inspCommit(c, p){
  const OUTW = {local:'committed locally by the owner',applied:'replica-applied, accepted',
    conflict:'lost last-writer-wins — same-epoch conflict',fence:'rejected by the epoch fence (stale view)'};
  const sev = c.out==='conflict'?'diverged':c.out==='fence'?'lagging':'healthy';
  const route = c.out==='fence'
    ? [['done','client','forwarded write '+c.key+'='+c.val+' stamped at the stale '+ref('e'+c.e,'epoch')],
       ['bad','owner','<b>FENCED</b> — view '+ref('e'+c.e,'epoch')+' is older than the cluster view; rejected (DECISIONS X)']]
    : c.out==='conflict'
    ? [['done','client','write '+c.key+'='+c.val+' forwarded to owner'],
       ['move','owner','committed at e'+c.e+'·s'+c.s+' — but a higher seq won LWW'],
       ['bad','resolve','<b>lost·conflict</b> — superseded by '+ref('e4·s1265','commit')+' same epoch']]
    : [['done','client','write '+c.key+'='+c.val],
       ['done','forward','routed to owner '+ref(p.owner,'node')+' via the ring'],
       ['done','owner','committed at e'+c.e+'·s'+c.s],
       ['now','replicas','fan-out → 5/5 acked (W-quorum)']];
  const recd = `{ type:<span class="vv">'update'</span>, key:<span class="kk">'${c.key}'</span>, `+
    `value:<span class="vv">${c.val}</span> }\n<span style="color:var(--soft)">@ e${c.e}·s${c.s} · origin ${c.origin==='CLI'?'client':ref(c.origin,'node')}</span>`;
  return ihead('e'+c.e+'·s'+c.s, 'commit', sev, `<span class="mono">${c.key}</span> = ${c.val} · ${OUTW[c.out]}`)+
    seg('Change record', `<div class="recd">${recd}</div>`)+
    seg('Route', `<ul class="tl">`+route.map(r=>`<li class="${r[0]}"><span class="ep">${r[1]}</span>${r[2]}</li>`).join('')+`</ul>`)+
    seg('Provenance', `<div class="reason">Outcome <b>${c.out}</b>. ${OUTW[c.out]}.</div>`);
}
function inspSub(s, c, calm){
  return ihead(s.sub, 'subscription', calm?'healthy':(s.cls==='min'?'lagging':'healthy'),
    `subscribed via owner <span class="mono">${ref(s.own,'node')}</span> · client <span class="mono">${ref(c.id,'client')}</span>`)+
    seg('Cursor', kv([['owner',ref(s.own,'node')],['log head',s.head],['delivered',s.deliv],
      ['lag', calm&&s.lag!=='released'?'0':s.lag, calm?'ok':(s.cls==='min'?'bad':'ok')]]), `<span class="new">⚠ NEW</span>`);
}

/* ── bottom-right state: a HIGH-LEVEL summary scoped to the selected level ──
   cluster → resource → group → entity each get their own rollup. */
const sst = (st,txt) => `<span class="sst ${sevOf(st)||'ok'}">${txt}</span>`;
// breakdown of a set of {st} items by non-healthy status, e.g. "2 diverged · 1 under"
function tallyStatuses(items){
  const c={}, order=['diverged','under','slow','contended','lagging','stale','resub','gone'];
  for(const x of items){ if(x.st && x.st!=='healthy') c[x.st]=(c[x.st]||0)+1; }
  return Object.keys(c).sort((a,b)=>order.indexOf(a)-order.indexOf(b))
    .map(s=>sst(s, c[s]+' '+ST[s].lab)).join(' · ');
}
function renderStatus(){
  const calm = scen!=='attention';
  const node = selKey ? findNode(selKey) : null, sb = $('statusRight');
  // CLUSTER (nothing selected) — note: group nodes have entity:null but ARE handled below
  if(!node){
    const flagged = calm ? [] : FOREST.filter(r=>resStatus(r.entity.res)!=='healthy');
    sb.innerHTML = flagged.length
      ? `${sst('diverged', flagged.length+' flagged')} · ${FOREST.length} resources`
      : `${sst('healthy','all healthy')} · ${FOREST.length} resources`;
    return;
  }
  const e = node.entity;
  if(node.type==='resource'){
    const res=e.res, st=calm?'healthy':resStatus(res);
    const bad = calm?[]:[...res.parts,...res.nodes,...res.clients].filter(x=>x.st&&x.st!=='healthy');
    sb.innerHTML = `${sst(st, calm?'converged':ST[st].lab)} · ${res.parts.length} partitions · ${res.members} nodes`
      + (bad.length?` · ${tallyStatuses(bad)}`:'');
  } else if(node.type==='group'){
    const kids=node.kids||[], noun=node.label.toLowerCase(), bad=calm?[]:kids.filter(k=>k.st&&k.st!=='healthy');
    sb.innerHTML = `${kids.length} ${noun}` + (bad.length?` · ${tallyStatuses(bad)}`:` · ${sst('healthy','all healthy')}`);
  } else if(node.type==='partition'){
    const p=e.p, st=calm?'healthy':p.st;
    sb.innerHTML = `${sst(st, calm?'healthy':(ST[st]?ST[st].lab:'healthy'))} · held ${p.held}/${p.R} · ${p.keys} keys · ${p.wps} w/s`;
  } else if(node.type==='node'){
    const n=e.n, owns=e.res.parts.filter(p=>p.owner===n.id).length, lag=calm?0:(n.lag||0);
    sb.innerHTML = `${sst(calm?'healthy':n.st, calm||!ST[n.st]?'healthy':ST[n.st].lab)} · owns ${owns} · +${lag} max lag`;
  } else if(node.type==='client'){
    const c=e.c; sb.innerHTML = `${sst(calm?'healthy':c.st, calm||!ST[c.st]?'connected':ST[c.st].lab)} · ${c.role} · ${c.subs.length} sub${c.subs.length===1?'':'s'}`;
  } else if(node.type==='commit'){
    const c=e.c; sb.innerHTML = `commit e${c.e}·s${c.s} · ${sst(c.out==='conflict'?'diverged':c.out==='fence'?'lagging':'healthy', c.out)}`;
  } else if(node.type==='epoch'){
    const ep=e.e; sb.innerHTML = `${ep.members} members${ep.moves.length?` · ${sst('lagging', ep.moves.length+' move'+(ep.moves.length>1?'s':''))}`:` · ${sst('healthy','stable')}`}`;
  } else if(node.type==='epochnode'){
    sb.innerHTML = `owns ${e.owns.length} at ${ref(e.ep,'epoch')}`;
  } else if(node.type==='sub'){
    const s=e.s; sb.innerHTML = `${sst(calm||s.cls!=='min'?'healthy':'lagging','subscription')} · ${s.sub} · lag ${calm?'0':s.lag}`;
  } else sb.innerHTML='';
}

function render(){
  renderTree(); renderBar(); renderCrumb(); renderInspector(); renderStatus();   // renderTree sets `flat` → renderBar reads it
}

/* ════════════════════════════════════════════════════════════════════════
   INTERACTIONS
   ════════════════════════════════════════════════════════════════════════ */
function selectRow(i){ const r=flat[i]; if(!r) return; selKey=r.n.key; syncURL(); render(); }
function toggle(key){ if(expanded.has(key)) expanded.delete(key); else expanded.add(key); render(); }

$('tree').addEventListener('click', e=>{
  if(!getSelection().isCollapsed) return;   // a drag-select ends in a click — don't nuke the highlight with a re-render
  const row = e.target.closest('.trow'); if(!row) return;
  const i = +row.dataset.i; const r = flat[i];
  if(e.target.closest('.tw') && r.hasKids){ toggle(r.n.key); return; }
  selKey = r.n.key;
  // clicking anywhere on a row with kids TOGGLES it (expand AND collapse), keeping it selected — same as the twisty
  if(r.hasKids){ if(expanded.has(r.n.key)) expanded.delete(r.n.key); else expanded.add(r.n.key); }
  syncURL(); render();
});
// inspector "needs attention" items → jump to that entity in the tree
$('insp').addEventListener('click', e=>{
  if(!getSelection().isCollapsed) return;   // let text in the inspector be selected/copied, not swallowed as a jump click
  if(e.target.closest('.iclose')){ selKey=''; syncURL(); render(); return; }   // ✕ → deselect, collapsing the pane
  if(e.target.closest('.ref')) return;                                          // a reference token → handled by the global .ref nav handler
  const it = e.target.closest('.recitem'); if(!it) return;
  const id = it.querySelector('.rk').textContent;
  // find a partition/node/client node with that label and select+reveal it
  const target = findByLabel(id); if(target){ revealKey(target.key); selKey=target.key; syncURL(); render(); }
});
function findByLabel(label, nodes=FOREST){
  for(const n of nodes){ if(n.label===label && n.type!=='group' && n.type!=='resource') return n;
    const f=n.kids&&findByLabel(label,n.kids); if(f) return f; }
  return null;
}
function revealKey(key){ // expand all ancestors of key
  const parts = key.split('/'); let acc='';
  for(let i=0;i<parts.length;i++){ acc = i?acc+'/'+parts[i]:parts[i]; if(findNode(acc)) expanded.add(acc); }
}
// jump the tree to `key`: reveal its ancestors, select it, scroll it into view
function navTo(key){ if(!findNode(key)) return; revealKey(key); selKey=key; syncURL(); render(); scrollSel(); }
// any navigable reference token (inspector OR footer) → jump to the entity it names. Document-level so it covers every pane; the text-selection guard lets references be copied, not just clicked.
document.addEventListener('click', e=>{
  if(!getSelection().isCollapsed) return;
  const rf = e.target.closest('.ref'); if(!rf) return;
  e.stopPropagation(); navTo(rf.dataset.rkey);
});

// ── omni box: chips, suggestions, free text — all mirrored to the URL ──
function pick(tok){
  if(tok.startsWith('is:')){ const b=IS[tok.slice(3)]; if(b) statusFilter=b; }
  else if(tok==='scen:attention') scen='attention';
  else if(tok==='scen:healthy') scen='healthy';
  $('q').focus(); syncURL(); render();
}
function clearChip(w){
  if(w==='sel') selKey='';
  else if(w==='scen') scen='healthy';
  else if(w==='filter') statusFilter='';
  syncURL(); render();
}
// filter chips: remove via ×
$('ochips').addEventListener('click', e=>{ const x=e.target.closest('[data-clear]'); if(x) clearChip(x.dataset.clear); });
// bottom breadcrumb: click a segment to navigate (root "cluster" → deselect)
$('crumb').addEventListener('click', e=>{
  const seg=e.target.closest('[data-segkey]'); if(!seg) return;
  const k=seg.dataset.segkey;
  if(k===''){ selKey=''; } else if(findNode(k)){ revealKey(k); selKey=k; }
  syncURL(); render(); scrollSel();
});
// pick a suggestion (mousedown+preventDefault so the input doesn't blur the menu away first)
$('omenu').addEventListener('mousedown', e=>{ const it=e.target.closest('[data-pick]'); if(!it) return; e.preventDefault(); pick(it.dataset.pick); });
// focus styling; click anywhere in the box focuses the input
$('q').addEventListener('focus', ()=> $('omni').classList.add('focus'));
$('q').addEventListener('blur', ()=> setTimeout(()=>$('omni').classList.remove('focus'), 120));
$('omni').addEventListener('click', e=>{ if(!e.target.closest('.ox')&&!e.target.closest('[data-pick]')&&!e.target.closest('[data-segkey]')) $('q').focus(); });
// free-text filter; a committed "is:xxx " token graduates into a status chip
$('q').addEventListener('input', e=>{
  let raw = e.target.value;
  const m = raw.match(/(^|\s)is:(\w+)\s/);
  if(m && IS[m[2]]){ statusFilter = IS[m[2]]; raw = (raw.slice(0,m.index)+' '+raw.slice(m.index+m[0].length)); e.target.value = raw.replace(/\s+/g,' ').replace(/^\s/,''); }
  query = e.target.value.trim(); syncURL(); render();
});
// in-box ✕ → reset the FILTER (status + text + scenario); selection is cleared from the bottom crumb
$('oclear').addEventListener('click', e=>{ e.stopPropagation(); statusFilter=''; query=''; scen='attention'; $('q').value=''; syncURL(); render(); });

// keyboard: j/k move · h/l collapse-expand · Enter inspect · g diverged · 1/2 scenario · / filter
document.addEventListener('keydown', e=>{
  if((e.ctrlKey||e.metaKey) && (e.key==='o'||e.key==='O')){ e.preventDefault(); $('file').click(); return; }  // ⌘/Ctrl+O → open a snapshot
  if(e.ctrlKey || e.metaKey || e.altKey) return;   // let Ctrl/Cmd+C, +A and other browser shortcuts through untouched
  if(e.target.tagName==='INPUT'){ if(e.key==='Escape') e.target.blur(); return; }
  const k=e.key;
  if(k==='Escape'){ if(selKey){ selKey=''; syncURL(); render(); } return; }   // Esc closes the inspector
  const cur = flat.findIndex(r=>r.n.key===selKey);
  if(k==='j'||k==='ArrowDown'){ e.preventDefault(); selectRow(Math.min(flat.length-1,(cur<0?0:cur+1))); scrollSel(); }
  else if(k==='k'||k==='ArrowUp'){ e.preventDefault(); selectRow(Math.max(0,(cur<0?0:cur-1))); scrollSel(); }
  else if(k==='l'||k==='ArrowRight'){ e.preventDefault(); const r=flat[cur]; if(r&&r.hasKids&&!r.open){expanded.add(r.n.key);render();} }
  else if(k==='h'||k==='ArrowLeft'){ e.preventDefault(); const r=flat[cur]; if(r&&r.hasKids&&r.open){expanded.delete(r.n.key);render();} }
  else if(k==='Enter'){ const r=flat[cur]; if(r&&r.hasKids) toggle(r.n.key); }
  else if(k==='g'){ statusFilter='diverged'; scen='attention'; syncURL(); render(); }
  else if(k==='a'){ statusFilter=''; query=''; $('q').value=''; syncURL(); render(); }
  else if(k==='1'){ scen='healthy'; syncURL(); render(); }
  else if(k==='2'){ scen='attention'; syncURL(); render(); }
  else if(k==='/'){ e.preventDefault(); $('q').focus(); }
});
function scrollSel(){ const el=document.querySelector('.trow[aria-selected=true]'); if(el) el.scrollIntoView({block:'nearest'}); }

/* ════════════════════════════════════════════════════════════════════════
   LOAD — fetch the bundled sample snapshot by default; accept any debug file
   dropped onto the page or opened via the ⤓ file control. The viewer is just
   a projection of whatever snapshot is loaded.
   ════════════════════════════════════════════════════════════════════════ */
const DEFAULT_FILE = 'debug/sessions.fero.json';
let SOURCE = '';
function loadSnapshot(snap, name){
  try{ MODEL = normalize(snap); }
  catch(err){ $('tree').innerHTML = `<div class="empty2">Could not read <b>${name}</b>: ${err.message}</div>`; return; }
  FOREST = MODEL.resources.map(resourceNode);
  const first = MODEL.resources[0];
  expanded = new Set(first ? [first.id] : []);
  readURL();                                   // restore filters + selection from the URL (deep link); else inspector starts closed
  if(selKey && !findNode(selKey)) selKey='';   // drop a stale selection that isn't in this snapshot
  if(selKey) revealKey(selKey);                // expand ancestors so the selected row is visible
  SOURCE = name;
  const sn = $('srcName'); if(sn) sn.innerHTML = '';   // file mode shows no source label; live mode fills this in
  render();
}
function readFile(file){
  const r = new FileReader();
  r.onload = () => { try{ loadSnapshot(JSON.parse(r.result), file.name); }
    catch(e){ $('tree').innerHTML = `<div class="empty2"><b>${file.name}</b> is not valid JSON: ${e.message}</div>`; } };
  r.readAsText(file);
}
$('file').addEventListener('change', e => { const f = e.target.files[0]; if(f) readFile(f); });
// drop a .fero.json debug file anywhere on the page
document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', e => { e.preventDefault(); const f = e.dataTransfer.files[0]; if(f) readFile(f); });

/* ── LIVE MODE — the SAME normalize() seam, fed by the observer bridge over SSE.
   When served by the bridge (tools/observe/bridge.ts at /debug/), an EventSource
   on /events delivers a `debug` event each poll carrying a store-once DebugFile
   (foldLive over the bridge's held snapshots). liveUpdate() re-normalizes it but
   PRESERVES the user's expansion + selection across ticks (a live tree mustn't
   collapse under you), so the file-drop and live paths converge on one renderer. */
let LIVE = false;
function liveUpdate(file){
  let model; try{ model = normalize(file); } catch{ return; } // a partial/garbled frame → skip this tick
  MODEL = model;
  FOREST = MODEL.resources.map(resourceNode);
  const first = MODEL.resources[0];
  if(!expanded || !expanded.size) expanded = new Set(first ? [first.id] : []); // seed once; keep the user's tree thereafter
  // no auto-select: the inspector stays closed until the user clicks a row (selKey, once set, is preserved across ticks)
  if(selKey && !findNode(selKey)) selKey='';   // drop a selection the live model no longer has
  if(!LIVE && selKey) revealKey(selKey);       // first live frame: reveal a deep-linked selection
  LIVE = true;
  const sn = $('srcName'); if(sn) sn.innerHTML = `<b class="liveDot">●</b> live · ${MODEL.view} · ${MODEL.resources.length} resource${MODEL.resources.length!==1?'s':''}`;
  if(!getSelection().isCollapsed) return;   // mid-copy: skip this tick's re-render so a live update can't drop the user's highlight (next tick catches up)
  render();
}
function connectLive(){
  if(typeof EventSource === 'undefined') return;
  let es; try{ es = new EventSource('/events'); } catch{ return; }
  es.addEventListener('debug', e => { try{ liveUpdate(JSON.parse(e.data)); }catch{} });
  // no /events here (viewer opened standalone, not via the bridge) → stay in file mode silently
  es.addEventListener('error', () => { if(!LIVE) es.close(); });
}
// boot: try the live bridge feed AND fetch the bundled sample; the first `debug` event supersedes the sample.
(async function boot(){
  readURL();          // deep-link state available before the first frame (live or file)
  connectLive();
  try{ const r = await fetch(DEFAULT_FILE); if(!r.ok) throw new Error('HTTP '+r.status);
       if(!LIVE) loadSnapshot(await r.json(), DEFAULT_FILE); }
  catch(e){ if(!LIVE) $('tree').innerHTML = `<div class="empty2">Couldn't load <b>${DEFAULT_FILE}</b> (${e.message}).<br>`+
    `Drop a <b>.fero.json</b> debug file anywhere, press <b>⌘/Ctrl+O</b>, or serve via the observer bridge for a <b>live</b> feed.</div>`; }
})();
</script>
