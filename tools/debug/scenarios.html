<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>scenarios — fero v4</title>
<!-- ────────────────────────────────────────────────────────────────────────
     SCENARIO DASHBOARD — the front door of the fero v4 distributed-systems
     test suite. Served at / and /scenarios; fetches /scenarios.json and
     renders every high-level scenario as a card:
       · a topology DIAGRAM generated from the scenario's declarative spec
         (nodes on a ring, mesh links, ≋ dup/delay faults, ✂ partition cuts,
         gold writer badges) + a phase strip (form → write → cut → heal → …)
       · a happy-path / fault-path / meta badge + PASS/FAIL
       · the latest metrics with HONEST deltas vs the baseline run — counted
         metrics are deterministic in this repo, so ANY drift renders as warn
         (signal, never noise, never green); wall-clock ms gets a soft ±%
         because this box's numbers swing 2-3x
       · the whole card is a real link into the debugger (/debug?scenario=id)
     Sibling page of mockups/tree.html — same pure-black design system, same
     tokens, same pills. Colour stays FUNCTIONAL (severity only); gold is the
     brand/chrome accent (mark, writers, hover), NOT a status colour.
     ──────────────────────────────────────────────────────────────────────── -->
<!-- sharp technical type: Inter (UI) + JetBrains Mono (data/labels) — crisper than the rounded system Segoe UI / Consolas fallbacks -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* tokens — copied verbatim from mockups/tree.html so this reads as a sibling page */
  :root{
    /* pure-black high-contrast monochrome: #000 ground, near-pure-white ink, crisp
       hairlines lifted enough to read on true black — maximum black/white range */
    --bg:#000000; --rail:#0a0a0c; --pane:#0c0c0e; --line:#2a2a30; --line-2:#3b3b43;
    --ink:#fbfcfe; --dim:#a2a2ac; --soft:#70707a; --faint:#48484f;
    --gold:#ecc36a; --gold-2:#caa24a;                                /* brand/chrome accent — mark, writers, hover glow (NOT a status colour) */
    --sel:#221b0a; --sel-line:var(--gold); --hover:#141417;
    --crit:#f0655d; --crit-bg:#2a1614; --warn:#e0a93f; --warn-bg:#261f10;
    --ok:#5fc78f; --ok-bg:#13241b; --info:#62a6ec; --info-bg:#11212f;
    --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
    --ui:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.5 var(--ui);
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;display:flex;flex-direction:column}
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
  a{color:var(--info);text-decoration:none} a:hover{text-decoration:underline}
  ::selection{background:var(--sel)}
  /* ELI5 tooltips: ./eli5.mjs injects the card and [data-tip]{cursor:help}; the bar's link chrome keeps its pointer */
  .rbtn[data-tip],.foot[data-tip],.dbg[data-tip]{cursor:pointer}

  /* ── top bar: brand (left) · pass tally + rev/time (center) · debugger link + re-run (right) ── */
  .bar{display:flex;align-items:center;justify-content:center;gap:14px;height:60px;background:#000;position:relative;
    border-bottom:1px solid var(--line);padding:0 26px;flex:0 0 auto;font-size:12.5px}
  .brand{position:absolute;left:26px;top:0;height:100%;display:flex;align-items:center;gap:9px;
    font-weight:600;font-size:13px;color:var(--ink);white-space:nowrap}
  .brand .mk{color:var(--gold-2);font-family:var(--mono);font-size:14px}
  .brand .sep{color:var(--faint);font-weight:400}
  .brand .pg{color:var(--dim);font-weight:500}
  .tally{display:flex;align-items:center;gap:12px;min-width:0}
  .tally .meta{font-family:var(--mono);font-size:11px;color:var(--soft);white-space:nowrap;font-variant-numeric:tabular-nums}
  .tally .errnote{color:var(--crit);font-family:var(--mono);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:340px}
  .bright{position:absolute;right:26px;top:0;height:100%;display:flex;align-items:center;gap:16px}
  .bright .dbg{color:var(--dim);font-family:var(--mono);font-size:11.5px}
  .bright .dbg:hover{color:var(--gold);text-decoration:none}
  .rbtn{display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 11px;background:#121317;
    border:1px solid var(--line-2);border-radius:0;color:var(--dim);font:11.5px var(--mono);cursor:pointer}
  .rbtn:hover{border-color:var(--gold-2);color:var(--ink)}
  .rbtn[disabled]{opacity:.55;cursor:default}
  .rbtn .rg{display:inline-block;font-size:13px;line-height:1}
  .rbtn.busy .rg{animation:spin .9s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* status pills — copied verbatim from tree.html (functional colour only) */
  .pill{display:inline-flex;align-items:center;gap:5px;font-size:9.5px;font-weight:700;letter-spacing:.03em;
    text-transform:uppercase;padding:1px 7px;border-radius:3px;white-space:nowrap;flex:0 0 auto}
  .pill .pd{width:5px;height:5px;border-radius:50%;flex:0 0 auto}
  .pill.ok{color:var(--ok);background:var(--ok-bg);border:1px solid #1f3a2c} .pill.ok .pd{background:var(--ok)}
  .pill.crit{color:var(--crit);background:var(--crit-bg);border:1px solid #4a2622} .pill.crit .pd{background:var(--crit)}
  .pill.warn{color:var(--warn);background:var(--warn-bg);border:1px solid #443613} .pill.warn .pd{background:var(--warn)}
  .pill.info{color:var(--info);background:var(--info-bg);border:1px solid #234055} .pill.info .pd{background:var(--info)}
  .pill.big{font-size:11px;padding:3px 10px;letter-spacing:.04em}   /* the header tally reads as a statement, not a badge */

  /* first-run note — ONE dim line under the bar, never per-card noise */
  .basenote{display:none;text-align:center;color:var(--soft);font-size:11px;font-family:var(--mono);
    padding:7px 26px;border-bottom:1px solid var(--line);flex:0 0 auto}
  .basenote.show{display:block}

  /* ── card grid ── */
  .wrap{flex:1 1 auto;overflow-y:auto;min-height:0}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:14px;padding:18px}
  /* the whole card is a real <a> → middle-click / ctrl-click / keyboard all work */
  .card{display:flex;flex-direction:column;gap:10px;background:var(--pane);border:1px solid var(--line);
    padding:14px 16px 11px;color:var(--ink)}
  .card:hover{border-color:var(--line-2);text-decoration:none}
  .card:focus-visible{outline:2px solid var(--gold);outline-offset:-1px}
  .chead{display:flex;align-items:center;gap:10px}
  .chead .ct{font-weight:600;font-size:13px;flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .chead .pills{display:flex;gap:6px;flex:0 0 auto}
  .cdesc{color:var(--dim);font-size:11.5px;line-height:1.45}
  .cnote{background:var(--crit-bg);border:1px solid #4a2622;color:#f0a39c;font-size:11.5px;line-height:1.45;padding:7px 10px}
  .cnote b{color:var(--crit);font-size:9.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;margin-right:8px}
  .foot{color:var(--soft);font-size:11px;font-family:var(--mono);padding-top:1px}
  .card:hover .foot{color:var(--gold)}

  /* metrics table: micro-label key → mono value → delta cell (absence renders as absence) */
  .mx{display:flex;flex-direction:column}
  .mxr{display:grid;grid-template-columns:1fr auto minmax(58px,auto);gap:12px;align-items:baseline;
    padding:3px 0;border-bottom:1px solid var(--line)}
  .mxr:last-child{border-bottom:0}
  .mk{font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--soft);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mv{font-family:var(--mono);font-size:12px;color:var(--ink);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .md{font-family:var(--mono);font-size:10.5px;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .deq{color:var(--faint)}                                          /* counted metric unchanged — quiet '=' */
  .dchip{color:var(--warn);background:var(--warn-bg);border:1px solid #443613;border-radius:3px;padding:0 5px;font-size:10px}
  .dms{color:var(--soft)} .dms.hot{color:var(--warn)}               /* ms is noisy here — warn only past +100% */

  /* ── diagram: inline SVG topology + phase strip ── */
  .diag{display:flex;flex-direction:column;gap:6px}
  .diag svg{display:block;width:100%}
  .diag .nc{fill:var(--bg);stroke:var(--ink);stroke-width:1.5}
  .diag .wr .nc{stroke:var(--gold-2)}                               /* writer node — gold-tinted rim */
  .diag .wb{fill:var(--gold);stroke:var(--bg);stroke-width:1}       /* writer badge dot on the rim */
  .diag .nl{fill:var(--soft);font-family:var(--mono);font-size:10px}
  .diag .lk{stroke:var(--line-2);stroke-width:1}
  .diag .lf{stroke:var(--line-2);stroke-width:1;stroke-dasharray:4 3}
  .diag .lc{stroke:var(--crit);stroke-width:1.2;stroke-dasharray:5 3;opacity:.85}
  .diag .mbg{fill:var(--pane)}                                      /* backing disc keeps the glyph legible over the link */
  .diag .mf{fill:var(--soft);font-family:var(--mono);font-size:11px;text-anchor:middle}
  .diag .mc{fill:var(--crit);font-family:var(--mono);font-size:11px;text-anchor:middle}
  .phases{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-family:var(--mono);font-size:10px;color:var(--dim);padding:0 2px}
  .ph{display:inline-flex;align-items:center;gap:5px}
  .ph .pdm{width:6px;height:6px;border-radius:1px;transform:rotate(45deg);background:var(--faint);flex:0 0 auto}   /* the tree.html .sd diamond */
  .ph .pdm.ok{background:var(--ok)} .ph .pdm.warn{background:var(--warn)}
  .ph .pdm.crit{background:var(--crit)} .ph .pdm.info{background:var(--info)}
  .ph .pdm.gold{background:var(--gold)}                             /* a write moment — brand accent, not a status */
  .parr{color:var(--faint)}

  /* honest empty / error state */
  .empty{grid-column:1/-1;padding:70px 20px;color:var(--soft);font-size:12px;line-height:1.7;text-align:center}
  .empty .cmd{color:var(--dim)}
</style>
</head>
<body>

<!-- ── top bar ── -->
<div class="bar">
  <div class="brand"><span class="mk">▦</span>fero v4<span class="sep">·</span><span class="pg">scenarios</span></div>
  <div class="tally" id="tally"></div>
  <div class="bright">
    <a class="dbg" href="/debug" data-tip="debugger-link">↗ debugger</a>
    <button class="rbtn" id="rerun" data-tip="rerun"><span class="rg">⟳</span>re-run</button>
  </div>
</div>
<!-- no baseline pinned yet: only the CLI (npm run scenarios) pins one — this page never writes -->
<div class="basenote" id="basenote" data-tip="no-baseline">no baseline yet — run npm run scenarios once to pin one</div>

<!-- ── card grid ── -->
<main class="wrap"><div class="grid" id="grid"></div></main>

<script type="module">
// the ELI5 layer: every data-tip="<key>" on this page resolves in ./eli5.mjs (the shared glossary + hover card)
import { mountTips, phaseKey } from './eli5.mjs';

/* ════════════════════════════════════════════════════════════════════════
   PURE HELPERS — no DOM. The validation harness extracts this whole module
   and drives esc/rel/fmtDelta/diagram directly, so keep them side-effect
   free; all DOM wiring lives behind the typeof-document guard at the bottom.
   ════════════════════════════════════════════════════════════════════════ */

// escape EVERY server-derived string before it touches innerHTML — titles,
// descs, notes, metric keys/values, node ids, phase labels, rev are all data.
const esc = s => String(s)
  .replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')
  .replaceAll('"','&quot;').replaceAll("'",'&#39;');

// tiny relative-time: 42s ago / 2m ago / 3h ago, plain date beyond 24h
function rel(iso, now = Date.now()){
  const t = Date.parse(iso || '');
  if(!Number.isFinite(t)) return '';
  const s = Math.max(0, Math.round((now - t) / 1000));
  if(s < 60) return s <= 5 ? 'just now' : s + 's ago';
  const m = Math.round(s / 60); if(m < 60) return m + 'm ago';
  const h = Math.round(m / 60); if(h < 24) return h + 'h ago';
  return new Date(t).toISOString().slice(0, 10);
}

/* ── delta cell — the point of the page, so be precise and honest ──
   count: deterministic counted invariant → equal is a quiet '=', ANY drift is
          a warn chip 'old → new' regardless of direction (drift on a count is
          always signal, never noise — so never green).
   ms:    wall-clock, noisy on this machine (swings 2-3x) → dim signed ±N%,
          warn tint only past +100%, tooltip says why.
   text:  verbatim values → nothing when equal, warn chip when base differs.
   no base entry → empty cell (absence renders as absence). */
function fmtDelta(m, base){
  if(!base || typeof base !== 'object' || !(m.k in base)) return '';
  const b = base[m.k];
  if(m.kind === 'ms'){
    const v = Number(m.v), bn = Number(b);
    if(!Number.isFinite(v) || !Number.isFinite(bn)) return '';
    if(bn === 0)                                     // no % of zero — fall back to exact compare
      return v === 0 ? '<span class="deq" data-tip="delta:same">=</span>'
                     : `<span class="dchip" data-tip="delta:drift">${esc(b)} → ${esc(m.v)}</span>`;
    const pct = Math.round((v - bn) / bn * 100);
    return `<span class="dms${pct > 100 ? ' hot' : ''}" data-tip="${pct > 100 ? 'delta:ms-hot' : 'delta:ms'}">`+   // the ELI5 says why ms is dim
      `${pct >= 0 ? '+' : ''}${pct}%</span>`;
  }
  if(String(m.v) === String(b))                      // count → quiet '='; text → nothing at all
    return m.kind === 'text' ? '' : '<span class="deq" data-tip="delta:same">=</span>';
  return `<span class="dchip" data-tip="delta:drift">${esc(b)} → ${esc(m.v)}</span>`;
}

/* ── diagram: declarative spec → inline SVG topology + phase strip ──
   ONE generic renderer, no per-scenario special cases. Nodes on a ring
   (N≤2 side by side); mesh → all-pairs hairlines; faults → dashed link + ≋;
   cut → crit dashed link + ✂ drawn OVER the fault marker when both. Writers
   get a gold rim + a gold badge dot. All colours are :root tokens via CSS. */
function diagram(d){
  if(!d || !Array.isArray(d.nodes) || d.nodes.length === 0) return '';
  const W = 320, NR = 16, n = d.nodes.length;
  const twoUp = n <= 2, VH = twoUp ? 96 : 120;
  // positions: side-by-side pair, or evenly on a circle starting at 12 o'clock
  const P = d.nodes.map((id, i) => {
    if(twoUp) return { id, x: n === 1 ? W/2 : (i === 0 ? 104 : 216), y: 46, a: 0 };
    const R = n <= 4 ? 36 : 40, a = -Math.PI/2 + i * 2*Math.PI/n;
    return { id, x: 160 + R*Math.cos(a), y: 60 + R*Math.sin(a), a };
  });
  // pair sets are index-keyed (ids may contain anything); unknown ids are skipped
  const idx = new Map(d.nodes.map((id, i) => [id, i]));
  const norm = pr => {
    if(!Array.isArray(pr)) return null;
    const i = idx.get(pr[0]), j = idx.get(pr[1]);
    return i == null || j == null || i === j ? null : (i < j ? i+':'+j : j+':'+i);
  };
  const faults = new Set((d.faults || []).map(norm).filter(Boolean));
  const cuts   = new Set((d.cut    || []).map(norm).filter(Boolean));
  const pairs  = new Set([...faults, ...cuts]);      // a faulted/cut link exists even without mesh
  if(d.mesh) for(let i = 0; i < n; i++) for(let j = i+1; j < n; j++) pairs.add(i+':'+j);
  // a link segment trimmed back to the node rims + its midpoint (for glyphs)
  const seg = (p, q) => {
    const dx = q.x - p.x, dy = q.y - p.y, L = Math.hypot(dx, dy) || 1, pad = NR + 2;
    return { x1: p.x + dx/L*pad, y1: p.y + dy/L*pad, x2: q.x - dx/L*pad, y2: q.y - dy/L*pad,
             mx: (p.x + q.x)/2, my: (p.y + q.y)/2 };
  };
  const f1 = v => v.toFixed(1);
  let lines = '', fmarks = '', cmarks = '', nodes = '';
  for(const k of pairs){
    const [i, j] = k.split(':').map(Number);
    const s = seg(P[i], P[j]);
    const cls = cuts.has(k) ? 'lc' : faults.has(k) ? 'lf' : 'lk';   // the link BECOMES the worst state's stroke
    lines += `<line class="${cls}" x1="${f1(s.x1)}" y1="${f1(s.y1)}" x2="${f1(s.x2)}" y2="${f1(s.y2)}"/>`;
    if(faults.has(k)) fmarks += `<g data-tip="d:fault">`+
      `<circle class="mbg" cx="${f1(s.mx)}" cy="${f1(s.my)}" r="8"/>`+
      `<text class="mf" x="${f1(s.mx)}" y="${f1(s.my)}" dy=".35em">≋</text></g>`;
    if(cuts.has(k)) cmarks += `<g data-tip="d:cut">`+                // rendered AFTER faults → ✂ sits over ≋
      `<circle class="mbg" cx="${f1(s.mx)}" cy="${f1(s.my)}" r="8"/>`+
      `<text class="mc" x="${f1(s.mx)}" y="${f1(s.my)}" dy=".35em">✂</text></g>`;
  }
  const writers = new Set(d.writers || []);
  for(const p of P){
    const w = writers.has(p.id);
    // label: below for the side-by-side pair; beside (radially left/right) on a ring
    const lab = twoUp
      ? `<text class="nl" x="${f1(p.x)}" y="${f1(p.y + NR + 14)}" text-anchor="middle">${esc(p.id)}</text>`
      : Math.cos(p.a) < -0.3
        ? `<text class="nl" x="${f1(p.x - NR - 6)}" y="${f1(p.y + 3)}" text-anchor="end">${esc(p.id)}</text>`
        : `<text class="nl" x="${f1(p.x + NR + 6)}" y="${f1(p.y + 3)}" text-anchor="start">${esc(p.id)}</text>`;
    nodes += `<g class="nd${w ? ' wr' : ''}" data-tip="${w ? 'd:writer' : 'd:node'}"><circle class="nc" cx="${f1(p.x)}" cy="${f1(p.y)}" r="${NR}"/>`+
      (w ? `<circle class="wb" cx="${f1(p.x + NR*0.707)}" cy="${f1(p.y - NR*0.707)}" r="3"/>` : '')+
      lab + `</g>`;
  }
  const strip = (d.phases || []).map(p =>   // the label explains the phase; the diamond explains its colour
    `<span class="ph" data-tip="${esc(phaseKey(p.label))}"><i class="pdm ${esc(p.sev || '')}"${p.sev ? ` data-tip="psev:${esc(p.sev)}"` : ''}></i><span class="pl">${esc(p.label || '')}</span></span>`
  ).join('<span class="parr">→</span>');
  const alt = `topology: ${n} node${n === 1 ? '' : 's'}`+
    `${cuts.size ? `, ${cuts.size} cut link${cuts.size === 1 ? '' : 's'}` : ''}`+
    `${faults.size ? `, ${faults.size} faulted link${faults.size === 1 ? '' : 's'}` : ''}`;
  return `<div class="diag">`+
    `<svg viewBox="0 0 ${W} ${VH}" style="height:${twoUp ? 92 : 112}px" role="img" aria-label="${esc(alt)}">`+
    lines + fmarks + cmarks + nodes + `</svg>`+
    (strip ? `<div class="phases">${strip}</div>` : '')+
    `</div>`;
}

/* ── card + header templates (pure: payload → html string) ── */
const PILL = { happy:   ['ok',   'happy path'],
               unhappy: ['warn', 'fault path'],
               meta:    ['info', 'meta'] };
function cardHTML(s){
  const id = s.id != null ? String(s.id) : '';
  const title = String(s.title ?? id);
  const kp = PILL[s.kind];
  const kindPill = kp ? `<span class="pill ${kp[0]}" data-tip="kind:${esc(s.kind)}"><span class="pd"></span>${kp[1]}</span>` : '';
  const passPill = s.pass === true  ? `<span class="pill ok" data-tip="pass"><span class="pd"></span>pass</span>`
                 : s.pass === false ? `<span class="pill crit" data-tip="fail"><span class="pd"></span>fail</span>` : '';
  const base = s.base && typeof s.base === 'object' ? s.base : null;
  const rows = (Array.isArray(s.metrics) ? s.metrics : []).map(m =>
    `<div class="mxr"><span class="mk" data-tip="${esc('m:' + (m.k ?? ''))}">${esc(m.k ?? '')}</span>`+
    `<span class="mv">${esc(m.v ?? '')}</span>`+
    `<span class="md">${fmtDelta(m, base)}</span></div>`).join('');
  return `<a class="card" href="/debug?scenario=${esc(encodeURIComponent(id))}">`+
    `<div class="chead"><span class="ct" title="${esc(title)}">${esc(title)}</span>`+
    `<span class="pills">${kindPill}${passPill}</span></div>`+
    diagram(s.diagram)+
    (s.desc ? `<div class="cdesc">${esc(s.desc)}</div>` : '')+
    (s.pass === false ? `<div class="cnote" data-tip="fail-note"><b>fail</b>${esc(s.notes || 'no failure notes from the runner')}</div>` : '')+
    (rows ? `<div class="mx">${rows}</div>` : '')+
    `<div class="foot" data-tip="open-debugger">open in debugger →</div></a>`;
}
function tallyHTML(p, err){
  const list = Array.isArray(p.scenarios) ? p.scenarios : [];
  const total = p.total ?? list.length;
  const pass  = p.pass  ?? list.filter(s => s.pass === true).length;
  const failing = total - pass;
  const pill = failing <= 0
    ? `<span class="pill ok big" data-tip="tally"><span class="pd"></span>${pass}/${total} passing</span>`
    : `<span class="pill crit big" data-tip="tally"><span class="pd"></span>${pass}/${total} — ${failing} failing</span>`;
  const bits = [];
  if(p.rev) bits.push(`<span data-tip="rev">rev ${esc(p.rev)}</span>`);
  const t = rel(p.when); if(t) bits.push(`<span data-tip="when">${t}</span>`);
  if(typeof p.wallMs === 'number') bits.push(`<span data-tip="wall-run">${p.wallMs} ms run</span>`);
  return pill + (bits.length ? `<span class="meta">${bits.join(' · ')}</span>` : '')
    + (err ? `<span class="errnote" title="${esc(err)}">${esc(err)}</span>` : '');
}

/* ════════════════════════════════════════════════════════════════════════
   DOM WIRING — fetch → render; the re-run button refetches with ?rerun=1.
   No polling, no state beyond the last payload.
   ════════════════════════════════════════════════════════════════════════ */
if(typeof document !== 'undefined'){
  const $ = id => document.getElementById(id);
  mountTips(document);                               // the ELI5 hover layer (./eli5.mjs)
  let LAST = null;                                   // the last good payload (kept through a failed re-run)

  async function load(url){
    const r = await fetch(url);
    if(!r.ok) throw new Error('HTTP ' + r.status);
    return await r.json();                           // non-JSON throws here → honest empty state
  }
  function render(p, err){
    LAST = p;
    $('tally').innerHTML = tallyHTML(p, err);
    $('basenote').classList.toggle('show', p.baseline == null);   // one dim line, never per-card noise
    const list = Array.isArray(p.scenarios) ? p.scenarios : [];
    // order as delivered — the server orders happy → unhappy → meta
    $('grid').innerHTML = list.length ? list.map(cardHTML).join('')
      : `<div class="empty">the payload has no scenarios</div>`;
  }
  function renderUnloadable(){
    $('tally').innerHTML = '';
    $('basenote').classList.remove('show');
    $('grid').innerHTML = `<div class="empty">couldn&#39;t load <span class="mono">/scenarios.json</span>`+
      ` — start the server with: <span class="mono cmd">npm run debug</span></div>`;
  }
  async function rerun(){
    const b = $('rerun');
    if(b.disabled) return;
    b.disabled = true; b.classList.add('busy');
    try { render(await load('/scenarios.json?rerun=1')); }
    catch(e){                                        // errors surface in the header, never an alert()
      if(LAST) render(LAST, 're-run failed: ' + (e && e.message || e));
      else renderUnloadable();
    }
    finally { b.disabled = false; b.classList.remove('busy'); }
  }
  $('rerun').addEventListener('click', rerun);
  load('/scenarios.json').then(p => render(p)).catch(renderUnloadable);
}
</script>
</body>
</html>
