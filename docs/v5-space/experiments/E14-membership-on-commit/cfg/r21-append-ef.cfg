SPECIFICATION FeroSpec
CONSTANTS
    Server = {s1, s2, s3, s4}
    InitServer = {s1, s2, s3, s4}
    InitVoters = {s1, s2, s3, s4}
    InitLearners = {}
    Joiners = {}
    AllowDrop = FALSE
    AllowDup = FALSE
    AllowLoseDisk = FALSE
    AllowRestart = FALSE
    AllowSnapshot = FALSE
    AllowStepDown = FALSE
    CoarseAE = TRUE
    CrashLeaderOnly = FALSE
    EagerApply = FALSE
    FaultLimit = 0
